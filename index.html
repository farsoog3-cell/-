<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الاستراتيجية والدبابات الثلاثية الأبعاد</title>
    <!-- ربط ملف التصميم الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- القائمة الرئيسية للبداية -->
    <div id="start-menu" class="menu-overlay">
        <div class="menu-content">
            <h1>لعبة استراتيجية الدبابات</h1>
            <p>اختر إعدادات المعركة واضغط ابدأ للسيطرة على المعسكر!</p>
            
            <div class="flag-selection-section">
                <h3>اختر علم لاعبك:</h3>
                <div id="player-flags" class="flag-options">
                    <button class="flag-btn active-player" onclick="selectFlag('player', 'green')">أخضر</button>
                    <button class="flag-btn" onclick="selectFlag('player', 'blue')">أزرق</button>
                </div>
            </div>

            <button class="start-btn" onclick="startGame()">بدء المعركة</button>
        </div>
    </div>

    <!-- واجهة اللعب والتحكم أثناء المعركة -->
    <div id="ui-overlay" style="display: none;">
        
        <!-- الشريط العلوي (المهمة والرصيد) -->
        <div class="top-bar">
            <div class="mission-text">سيطر على معسكر العدو لتفوز</div>
            <div class="economy-panel">
                <span>الرصيد: <strong id="money-display">500</strong>$</span>
                <button id="buy-tank-btn" class="buy-btn" onclick="buyPlayerTank('normal')">عادية (150$)</button>
                <button id="buy-rocket-tank-btn" class="buy-btn rocket" onclick="buyPlayerTank('rocket')">صاروخية (300$)</button>
            </div>
        </div>

        <!-- أزرار اختيار وضع التحكم -->
        <div class="mode-selector">
            <button id="sel-all-btn" class="mode-btn active" onclick="setSelectionMode('all')">الكل</button>
            <button id="sel-single-btn" class="mode-btn" onclick="setSelectionMode('single')">فردي</button>
        </div>

        <!-- رسالة التنبيهات العائمة -->
        <div id="floating-msg" class="floating-msg"></div>

        <!-- الخريطة المصغرة (Minimap) -->
        <div class="minimap-container">
            <canvas id="minimap-canvas" width="120" height="120"></canvas>
        </div>

        <!-- أزرار التحكم بالكاميرا والحركة (أسفل الشاشة) -->
        <div class="camera-controls">
            <div class="zoom-controls">
                <button class="ctrl-btn" onpointerdown="camMove('zi', true)" onpointerup="camMove('zi', false)">+</button>
                <button class="ctrl-btn" onpointerdown="camMove('zo', true)" onpointerup="camMove('zo', false)">-</button>
            </div>
            <div class="dpad-controls">
                <button class="ctrl-btn up" onpointerdown="camMove('up', true)" onpointerup="camMove('up', false)">⬆</button>
                <button class="ctrl-btn left" onpointerdown="camMove('left', true)" onpointerup="camMove('left', false)">⬅</button>
                <button class="ctrl-btn right" onpointerdown="camMove('right', true)" onpointerup="camMove('right', false)">➡</button>
                <button class="ctrl-btn down" onpointerdown="camMove('down', true)" onpointerup="camMove('down', false)">⬇</button>
            </div>
        </div>
    </div>

    <!-- حاوية عرض اللعبة الثلاثية الأبعاد -->
    <div id="canvas-container"></div>

    <!-- مكتبة Three.js الأساسية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- ملفات اللعبة المقسمة بالترتيب الصحيح -->
    <script src="terrain.js"></script>
    <script src="tanks.js"></script>
    <script src="flags.js"></script>
    <script src="sound.js"></script>
    <script src="game.js"></script>
</body>
</html>
