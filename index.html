<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة الدبابات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- خريطة اللعبة في الخلفية -->
    <canvas id="gameCanvas"></canvas>

    <!-- 1. الشاشة الرئيسية: معركة الدبابات -->
    <div id="modal-main" class="modal-overlay">
        <div class="modal-box">
            <h2 class="title-blue">⚔️ معركة الدبابات ⚔️</h2>
            <button id="btn-open-create" class="btn-primary">🎮 إنشاء غرفة (أونلاين)</button>
            <button id="btn-open-list" class="btn-secondary">🌐 الغرف المتاحة</button>
        </div>
    </div>

    <!-- 2. نافذة إنشاء غرفة جديدة -->
    <div id="modal-create" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 class="title-blue">إنشاء غرفة جديدة</h2>
            
            <label class="input-label">اسم الغرفة:</label>
            <input type="text" id="input-room-name" class="custom-input" placeholder="أدخل اسم الغرفة...">

            <label class="input-label">مال الحرب الابتدائي:</label>
            <div class="options-row">
                <button class="opt-btn money-opt active" data-val="200">$ 200</button>
                <button class="opt-btn money-opt" data-val="500">$ 500</button>
                <button class="opt-btn money-opt" data-val="600">$ 600</button>
            </div>

            <label class="input-label">اختر علمك:</label>
            <div class="options-row">
                <button class="opt-btn flag-opt active" data-color="green">🟢 الأخضر</button>
                <button class="opt-btn flag-opt" data-color="red">🔴 الأحمر</button>
            </div>

            <div class="actions-row">
                <button id="btn-cancel-create" class="btn-gray">إلغاء</button>
                <button id="btn-confirm-create" class="btn-green">🚀 إنشاء الغرفة</button>
            </div>
        </div>
    </div>

    <!-- 3. نافذة الغرف المتاحة -->
    <div id="modal-list" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 class="title-blue">🌐 الغرف المتاحة</h2>
            
            <div id="rooms-container" class="rooms-list-container">
                <p id="no-rooms-msg" class="empty-msg">لا توجد غرف متاحة حالياً</p>
                <!-- ستظهر الغرف هنا ديناميكياً -->
            </div>

            <button id="btn-close-list" class="btn-gray single-action">إغلاق</button>
        </div>
    </div>

    <!-- 4. نافذة داخل الغرفة (غرفة الانتظار) -->
    <div id="modal-room" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2 id="room-title-display" class="title-blue">غرفة: ...</h2>
            <div id="room-money-display" class="subtitle-gold">مال الحرب: 200 $</div>

            <div class="players-card">
                <div class="player-row">
                    <span id="host-name">👑 المضيف ( 🟢 )</span>
                    <span id="host-status" class="status-tag unready">غير مستعد ❌</span>
                </div>
                <div class="divider"></div>
                <div class="player-row">
                    <span id="guest-name" class="waiting-text">بانتظار انضمام الصديق...</span>
                    <span id="guest-status" class="status-tag"></span>
                </div>
            </div>

            <label class="input-label">تغيير علمك:</label>
            <div class="options-row">
                <button class="opt-btn change-flag active" data-color="green">🟢 الأخضر</button>
                <button class="opt-btn change-flag" data-color="red">🔴 الأحمر</button>
            </div>

            <div class="actions-row">
                <button id="btn-toggle-ready" class="btn-yellow">✋ أنا مستعد</button>
                <button id="btn-start-battle" class="btn-disabled" disabled>⚔️ بدء المعركة ❌</button>
            </div>
        </div>
    </div>

    <!-- واجهة التحكم والتسوق أثناء اللعب -->
    <div id="ui-overlay" style="display: none;">
        <div class="top-bar">
            <button class="mode-btn">الكل</button>
            <button class="mode-btn">فردي</button>
            <div class="capture-zone">منطقة الاستحواذ: جاري الاستحواذ...</div>
        </div>
        <div class="shop-box">
            <div class="money-text">المال: <span id="game-money-val">$ 200</span></div>
            <button class="buy-btn green">شراء دبابة ($100)</button>
            <button class="buy-btn orange">شراء صاروخية ($200)</button>
        </div>
        <div class="controls-container">
            <div class="joystick-area"></div>
            <div class="dpad">
                <button class="dbtn up">▲</button>
                <button class="dbtn left">◄</button>
                <button class="dbtn plus">+</button>
                <button class="dbtn right">►</button>
                <button class="dbtn minus">-</button>
                <button class="dbtn down">▼</button>
            </div>
        </div>
    </div>

    <!-- المكتبات والملفات -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="network.js"></script>
    <script src="client.js"></script>
    <script src="game.js"></script>
</body>
</html>
