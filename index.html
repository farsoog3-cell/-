<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدبابات الجماعية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- خريطة وأرضية اللعبة (تُرسم في الخلفية) -->
    <canvas id="gameCanvas"></canvas>

    <!-- شاشة اللوبي (اختيار الغرف واللعب ضد البوت) -->
    <div id="lobby-container">
        <h2>🎮 قائمة الغرف والتشغيل</h2>
        
        <div class="lobby-inputs">
            <input type="text" id="room-name-input" placeholder="ادخل اسم الغرفة...">
            <button id="create-room-btn">إنشاء غرفة ➕</button>
            <button id="play-bot-btn">لعب ضد البوت 🤖</button>
        </div>

        <h3>الغرف المتاحة حالياً:</h3>
        <ul id="rooms-list"></ul>

        <div id="waiting-room" style="display: none;">
            <h4 id="current-room-title">انتظار بقية اللاعبين...</h4>
            <button id="start-game-btn" style="display: none;">بدء اللعبة الان 🔥</button>
        </div>
    </div>

    <!-- واجهة التحكم والشرط والشراء (الظاهرة أثناء اللعب) -->
    <div id="ui-overlay">
        <div class="top-bar">
            <button class="mode-btn">الكل</button>
            <button class="mode-btn">فردي</button>
            <div class="capture-zone">منطقة الاستحواذ</div>
        </div>

        <div class="shop-box">
            <div class="money-text">المال: <span id="money-val">$ 200</span></div>
            <button class="buy-btn green">شراء دبابة ($100)</button>
            <button class="buy-btn orange">شراء صاروخية ($200)</button>
        </div>

        <!-- أزرار الاتجاهات والتحكم للموبايل -->
        <div class="controls-container">
            <div class="joystick-area"></div>
            <div class="dpad">
                <button class="dbtn up">▲</button>
                <button class="dbtn left">◄</button>
                <button class="dbtn plus">+</button>
                <button class="dbtn right">►</button>
                <button class="dbtn minus">-</button>
                <button class="dbtn down">▼</button>
            </div>
        </div>
    </div>

    <!-- مكتبة Socket.io والاتصال -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="network.js"></script>
    <script src="game.js"></script>
</body>
</html>
