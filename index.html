<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - أونلاين الغرف الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            overflow-y: auto; padding: 15px;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 16px 20px; width: 100%; max-width: 420px; text-align: center;
        }

        .menu-card h1 { font-size: 17px; margin-bottom: 10px; color: #38bdf8; }
        .section-title { font-size: 11px; color: #94a3b8; margin: 6px 0 3px 0; text-align: right; }
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

        .flag-btn {
            flex: 1; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }

        .online-box {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #6366f1;
            border-radius: 8px; padding: 10px; margin-top: 8px; text-align: right;
        }
        .online-input {
            width: 100%; padding: 7px; background: #0f172a; border: 1px solid #475569;
            color: white; border-radius: 4px; font-size: 11px; margin-top: 4px; text-align: right;
        }
        .action-btn {
            width: 100%; margin-top: 8px; padding: 8px; border: none; border-radius: 6px;
            background: #6366f1; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .action-btn:hover { background: #4f46e5; }
        .create-btn { background: #059669; }
        .create-btn:hover { background: #047857; }

        .rooms-list-container {
            max-height: 140px; overflow-y: auto; margin-top: 6px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; padding: 4px;
        }
        .room-item {
            display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px solid #1e293b; font-size: 11px;
        }
        .room-item:last-child { border-bottom: none; }
        .join-room-btn {
            background: #0284c7; border: none; color: white; padding: 3px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155; transition: transform 0.1s linear;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px;
        }
        .capture-bar-bg { width: 100%; height: 5px; background: #334155; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .selection-controls { display: flex; gap: 4px; width: 100%; }
        .sel-btn {
            flex: 1; background: rgba(30, 41, 59, 0.85); border: 1px solid #38bdf8; color: white;
            padding: 5px 4px; border-radius: 5px; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer;
        }
        .sel-btn.active { background: #0284c7; }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }
        .buy-btn-small:disabled { background: #64748b; }
        .buy-btn-rocket { background: #ea580c; }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #38bdf8; padding: 3px 8px;
            border-radius: 4px; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn:active { background: #0284c7; }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }

        #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        #victory-screen h1 { font-size: 20px; color: #22c55e; margin-bottom: 6px; text-align: center; padding: 0 10px; }
        .stats-box {
            background: rgba(30, 41, 59, 0.9); border: 1px solid #38bdf8; border-radius: 8px;
            padding: 10px 16px; font-size: 11px; margin: 8px 0; width: 260px; text-align: right; line-height: 1.5;
        }
        .restart-btn { padding: 6px 16px; background: #22c55e; border: none; color: white; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>لوحة غرف المعركة الأونلاين 🌐⚔️</h1>
        
        <div class="section-title">اختر علم معسكرك:</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="selectFlag('green')">الأخضر</button>
            <button class="flag-btn" onclick="selectFlag('red')">الأحمر</button>
        </div>

        <div class="online-box" id="create-room-section">
            <div style="font-size: 11px; color: #38bdf8; font-weight: bold;">إنشاء غرفة جديدة:</div>
            <input type="text" id="room-name-input" class="online-input" placeholder="اسم الغرفة (مثال: معركة الأصدقاء)">
            <input type="password" id="room-pass-input" class="online-input" placeholder="كلمة سر الغرفة (اختياري)">
            <button class="action-btn create-btn" onclick="createNewRoom()">إنشاء وإدراج الغرفة 🏰</button>
        </div>

        <div class="section-title" style="margin-top: 10px;">الغرف المتاحة حالياً للانضمام:</div>
        <div class="rooms-list-container" id="rooms-list">
            <div style="color: #64748b; font-size: 11px; padding: 10px; text-align: center;">جاري البحث عن غرف نشطة...</div>
        </div>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">سيطر على معسكر الخصم لتربح!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="selection-controls">
            <button class="sel-btn active" id="sel-all-btn" onclick="setSelectionMode('all')">الكل</button>
            <button class="sel-btn" id="sel-single-btn" onclick="setSelectionMode('single')">فردي</button>
        </div>

        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" id="buy-tank-btn" onclick="buyPlayerTank('normal')">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" id="buy-rocket-tank-btn" onclick="buyPlayerTank('rocket')">صاروخية (300$)</button>
        </div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">التحكم بالكاميرا وطلب التعزيزات متاحة 🎯</div>
</div>

<div id="victory-screen">
    <h1 id="victory-title">انتهت المعركة!</h1>
    <div class="stats-box" id="stats-content"></div>
    <button class="restart-btn" onclick="location.reload()">معركة جديدة 🔄</button>
</div>

<div id="canvas-container"></div>

<!-- مكتبات Three.js و PeerJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
    let peer, conn, isHost = false;
    let myRole = 'player1';
    let playerFlagType = 'green';
    let availableRooms = [];

    // استخدام PeerJS عام مع بادئة فريدة لعرض الغرف
    const ROOM_PREFIX = "TANK_GAME_ROOM_2026_";
    let myUniqueId = ROOM_PREFIX + Math.random().toString(36).substring(2, 7);

    peer = new Peer(myUniqueId);

    peer.on('open', (id) => {
        console.log("متصل بشبكة الغرف، المعرف:", id);
        startRoomDiscovery();
    });

    peer.on('connection', (connection) => {
        conn = connection;
        isHost = true;
        myRole = 'player1';
        setupConnectionEvents();
        alert("انضم لاعب إلى غرفتك! جاري الدخول للمعركة...");
        startGame();
    });

    function startRoomDiscovery() {
        // محاكاة وتحديث الغرف المتاحة عبر LocalStorage أو الشبكة العامة البسيطة
        setInterval(refreshRoomsList, 3000);
        refreshRoomsList();
    }

    function createNewRoom() {
        let roomName = document.getElementById('room-name-input').value.trim();
        let roomPass = document.getElementById('room-pass-input').value.trim();
        if (!roomName) return alert('الرجاء إدخال اسم الغرفة');

        let roomData = { id: myUniqueId, name: roomName, pass: roomPass };
        localStorage.setItem('last_created_room', JSON.stringify(roomData));
        
        document.getElementById('create-room-section').innerHTML = `
            <div style="color: #22c55e; font-size: 11px; font-weight: bold; text-align: center;">تم إنشاء الغرفة بنجاح! بانتظار انضمام صديق...</div>
            <div style="font-size: 10px; color: #cbd5e1; margin-top: 4px; text-align: center;">اسم الغرفة: ${roomName}</div>
        `;
    }

    function refreshRoomsList() {
        // فحص الغرف المتاحة (يتم تحديثها محلياً للتجربة السريعة أو عبر الذاكرة المشتركة)
        let roomsContainer = document.getElementById('rooms-list');
        // هنا يمكن رؤية الغرف المتاحة
        roomsContainer.innerHTML = `<div class="room-item"><span>غرفة تجريبية أونلاين</span> <button class="join-room-btn" onclick="joinRoom('${myUniqueId}', '')">انضمام</button></div>`;
    }

    function joinRoom(roomId, roomPass) {
        let enteredPass = prompt("أدخل كلمة سر الغرفة (إن وجدت):");
        conn = peer.connect(roomId);
        isHost = false;
        myRole = 'player2';
        setupConnectionEvents();
        
        conn.on('open', () => {
            alert("تم الانضمام للغرفة بنجاح! جاري بدء المعركة...");
            startGame();
        });
    }

    function setupConnectionEvents() {
        conn.on('data', (data) => {
            handleNetworkData(data);
        });
    }

    function sendData(data) {
        if (conn && conn.open) conn.send(data);
    }

    let scene, camera, renderer;
    let cameraRadius = 280, targetCameraRadius = 280, cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };
    let isDragging = false, previousTouchX = 0, previousTouchY = 0;

    let playerTanks = [], enemyTanks = [], bullets = [], obstacles = [], oilRigs = [];
    let selectionMode = 'all', playerMoney = 500, playerBuildCooldown = 0;
    const CORNER_OFFSET = 380, MAP_LIMIT = 460;

    function getTerrainHeight(x, z) {
        let h = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5 + Math.sin(x * 0.008) * 8;
        if (Math.sqrt(x * x + z * z) < 140) h *= 0.2;
        return h;
    }

    function selectFlag(color) {
        playerFlagType = color;
        document.querySelectorAll('#player-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-player', btn.innerText.includes(color === 'green' ? 'الأخضر' : 'الأحمر'));
        });
    }

    function setSelectionMode(mode) {
        selectionMode = mode;
        document.getElementById('sel-all-btn').classList.toggle('active', mode === 'all');
        document.getElementById('sel-single-btn').classList.toggle('active', mode === 'single');
    }

    function startGame() {
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';

        let startX = (myRole === 'player1') ? CORNER_OFFSET : -CORNER_OFFSET;
        let startZ = (myRole === 'player1') ? CORNER_OFFSET : -CORNER_OFFSET;
        targetLookAt.set(startX, getTerrainHeight(startX, startZ), startZ);
        targetCameraRadius = 110; cameraRadius = targetCameraRadius;

        initThreeScene();
        initGameWorld();
    }

    function initThreeScene() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        scene.add(dirLight);

        // بناء الأرضية
        const geo = new THREE.PlaneGeometry(1100, 1100, 30, 30);
        geo.rotateX(-Math.PI / 2);
        let terrainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 }));
        scene.add(terrainMesh);

        setupInteraction();
        animate();
    }

    function initGameWorld() {
        // دبابة البداية لكل لاعب
        let startX = (myRole === 'player1') ? CORNER_OFFSET - 45 : -CORNER_OFFSET + 45;
        let startZ = (myRole === 'player1') ? CORNER_OFFSET - 45 : -CORNER_OFFSET + 45;
        let tank = createTank(startX, startZ, 0x2e3b23, 'player', 'normal');
        playerTanks.push(tank);
    }

    function createTank(x, z, colorHex, team, type = 'normal') {
        const tankGroup = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(6, 2.2, 9), armorMat);
        body.position.y = 1.2; tankGroup.add(body);
        
        tankGroup.position.set(x, getTerrainHeight(x, z), z);
        scene.add(tankGroup);

        const hpLabel = document.createElement('div');
        hpLabel.className = `tank-hp-label ${team === 'player' ? 'hp-player' : 'hp-enemy'}`;
        hpLabel.innerText = `100`;
        document.getElementById('hp-labels-container').appendChild(hpLabel);

        return { mesh: tankGroup, hpLabel: hpLabel, team: team, type: type, hp: 100 };
    }

    function buyPlayerTank(type) {
        let cost = (type === 'rocket') ? 300 : 150;
        if (playerMoney >= cost) {
            playerMoney -= cost;
            updateEconomyUI();
            let spawnX = (myRole === 'player1') ? CORNER_OFFSET - 50 : -CORNER_OFFSET + 50;
            let spawnZ = (myRole === 'player1') ? CORNER_OFFSET - 50 : -CORNER_OFFSET + 50;
            playerTanks.push(createTank(spawnX, spawnZ, 0x2e3b23, 'player', type));
        }
    }

    function updateEconomyUI() {
        document.getElementById('money-display').innerText = playerMoney;
    }

    function handleNetworkData(data) {
        // استقبال مزامنة بيانات الخصم
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => { isDragging = true; previousTouchX = e.clientX; previousTouchY = e.clientY; });
        dom.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            cameraTheta -= (e.clientX - previousTouchX) * 0.008;
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointerup', () => { isDragging = false; });
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function animate() {
        requestAnimationFrame(animate);
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * 0.5;
        camera.position.z = targetLookAt.z + cameraRadius * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
