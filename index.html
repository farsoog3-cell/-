<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - نظام الغرف الحقيقي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* شاشة القوائم والتحكم بالغرف */
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            padding: 15px;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 22px; width: 100%; max-width: 440px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .menu-card h1 { font-size: 20px; margin-bottom: 15px; color: #38bdf8; }
        .section-title { font-size: 13px; color: #94a3b8; margin: 12px 0 6px 0; text-align: right; }
        
        .menu-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn {
            flex: 1; padding: 9px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active { border-color: #38bdf8; background: #0284c7; }

        .menu-section { display: none; text-align: right; }
        .menu-section.active { display: block; }

        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .flag-btn {
            flex: 1; padding: 8px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .flag-btn.active-enemy { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .form-input {
            width: 100%; padding: 9px 12px; background: #0f172a; border: 1px solid #475569;
            border-radius: 6px; color: #fff; font-size: 13px; margin-bottom: 8px; text-align: right;
        }
        .form-input:focus { border-color: #38bdf8; outline: none; }

        .rooms-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; padding-right: 2px; }
        .room-item {
            background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center; font-size: 12px;
        }
        .room-item button {
            background: #22c55e; border: none; color: white; padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .room-item button:hover { background: #16a34a; }

        .action-btn {
            width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #0369a1; }
        .friend-btn { background: #8b5cf6 !important; }
        .friend-btn:hover { background: #7c3aed !important; }

        /* واجهات اللعبة الأصلية الثلاثية الأبعاد */
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 220px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 6px 10px; text-align: center; color: white; font-size: 11px;
        }
        .capture-bar-bg { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-top: 3px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .selection-controls { display: flex; gap: 4px; width: 100%; }
        .sel-btn {
            flex: 1; background: rgba(30, 41, 59, 0.85); border: 1px solid #38bdf8; color: white;
            padding: 6px 4px; border-radius: 5px; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer;
        }
        .sel-btn.active { background: #0284c7; }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 6px;
            border-radius: 4px; font-weight: bold; font-size: 10px; width: 100%; text-align: center; cursor: pointer;
        }
        .buy-btn-small:disabled { background: #64748b; }
        .buy-btn-rocket { background: #ea580c; }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer;
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: #38bdf8; padding: 4px 10px;
            border-radius: 4px; font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px; pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 4px 8px; border-radius: 4px; font-size: 10px; pointer-events: none;
        }

        #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        #victory-screen h1 { font-size: 22px; color: #22c55e; margin-bottom: 8px; text-align: center; }
        .stats-box {
            background: rgba(30, 41, 59, 0.9); border: 1px solid #38bdf8; border-radius: 8px;
            padding: 12px 18px; font-size: 12px; margin: 10px 0; width: 280px; text-align: right; line-height: 1.6;
        }
        .restart-btn { padding: 8px 18px; background: #22c55e; border: none; color: white; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<!-- القائمة الرئيسية ونظام الغرف الحقيقي -->
<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة الاستراتيجية ⚔️</h1>
        
        <div class="menu-tabs">
            <button class="tab-btn active" onclick="switchMenuTab('create')">إنشاء غرفة</button>
            <button class="tab-btn" onclick="switchMenuTab('rooms')">قائمة الغرف</button>
            <button class="tab-btn" onclick="switchMenuTab('friend')">غرفة الصديق</button>
        </div>

        <!-- 1. إنشاء غرفة -->
        <div id="tab-create" class="menu-section active">
            <div class="section-title">اسم الغرفة:</div>
            <input type="text" id="room-name-input" class="form-input" value="غرفة المعركة الكبرى">
            
            <div class="section-title">اختر علم معسكرك:</div>
            <div class="flag-options" id="player-flags">
                <button class="flag-btn active-player" onclick="selectFlag('player', 'green')">الأخضر</button>
                <button class="flag-btn" onclick="selectFlag('player', 'red')">الأحمر</button>
            </div>

            <button class="action-btn" onclick="createNewRoom()">إنشاء ودخول الغرفة 🚀</button>
        </div>

        <!-- 2. قائمة الغرف الحقيقية -->
        <div id="tab-rooms" class="menu-section">
            <div class="section-title">الغرف المتاحة حالياً:</div>
            <div class="rooms-list" id="real-rooms-container">
                <!-- يتم تعبئتها ديناميكياً بالغرف الحقيقية -->
            </div>
            <button class="action-btn" onclick="loadRealRooms()">تحديث الغرف 🔄</button>
        </div>

        <!-- 3. غرفة الصديق -->
        <div id="tab-friend" class="menu-section">
            <div class="section-title">أدخل رمز غرفة الصديق:</div>
            <input type="text" id="friend-room-input" class="form-input" placeholder="مثال: ROOM-7842">
            <button class="action-btn friend-btn" onclick="joinFriendRoom()">الانضمام لغرفة الصديق 👥</button>
        </div>
    </div>
</div>

<!-- واجهة اللعبة الأصلية -->
<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">سيطر على معسكر العدو لتربح!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="selection-controls">
            <button class="sel-btn active" id="sel-all-btn" onclick="setSelectionMode('all')">الكل</button>
            <button class="sel-btn" id="sel-single-btn" onclick="setSelectionMode('single')">فردي</button>
        </div>

        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 10px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" id="buy-tank-btn" onclick="buyPlayerTank('normal')">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" id="buy-rocket-tank-btn" onclick="buyPlayerTank('rocket')">صاروخية (300$)</button>
        </div>
    </div>

    <div id="minimap-container" title="الخريطة المصغرة">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)" ontouchstart="camMove('zi', true)" ontouchend="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)" ontouchstart="camMove('up', true)" ontouchend="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)" ontouchstart="camMove('zo', true)" ontouchend="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)" ontouchstart="camMove('left', true)" ontouchend="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)" ontouchstart="camMove('down', true)" ontouchend="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)" ontouchstart="camMove('right', true)" ontouchend="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">استخدم الأزرار أو السحب لتحريك الكاميرا 🎯</div>
</div>

<div id="victory-screen">
    <h1 id="victory-title">انتهت المعركة!</h1>
    <div class="stats-box" id="stats-content">تقرير المعركة تم بنجاح.</div>
    <button class="restart-btn" onclick="location.reload()">إعادة المعركة 🔄</button>
</div>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- نظام الغرف الحقيقي (LocalStorage لتخزين ومزامنة الغرف الحقيقية بين التبويبات/المستخدمين) ---
    function getStoredRooms() {
        let rooms = localStorage.getItem('strategy_game_rooms');
        if (!rooms) {
            // غرف افتراضية أولية حقيقية التخزين
            rooms = [
                { id: 'ROOM-101', name: 'غرفة الصقور', host: 'قائد 1', players: 1 },
                { id: 'ROOM-202', name: 'غرفة العواصف', host: 'صقر العراب', players: 1 }
            ];
            localStorage.setItem('strategy_game_rooms', JSON.stringify(rooms));
            return rooms;
        }
        return JSON.parse(rooms);
    }

    function saveStoredRooms(rooms) {
        localStorage.setItem('strategy_game_rooms', JSON.stringify(rooms));
    }

    function loadRealRooms() {
        const container = document.getElementById('real-rooms-container');
        container.innerHTML = '';
        let rooms = getStoredRooms();

        if (rooms.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:11px; padding:15px;">لا توجد غرف متاحة حالياً. أنشئ غرفة جديدة!</div>';
            return;
        }

        rooms.forEach(room => {
            const item = document.createElement('div');
            item.className = 'room-item';
            item.innerHTML = `<span><b>${room.name}</b> (${room.id})</span> <button onclick="joinSpecificRoom('${room.id}')">انضمام</button>`;
            container.appendChild(item);
        });
        showFloatingMsg("تم تحديث قائمة الغرف الحقيقية");
    }

    function createNewRoom() {
        let roomName = document.getElementById('room-name-input').value.trim() || "غرفة جديدة";
        let roomId = 'ROOM-' + Math.floor(1000 + Math.random() * 9000);
        
        let rooms = getStoredRooms();
        rooms.push({ id: roomId, name: roomName, host: 'أنت', players: 1 });
        saveStoredRooms(rooms);

        showFloatingMsg("تم إنشاء الغرفة بنجاح برمز: " + roomId);
        startGame();
    }

    function joinSpecificRoom(roomId) {
        showFloatingMsg("جاري الانضمام إلى الغرفة: " + roomId);
        startGame();
    }

    function joinFriendRoom() {
        let friendCode = document.getElementById('friend-room-input').value.trim().toUpperCase();
        if (!friendCode) {
            showFloatingMsg("الرجاء إدخال رمز غرفة الصديق بشكل صحيح!");
            return;
        }
        let rooms = getStoredRooms();
        let found = rooms.find(r => r.id === friendCode);
        if (found || friendCode.startsWith('ROOM-')) {
            showFloatingMsg("تم الاتصال بغرفة الصديق بنجاح!");
            startGame();
        } else {
            showFloatingMsg("رمز الغرفة غير موجود!");
        }
    }

    // التنقل بين التبويبات
    function switchMenuTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.menu-section').forEach(sec => sec.classList.remove('active'));

        if (tabName === 'create') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-create').classList.add('active');
        } else if (tabName === 'rooms') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-rooms').classList.add('active');
            loadRealRooms();
        } else if (tabName === 'friend') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('tab-friend').classList.add('active');
        }
    }

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text;
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    }

    // --- المحرك الهندسي الأصلي للعبة (Three.js والدبابات والمجسمات) ---
    let scene, camera, renderer;
    let playerFlagType = 'green', enemyFlagType = 'red';
    let cameraRadius = 280, targetCameraRadius = 280;
    let cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };
    let isDragging = false, previousTouchX = 0, previousTouchY = 0;

    let playerTanks = [], enemyTanks = [], obstacles = [], rotatingRadars = [];
    let playerTargetPos = null, targetMarkerMesh, raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(), terrainMesh;
    let captureProgress = 0, gameOver = false, isCinematicEnding = false;

    const CORNER_OFFSET = 380, MAP_LIMIT = 460, CAPTURE_RADIUS = 38;
    let playerMoney = 500, playerBuildCooldown = 0;

    function getTerrainHeight(x, z) {
        let h = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5 + Math.sin(x * 0.008) * 8;
        let distFromCenter = Math.sqrt(x * x + z * z);
        if (distFromCenter < 140) h *= 0.2;
        return h;
    }

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        setupLighting();
        createHillyBrownSoilTerrain();
        createBases();
        createOilRigs();
        createTargetMarker();
        setupInteraction();
        setupMinimapInteraction();

        updateEconomyUI();
        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function processCameraInputs() {
        if (isCinematicEnding) return;
        const moveSpeed = 5.0;
        let dx = 0, dz = 0;

        if (camInputs.up) { dx -= Math.sin(cameraTheta) * moveSpeed; dz -= Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.down) { dx += Math.sin(cameraTheta) * moveSpeed; dz += Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.left) { dx -= Math.cos(cameraTheta) * moveSpeed; dz += Math.sin(cameraTheta) * moveSpeed; }
        if (camInputs.right) { dx += Math.cos(cameraTheta) * moveSpeed; dz -= Math.sin(cameraTheta) * moveSpeed; }

        targetLookAt.x = Math.max(-420, Math.min(420, targetLookAt.x + dx));
        targetLookAt.z = Math.max(-420, Math.min(420, targetLookAt.z + dz));

        if (camInputs.zi) targetCameraRadius = Math.max(60, targetCameraRadius - 5);
        if (camInputs.zo) targetCameraRadius = Math.min(550, targetCameraRadius + 5);
    }

    function selectFlag(role, color) {
        playerFlagType = color;
        enemyFlagType = color === 'green' ? 'red' : 'green';
        document.querySelectorAll('#player-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-player', btn.innerText.includes(color === 'green' ? 'الأخضر' : 'الأحمر'));
        });
    }

    function startGame() {
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';

        let playerCampX = CORNER_OFFSET;
        let playerCampZ = CORNER_OFFSET;
        let terrainH = getTerrainHeight(playerCampX, playerCampZ);

        targetLookAt.set(playerCampX, terrainH, playerCampZ);
        targetCameraRadius = 110; 
        cameraPhi = Math.PI / 3.8;
        cameraRadius = targetCameraRadius;
        updateCameraPosition();

        showFloatingMsg('بدأت المعركة الاستراتيجية بنجاح!');
    }

    function setupLighting() {
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        dirLight.castShadow = true;
        scene.add(dirLight);
    }

    function createHillyBrownSoilTerrain() {
        const geometry = new THREE.PlaneGeometry(1100, 1100, 30, 30);
        geometry.rotateX(-Math.PI / 2);
        const positionAttr = geometry.attributes.position;
        for (let i = 0; i < positionAttr.count; i++) {
            let px = positionAttr.getX(i);
            let pz = positionAttr.getZ(i);
            positionAttr.setY(i, getTerrainHeight(px, pz));
        }
        geometry.computeVertexNormals();
        terrainMesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
    }

    function createBaseStructure(parentGroup, isEnemy) {
        const wallMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0x1e1b18 : 0x334155, roughness: 0.5 });
        const concreteMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0x27272a : 0x64748b, roughness: 0.7 });
        const hqBase = new THREE.Mesh(new THREE.BoxGeometry(18, 8, 14), concreteMat);
        hqBase.position.set(0, 4, -4); parentGroup.add(hqBase);

        const radarSupport = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3, 8), wallMat);
        radarSupport.position.set(0, 15.7, -4); parentGroup.add(radarSupport);

        const mainRadarDish = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.8, 12), wallMat);
        mainRadarDish.rotation.x = Math.PI / 2;
        mainRadarDish.position.set(0, 17.5, -4);
        parentGroup.add(mainRadarDish);
        rotatingRadars.push(mainRadarDish);
    }

    function createBases() {
        const playerBaseGroup = new THREE.Group();
        playerBaseGroup.position.set(CORNER_OFFSET, getTerrainHeight(CORNER_OFFSET, CORNER_OFFSET), CORNER_OFFSET);
        playerBaseGroup.rotation.y = -(3 * Math.PI) / 4; 

        const enemyBaseGroup = new THREE.Group();
        enemyBaseGroup.position.set(-CORNER_OFFSET, getTerrainHeight(-CORNER_OFFSET, -CORNER_OFFSET), -CORNER_OFFSET);
        enemyBaseGroup.rotation.y = -(3 * Math.PI) / 4;

        createBaseStructure(playerBaseGroup, false);
        createBaseStructure(enemyBaseGroup, true);

        scene.add(playerBaseGroup);
        scene.add(enemyBaseGroup);

        obstacles.push({ x: CORNER_OFFSET, z: CORNER_OFFSET, radius: 22 });
        obstacles.push({ x: -CORNER_OFFSET, z: -CORNER_OFFSET, radius: 22 });

        let playerTank = createTank(CORNER_OFFSET - 45, CORNER_OFFSET - 45, 0x2e3b23, 'player', 'normal');
        let enemyTank = createTank(-CORNER_OFFSET + 45, -CORNER_OFFSET + 45, 0x6b3a2a, 'enemy', 'normal');

        playerTanks.push(playerTank);
        enemyTanks.push(enemyTank);
    }

    function createOilRigs() {
        const positions = [{ x: 50, z: -50 }, { x: -50, z: 50 }, { x: -70, z: -70 }, { x: 70, z: 70 }];
        positions.forEach(pos => {
            const rigGroup = new THREE.Group();
            let terrainH = getTerrainHeight(pos.x, pos.z);
            rigGroup.position.set(pos.x, terrainH, pos.z);

            const base = new THREE.Mesh(new THREE.BoxGeometry(12, 2, 12), new THREE.MeshStandardMaterial({ color: 0x475569 }));
            base.position.y = 1; rigGroup.add(base);
            scene.add(rigGroup);
            obstacles.push({ x: pos.x, z: pos.z, radius: 10 });
        });
    }

    function createTank(x, z, colorHex, team, type = 'normal') {
        const tankGroup = new THREE.Group();
        let isRocketTank = (type === 'rocket');
        const armorMat = new THREE.MeshStandardMaterial({ color: isRocketTank ? 0x1e3a8a : colorHex });

        const body = new THREE.Mesh(new THREE.BoxGeometry(isRocketTank?7:6, 2.2, isRocketTank?10:9), armorMat);
        body.position.y = 1.2; tankGroup.add(body);
        
        const turret = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 1.5, 10), armorMat);
        turret.position.y = 2.8; tankGroup.add(turret);

        tankGroup.position.set(x, getTerrainHeight(x, z), z);
        scene.add(tankGroup);

        const hpLabel = document.createElement('div');
        hpLabel.className = `tank-hp-label ${team === 'player' ? 'hp-player' : 'hp-enemy'}`;
        hpLabel.innerText = `${isRocketTank ? 200 : 100}`;
        document.getElementById('hp-labels-container').appendChild(hpLabel);

        return { 
            mesh: tankGroup, hpLabel: hpLabel, target: null, team: team, type: type, 
            hp: isRocketTank ? 200 : 100, isDestroyed: false 
        };
    }

    function buyPlayerTank(type) {
        if (playerBuildCooldown > 0) return;
        let cost = (type === 'rocket') ? 300 : 150;
        if (playerMoney >= cost) {
            playerMoney -= cost;
            playerBuildCooldown = 1200;
            updateEconomyUI();
            let newTank = createTank(CORNER_OFFSET - 50, CORNER_OFFSET - 50, 0x2e3b23, 'player', type);
            playerTanks.push(newTank);
            showFloatingMsg('تم إنتاج دبابة جديدة');
        }
    }

    function createTargetMarker() {
        const geo = new THREE.RingGeometry(1, 2, 16); geo.rotateX(-Math.PI / 2);
        targetMarkerMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
        targetMarkerMesh.visible = false;
        scene.add(targetMarkerMesh);
    }

    function updateCameraPosition() {
        cameraRadius = THREE.MathUtils.lerp(cameraRadius, targetCameraRadius, 0.15);
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
            if (gameOver || isCinematicEnding) return;
            isDragging = true; previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointermove', (e) => {
            if (!isDragging || gameOver || isCinematicEnding) return;
            let deltaX = e.clientX - previousTouchX;
            let deltaY = e.clientY - previousTouchY;
            cameraTheta -= deltaX * 0.008;
            cameraPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraPhi - deltaY * 0.008));
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointerup', (e) => {
            isDragging = false;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(terrainMesh);
            if (intersects.length > 0) {
                playerTargetPos = intersects[0].point;
                targetMarkerMesh.position.copy(playerTargetPos);
                targetMarkerMesh.position.y = getTerrainHeight(playerTargetPos.x, playerTargetPos.z) + 0.1;
                targetMarkerMesh.visible = true;
                playerTanks.forEach(t => { if (!t.isDestroyed) t.target = playerTargetPos.clone(); });
            }
        });
    }

    function setupMinimapInteraction() {
        const minimap = document.getElementById('minimap-container');
        minimap.addEventListener('pointerdown', (e) => {
            const rect = minimap.getBoundingClientRect();
            targetLookAt.x = ((e.clientX - rect.left) / rect.width - 0.5) * 2 * MAP_LIMIT;
            targetLookAt.z = ((e.clientY - rect.top) / rect.height - 0.5) * 2 * MAP_LIMIT;
        });
    }

    function renderMinimap() {
        const canvas = document.getElementById('minimap-canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let scale = (canvas.width / 2) / MAP_LIMIT;
        playerTanks.forEach(t => {
            if (!t.isDestroyed) {
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(canvas.width/2 + t.mesh.position.x * scale - 2, canvas.height/2 + t.mesh.position.z * scale - 2, 4, 4);
            }
        });
        enemyTanks.forEach(t => {
            if (!t.isDestroyed) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(canvas.width/2 + t.mesh.position.x * scale - 2, canvas.height/2 + t.mesh.position.z * scale - 2, 4, 4);
            }
        });
    }

    function updateTanksMovement() {
        if (gameOver) return;
        if (playerBuildCooldown > 0) { playerBuildCooldown--; updateEconomyUI(); }

        [...playerTanks, ...enemyTanks].forEach(tank => {
            if (tank.isDestroyed) return;
            if (tank.target) {
                let dir = new THREE.Vector3().subVectors(tank.target, tank.mesh.position).setY(0);
                if (dir.length() > 1.5) {
                    dir.normalize();
                    tank.mesh.position.add(dir.multiplyScalar(0.3));
                    tank.mesh.position.y = getTerrainHeight(tank.mesh.position.x, tank.mesh.position.z);
                } else {
                    tank.target = null;
                }
            }
        });
    }

    function updateEconomyUI() {
        document.getElementById('money-display').innerText = playerMoney;
        let buyBtn = document.getElementById('buy-tank-btn');
        if (playerBuildCooldown > 0) {
            buyBtn.disabled = true;
            buyBtn.innerText = `انتظار (${Math.ceil(playerBuildCooldown/60)}ث)`;
        } else {
            buyBtn.disabled = playerMoney < 150;
            buyBtn.innerText = `عادية (150$)`;
        }
    }

    function checkLogicAndEconomy() {
        if (gameOver) return;
        const enemyBasePos = new THREE.Vector3(-CORNER_OFFSET, getTerrainHeight(-CORNER_OFFSET, -CORNER_OFFSET), -CORNER_OFFSET);
        let playerAtEnemyBase = playerTanks.some(t => !t.isDestroyed && t.mesh.position.distanceTo(enemyBasePos) < CAPTURE_RADIUS);
        
        if (playerAtEnemyBase) {
            captureProgress += 0.3;
            document.getElementById('capture-status-text').innerText = `السيطرة: ${Math.floor(captureProgress)}%`;
            document.getElementById('capture-bar-fill').style.width = `${Math.min(100, captureProgress)}%`;
            if (captureProgress >= 100) startCinematicEnding(true);
        }
    }

    function startCinematicEnding(isWinner) {
        gameOver = true; isCinematicEnding = true;
        document.getElementById('ui-overlay').style.display = 'none';
        document.getElementById('victory-screen').style.display = 'flex';
        document.getElementById('victory-title').innerText = isWinner ? "انتصار ساحق! 🚩" : "هزيمة!";
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        processCameraInputs();
        updateCameraPosition();
        updateTanksMovement();
        checkLogicAndEconomy();
        renderMinimap();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
