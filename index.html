<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - أونلاين</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة Socket.io للاتصال بالسيرفر -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        /* إخفاء واجهة اللعبة والخلفية حتى بدء المعركة */
        #ui-overlay, #canvas-container {
            display: none;
        }

        /* تنسيق قائمة الغرف المتاحة */
        .rooms-container { 
            max-height: 120px; 
            overflow-y: auto; 
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid #334155; 
            border-radius: 6px; 
            padding: 6px; 
            margin-bottom: 12px; 
        }
        .room-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 6px; 
            border-bottom: 1px solid #1e293b; 
            color: #fff; 
            font-size: 13px; 
        }
        .room-item:last-child {
            border-bottom: none;
        }
        .room-item button { 
            background: #16a34a; 
            color: white; 
            border: none; 
            padding: 4px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<!-- القائمة الرئيسية -->
<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة الاستراتيجية ⚔️🚩</h1>
        
        <!-- رابط السيرفر مخفي تلقائياً بالخلفية بدون كشفه للاعب -->
        <input type="hidden" id="server-url" value="https://tank-game-server-o650.onrender.com">

        <!-- إنشاء غرفة جديدة -->
        <div class="section-title">إنشاء غرفة جديدة:</div>
        <div style="display: flex; gap: 6px; margin-bottom: 12px;">
            <input type="text" id="room-code" placeholder="اسم أو رمز الغرفة..." style="flex: 1; padding: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: white;">
            <button onclick="if(typeof playClickSound === 'function') playClickSound(); createCustomRoom();" style="background: #2563eb; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">إنشاء ➕</button>
        </div>

        <!-- قائمة الغرف المتاحة للانضمام -->
        <div class="section-title">الغرف المتاحة حالياً (اختر غرفة للتحدي):</div>
        <div class="rooms-container" id="rooms-list">
            <div style="text-align: center; color: #94a3b8; font-size: 12px; padding: 10px;">جاري تحميل الغرف المتاحة...</div>
        </div>

        <!-- اختيار علم المعسكر -->
        <div class="section-title">اختر علم معسكرك:</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="if(typeof playClickSound === 'function') playClickSound(); selectFlag('player', 'green');">الأخضر (3 نجوم)</button>
            <button class="flag-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); selectFlag('player', 'red');">الأحمر (نجمتان)</button>
        </div>

        <!-- زر الانضمام/البدء -->
        <button id="start-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); connectAndStartGame();">دخول المعركة أونلاين 🚀</button>
        <div id="connection-status" style="margin-top: 10px; font-size: 12px; color: #f59e0b;"></div>
    </div>
</div>

<!-- واجهة اللعب أثناء المعركة -->
<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">سيطر على معسكر العدو لتربح!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="selection-controls">
            <button class="sel-btn active" id="sel-all-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); setSelectionMode('all');">الكل</button>
            <button class="sel-btn" id="sel-single-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); setSelectionMode('single');">فردي</button>
        </div>

        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" id="buy-tank-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); buyPlayerTank('normal');">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" id="buy-rocket-tank-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); buyPlayerTank('rocket');">صاروخية (300$)</button>
        </div>
    </div>

    <!-- الخريطة المصغرة -->
    <div id="minimap-container" title="الخريطة المصغرة">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" 
            onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)" onmouseleave="camMove('zi', false)"
            ontouchstart="camMove('zi', true)" ontouchend="camMove('zi', false)">➕ تقريب</button>
        
        <button class="cam-btn up" 
            onmousedown="camMove('up', true)" onmouseup="camMove('up', false)" onmouseleave="camMove('up', false)"
            ontouchstart="camMove('up', true)" ontouchend="camMove('up', false)">⬆️</button>
        
        <button class="cam-btn zoom-out" 
            onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)" onmouseleave="camMove('zo', false)"
            ontouchstart="camMove('zo', true)" ontouchend="camMove('zo', false)">➖ إبعاد</button>
        
        <button class="cam-btn left" 
            onmousedown="camMove('left', true)" onmouseup="camMove('left', false)" onmouseleave="camMove('left', false)"
            ontouchstart="camMove('left', true)" ontouchend="camMove('left', false)">⬅️</button>
        
        <button class="cam-btn down" 
            onmousedown="camMove('down', true)" onmouseup="camMove('down', false)" onmouseleave="camMove('down', false)"
            ontouchstart="camMove('down', true)" ontouchend="camMove('down', false)">⬇️</button>
        
        <button class="cam-btn right" 
            onmousedown="camMove('right', true)" onmouseup="camMove('right', false)" onmouseleave="camMove('right', false)"
            ontouchstart="camMove('right', true)" ontouchend="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">اسحب بالشاشة أو استخدم الخريطة المصغرة والتحكم 🎯</div>
</div>

<div id="victory-screen">
    <h1 id="victory-title">انتهت المعركة!</h1>
    <div class="stats-box" id="stats-content"></div>
    <canvas id="victory-flag-canvas"></canvas>
    <button class="restart-btn" onclick="if(typeof playClickSound === 'function') playClickSound(); location.reload();">إعادة المعركة 🔄</button>
</div>

<div id="canvas-container"></div>

<!-- المكتبات واستدعاء الصوت واللعبة -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
