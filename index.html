<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0f172a; font-family: Tahoma, sans-serif;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* قائمة البداية */
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.92); z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        #start-menu h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .menu-section { background: rgba(30, 41, 59, 0.7); padding: 15px; border-radius: 12px; margin-bottom: 15px; width: 85%; max-width: 350px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .menu-section p { margin: 0 0 10px 0; font-size: 14px; font-weight: bold; }
        .flags-grid { display: flex; justify-content: center; gap: 10px; }
        .flag-btn { padding: 8px 12px; border: 2px solid #64748b; background: #334155; color: white; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .flag-btn.active-player { border-color: #22c55e; background: #14532d; font-weight: bold; }
        .flag-btn.active-enemy { border-color: #ef4444; background: #7f1d1d; font-weight: bold; }
        
        #start-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none;
            padding: 12px 40px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); margin-top: 10px; transition: 0.2s;
        }
        #start-btn:active { transform: scale(0.95); }

        /* واجهة اللعب أثناء المعركة */
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }
        .interactive-ui { pointer-events: auto; }
        
        /* شريط الاقتصاد والأزرار العلوي */
        #top-bar {
            position: absolute; top: 10px; right: 10px; left: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-box { background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; color: white; font-size: 14px; font-weight: bold; }
        
        /* أزرار الشراء والتحكم بالوحدات */
        #controls-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(15, 23, 42, 0.85); padding: 10px; border-radius: 12px; border: 1px solid #334155;
        }
        .action-btn { background: #334155; color: white; border: 1px solid #475569; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
        .action-btn.active { background: #0284c7; border-color: #38bdf8; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* الخريطة المصغرة */
        #minimap-container {
            position: absolute; top: 60px; left: 15px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.8); border: 2px solid #334155; border-radius: 8px; overflow: hidden;
        }
        #minimap-canvas { width: 100%; height: 100%; }

        /* الرسائل التنبيهية العائمة */
        #floating-msg {
            position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: #38bdf8; padding: 8px 16px; border-radius: 6px;
            font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
    </style>

    <!-- مكتبة Three.js الأساسية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- ملف الأصوات الجديد -->
    <script src="sound.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="start-menu">
        <h1>معركة السيطرة الاستراتيجية ⚔️🚩</h1>
        
        <div class="menu-section">
            <p>اختر علم معسكرك:</p>
            <div class="flags-grid" id="player-flags">
                <button class="flag-btn active-player" onclick="selectFlag('player', 'green'); playClickSound();">الأخضر (3 نجوم)</button>
                <button class="flag-btn" onclick="selectFlag('player', 'red'); playClickSound();">الأحمر (نجمتان)</button>
            </div>
        </div>

        <div class="menu-section">
            <p>اختر علم معسكر العدو:</p>
            <div class="flags-grid" id="enemy-flags">
                <button class="flag-btn" onclick="selectFlag('enemy', 'green'); playClickSound();">الأخضر (3 نجوم)</button>
                <button class="flag-btn active-enemy" onclick="selectFlag('enemy', 'red'); playClickSound();">الأحمر (نجمتان)</button>
            </div>
        </div>

        <button id="start-btn" onclick="playClickSound(); startGame();">بدء المعركة</button>
    </div>

    <div id="ui-overlay" class="interactive-ui">
        <div id="top-bar">
            <div class="panel-box">الرصيد: <span id="money-display">500</span>$ 🪙</div>
            <div class="panel-box" id="game-timer">00:00</div>
        </div>

        <div id="minimap-container">
            <canvas id="minimap-canvas" width="110" height="110"></canvas>
        </div>

        <div id="controls-bar">
            <button id="sel-all-btn" class="action-btn active" onclick="setSelectionMode('all'); playClickSound();">الكل</button>
            <button id="sel-single-btn" class="action-btn" onclick="setSelectionMode('single'); playClickSound();">فردي</button>
            <button id="buy-tank-btn" class="action-btn" onclick="buyPlayerTank('normal')">دبابة عادية (150$)</button>
            <button id="buy-rocket-tank-btn" class="action-btn" onclick="buyPlayerTank('rocket')">دبابة صواريخ (300$)</button>
        </div>

        <div id="floating-msg"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
