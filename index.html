<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة حرب المعسكرات - موبايل أونلاين</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 15, 15, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        .hidden { display: none !important; }
        input, select {
            padding: 12px;
            margin: 8px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            width: 280px;
            font-size: 16px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin: 10px;
        }
        button:hover { background: #ff6b81; }
        
        /* واجهة اللعب داخل المعركة */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px;
            border-radius: 8px;
            z-index: 10;
            display: none;
        }
        
        /* أزرار التحكم على شاشة الهاتف */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 5px;
            z-index: 10;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .ctrl-btn:active { background: rgba(255, 255, 255, 0.6); }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* أزرار الزوم للكاميرا */
        #zoom-controls {
            position: absolute;
            bottom: 30px;
            left: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .zoom-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 2px solid white;
            font-size: 24px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        #rooms-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 10px;
            width: 280px;
            background: #1a1a1a;
        }
        .room-item {
            padding: 8px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://tank-game-server-o650.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- 1. القائمة الرئيسية -->
    <div id="main-menu" class="menu-screen">
        <h1>حرب المعسكرات والدبابات</h1>
        <button onclick="showCreateRoom()">إنشاء غرفة جديدة</button>
        <button onclick="showJoinRoom()">انضمام إلى غرفة</button>
    </div>

    <!-- 2. إنشاء غرفة -->
    <div id="create-room-menu" class="menu-screen hidden">
        <h2>إعدادات الغرفة</h2>
        <input type="text" id="room-name-input" placeholder="اسم الغرفة">
        <label>اختر معسكرك:</label>
        <select id="camp-select">
            <option value="red">معسكر الأحمر (يمين الخريطة)</option>
            <option value="blue">معسكر الأزرق (يسار الخريطة)</option>
        </select>
        <input type="number" id="money-input" placeholder="المال الابتدائي" value="1000">
        <button onclick="createRoom()">إنشاء ودخول اللوبي</button>
        <button onclick="backToMain()">رجوع</button>
    </div>

    <!-- 3. انضمام لغرفة -->
    <div id="join-room-menu" class="menu-screen hidden">
        <h2>الغرف المتاحة</h2>
        <div id="rooms-list">جاري البحث عن غرف...</div>
        <button onclick="backToMain()">رجوع</button>
    </div>

    <!-- 4. غرفة الانتظار (اللوبي) -->
    <div id="lobby-screen" class="menu-screen hidden">
        <h2 id="lobby-title">غرفة الانتظار</h2>
        <p id="lobby-status">في انتظار انضمام الصديق...</p>
        <div id="players-list"></div>
        <button id="ready-btn" onclick="toggleReady()">استعداد للعب</button>
        <button id="start-game-btn" class="hidden" onclick="startGameHost()">بدء الحرب الآن</button>
    </div>

    <!-- واجهة اللعب -->
    <div id="ui">
        <h3 id="camp-title">المعسكر: -</h3>
        <p>الرصيد: <span id="coins">1000</span> عملة</p>
        <!-- قائمة الشراء تظهر حصرياً عند لمس المعسكر -->
        <div id="store-panel" style="display:none; background: rgba(0,255,0,0.2); padding:8px; border:1px solid #2ed573; border-radius:5px;">
            <p style="color:#2ed573; margin:0 0 5px 0;">⚡ أنت داخل معسكرك!</p>
            <button onclick="buyTankInGame()" style="background:#2ed573; margin:0; padding:8px 15px;">شراء دبابة (300 عملة)</button>
        </div>
        <p id="store-hint" style="font-size:11px; color:#ff4757; margin:5px 0 0 0;">(تحرك نحو معسكرك لتظهر قائمة الشراء)</p>
    </div>

    <!-- أزرار التحكم عبر الشاشة (للهاتف) -->
    <div id="mobile-controls">
        <div class="ctrl-btn" id="btn-up" ontouchstart="moveCam('up')" onmousedown="moveCam('up')">⬆️</div>
        <div class="ctrl-btn" id="btn-left" ontouchstart="moveCam('left')" onmousedown="moveCam('left')">⬅️</div>
        <div class="ctrl-btn" id="btn-down" ontouchstart="moveCam('down')" onmousedown="moveCam('down')">⬇️</div>
        <div class="ctrl-btn" id="btn-right" ontouchstart="moveCam('right')" onmousedown="moveCam('right')">➡️</div>
    </div>

    <!-- أزرار الزوم -->
    <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomCam('in')">+</button>
        <button class="zoom-btn" onclick="zoomCam('out')">-</button>
    </div>

    <script>
        const socket = io("https://tank-game-server-o650.onrender.com");

        let currentRoom = null;
        let myCamp = 'red';
        let startingMoney = 1000;
        let isReady = false;

        function showCreateRoom() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('create-room-menu').classList.remove('hidden');
        }

        function showJoinRoom() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('join-room-menu').classList.remove('hidden');
            socket.emit('get_rooms');
        }

        function backToMain() {
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function createRoom() {
            const roomName = document.getElementById('room-name-input').value || "غرفة الحرب";
            myCamp = document.getElementById('camp-select').value;
            startingMoney = parseInt(document.getElementById('money-input').value) || 1000;
            socket.emit('create_room', { roomName, camp: myCamp, money: startingMoney });
        }

        socket.on('room_created_success', (data) => {
            currentRoom = data.roomName;
            document.getElementById('create-room-menu').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = `الغرفة: ${currentRoom}`;
            document.getElementById('start-game-btn').classList.remove('hidden');
            updateLobbyUI([{ id: socket.id, camp: myCamp, ready: false }]);
        });

        socket.on('rooms_list', (rooms) => {
            const listDiv = document.getElementById('rooms-list');
            listDiv.innerHTML = '';
            if(rooms.length === 0) {
                listDiv.innerHTML = '<p>لا توجد غرف متاحة.</p>';
                return;
            }
            rooms.forEach(room => {
                let div = document.createElement('div');
                div.className = 'room-item';
                div.innerText = `${room.name} (${room.playersCount}/2)`;
                div.onclick = () => joinRoom(room.name);
                listDiv.appendChild(div);
            });
        });

        function joinRoom(roomName) {
            myCamp = (myCamp === 'red') ? 'blue' : 'red'; // المعسكر المقابل تلقائياً
            socket.emit('join_room', { roomName, camp: myCamp });
            currentRoom = roomName;
            document.getElementById('join-room-menu').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = `الغرفة: ${currentRoom}`;
        }

        socket.on('update_lobby', (data) => {
            updateLobbyUI(data.players);
        });

        function updateLobbyUI(players) {
            const playersDiv = document.getElementById('players-list');
            playersDiv.innerHTML = '<h4>اللاعبون:</h4>';
            players.forEach(p => {
                playersDiv.innerHTML += `<p>لاعب [معسكر: ${p.camp === 'red' ? 'الأحمر' : 'الأزرق'}] - ${p.ready ? 'جاهز ✅' : 'انتظار ⏳'}</p>`;
            });
        }

        function toggleReady() {
            isReady = !isReady;
            document.getElementById('ready-btn').innerText = isReady ? "إلغاء الاستعداد" : "استعداد للعب";
            socket.emit('player_ready', { roomName: currentRoom, ready: isReady });
        }

        function startGameHost() {
            socket.emit('start_game', { roomName: currentRoom });
        }

        socket.on('launch_game', (data) => {
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('ui').style.display = 'block';
            document.getElementById('mobile-controls').style.display = 'grid';
            document.getElementById('zoom-controls').style.display = 'flex';
            document.getElementById('camp-title').innerText = `المعسكر: ${myCamp === 'red' ? 'الأحمر' : 'الأزرق'}`;
            document.getElementById('coins').innerText = data.money;
            initThreeJS();
        });

        // --- محرك Three.js والكاميرا والمعسكرات ---
        let scene, camera, renderer;
        let coins = 1000;
        let flags = [];
        let campPositions = { red: {x: 70, z: 0}, blue: {x: -70, z: 0} };

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.01);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // الأرض
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(400, 400),
                new THREE.MeshStandardMaterial({ color: 0x3b7a57 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // بناء المعسكرين
            createCamp(70, 0, 0xff0000, "الأحمر");
            createCamp(-70, 0, 0x0000ff, "الأزرق");

            // 1. توجيه الكاميرا فوراً نحو المعسكر الذي اختاره الشخص
            let targetCampPos = campPositions[myCamp];
            camera.position.set(targetCampPos.x, 35, targetCampPos.z + 40);
            camera.lookAt(targetCampPos.x, 0, targetCampPos.z);

            animate();
        }

        function createCamp(x, z, color, name) {
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(30, 1, 30),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            base.position.set(x, 0.5, z);
            scene.add(base);

            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 18),
                new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
            );
            pole.position.set(x - 10, 9, z - 10);
            scene.add(pole);

            const flag = new THREE.Mesh(
                new THREE.PlaneGeometry(6, 4, 10, 10),
                new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide })
            );
            flag.position.set(x - 7, 15, z - 10);
            scene.add(flag);
            flags.push({ mesh: flag, offset: Math.random() * 10 });
        }

        // أزرار التحكم عبر الشاشة (للهاتف)
        function moveCam(dir) {
            const speed = 4;
            if (dir === 'right') camera.position.x += speed;
            if (dir === 'left') camera.position.x -= speed;
            if (dir === 'up') camera.position.z -= speed;
            if (dir === 'down') camera.position.z += speed;
            checkCampTouch();
        }

        function zoomCam(type) {
            if (type === 'in') camera.position.y = Math.max(15, camera.position.y - 5);
            if (type === 'out') camera.position.y = Math.min(120, camera.position.y + 5);
        }

        // 3. فحص إذا لامس اللاعب/الكاميرا معسكره لتظهر قائمة الشراء
        function checkCampTouch() {
            let myCampCoords = campPositions[myCamp];
            let distance = Math.abs(camera.position.x - myCampCoords.x) + Math.abs(camera.position.z - myCampCoords.z);
            
            const storePanel = document.getElementById('store-panel');
            const storeHint = document.getElementById('store-hint');

            // إذا اقترب مسافة كافية من معسكره (تعتبر منطقة اللمس/التواجد في المعسكر)
            if (distance < 35) {
                storePanel.style.display = 'block';
                storeHint.style.display = 'none';
            } else {
                storePanel.style.display = 'none';
                storeHint.style.display = 'block';
            }
        }

        function buyTankInGame() {
            if(coins >= 300) {
                coins -= 300;
                document.getElementById('coins').innerText = coins;
                socket.emit('buy_tank_action', { roomName: currentRoom, camp: myCamp });
                alert("تم شراء دبابة حربية ناجحة من المعسكر!");
            } else {
                alert("المال غير كافي في رصيد المعسكر!");
            }
        }

        socket.on('tank_spawned', (data) => {
            // إظهار الدبابة في ساحة المعركة
            const tankColor = data.camp === 'red' ? 0xff0000 : 0x0000ff;
            const tank = new THREE.Mesh(
                new THREE.BoxGeometry(6, 3, 10),
                new THREE.MeshStandardMaterial({ color: tankColor })
            );
            let spawnX = data.camp === 'red' ? 50 : -50;
            tank.position.set(spawnX, 1.5, (Math.random() - 0.5) * 20);
            scene.add(tank);
        });

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            flags.forEach(f => {
                let posAttr = f.mesh.geometry.attributes.position;
                for(let i=0; i<posAttr.count; i++) {
                    let vx = posAttr.getX(i);
                    if(vx > 0) {
                        posAttr.setZ(i, Math.sin(time * 10 + i + f.offset) * 0.4);
                    }
                }
                posAttr.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
