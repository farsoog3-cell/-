<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - النسخة الكاملة الأصلية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            overflow-y: auto; padding: 10px;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 16px 20px; width: 90%; max-width: 380px; text-align: center;
        }

        .menu-card h1 { font-size: 16px; margin-bottom: 10px; color: #38bdf8; }
        .section-title { font-size: 11px; color: #94a3b8; margin: 6px 0 3px 0; text-align: right; }
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

        .flag-btn {
            flex: 1; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
        }

        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .flag-btn.active-enemy { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .mode-options { display: flex; gap: 6px; margin-bottom: 8px; }
        .mode-btn {
            flex: 1; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 10px; cursor: pointer;
        }
        .mode-btn.active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); }

        #online-section { display: none; margin-top: 8px; border-top: 1px solid #334155; padding-top: 8px; }
        .input-code {
            width: 100%; padding: 6px; background: #0f172a; border: 1px solid #475569;
            color: white; border-radius: 6px; font-size: 11px; text-align: center; margin-bottom: 6px;
        }

        .action-btn {
            width: 100%; margin-top: 6px; padding: 8px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .action-btn:disabled { background: #64748b; cursor: not-allowed; }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155; transition: transform 0.1s linear;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px;
        }
        .capture-bar-bg { width: 100%; height: 5px; background: #334155; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .selection-controls { display: flex; gap: 4px; width: 100%; }
        .sel-btn {
            flex: 1; background: rgba(30, 41, 59, 0.85); border: 1px solid #38bdf8; color: white;
            padding: 5px 4px; border-radius: 5px; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer;
        }
        .sel-btn.active { background: #0284c7; }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }
        .buy-btn-small:disabled { background: #64748b; }
        .buy-btn-rocket { background: #ea580c; }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #38bdf8; padding: 3px 8px;
            border-radius: 4px; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn:active, .cam-btn.pressed { background: #0284c7; border-color: #7dd3fc; }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة الاستراتيجية ⚔️🚩</h1>
        
        <div class="section-title">اختر نمط اللعب:</div>
        <div class="mode-options">
            <button class="mode-btn active" id="mode-ai-btn" onclick="playClickSound(); setGameMode('ai')">🤖 ضد الذكاء الاصطناعي</button>
            <button class="mode-btn" id="mode-online-btn" onclick="playClickSound(); setGameMode('online')">🌐 أونلاين مع صديق</button>
        </div>

        <div id="online-section">
            <div class="section-title" id="my-peer-id-label">كود غرفتك: جاري الإنشاء...</div>
            <button class="action-btn" onclick="playClickSound(); createOnlineRoom()">إنشاء غرفة جديدة</button>
            <div class="section-title" style="margin-top: 10px;">أو انضم لغرفة صديقك:</div>
            <input type="text" id="friend-id-input" class="input-code" placeholder="الصق كود صديقك هنا...">
            <button class="action-btn" onclick="playClickSound(); joinOnlineRoom()">الانضمام والبدء</button>
        </div>

        <div class="section-title">اختر علم معسكرك:</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="playClickSound(); selectFlag('player', 'green')">الأخضر (3 نجوم ⭐⭐⭐)</button>
            <button class="flag-btn" onclick="playClickSound(); selectFlag('player', 'red')">الأحمر (نجمتان ⭐⭐)</button>
        </div>

        <div id="enemy-flag-selection-box">
            <div class="section-title">اختر علم معسكر العدو:</div>
            <div class="flag-options" id="enemy-flags">
                <button class="flag-btn" onclick="playClickSound(); selectFlag('enemy', 'green')">الأخضر (3 نجوم ⭐⭐⭐)</button>
                <button class="flag-btn active-enemy" onclick="playClickSound(); selectFlag('enemy', 'red')">الأحمر (نجمتان ⭐⭐)</button>
            </div>
        </div>

        <button id="start-btn" class="action-btn" onclick="playClickSound(); startGame()">بدء المعركة 🚀</button>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">سيطر على معسكر الخصم وآبار النفط لتربح!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="selection-controls">
            <button class="sel-btn active" id="sel-all-btn" onclick="playClickSound(); setSelectionMode('all')">الكل</button>
            <button class="sel-btn" id="sel-single-btn" onclick="playClickSound(); setSelectionMode('single')">فردي</button>
        </div>

        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" onclick="playClickSound(); buyPlayerTank('normal')">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" onclick="playClickSound(); buyPlayerTank('rocket')">صاروخية (300$)</button>
        </div>
    </div>

    <div id="minimap-container" title="الخريطة المصغرة">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">اسحب بالشاشة أو استخدم الخريطة المصغرة 🎯</div>
</div>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
    let scene, camera, renderer;
    let playerFlagType = 'green';
    let enemyFlagType = 'red';
    let gameMode = 'ai';
    let peer = null, conn = null, isHost = false, onlinePlayerRole = 'host';

    let cameraRadius = 280, targetCameraRadius = 280;
    let cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };

    let isDragging = false, previousTouchX = 0, previousTouchY = 0, touchStartX = 0, touchStartY = 0, hasMoved = false;

    let playerTanks = [], enemyTanks = [], bullets = [], obstacles = [], rotatingRadars = [], tankTracks = [], smokeParticles = [], oilRigs = [], activeFlagMeshes = [];
    let selectionMode = 'all';
    let targetMarkerMesh;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let terrainMesh;

    const CORNER_OFFSET = 380, MAP_LIMIT = 460;
    let playerMoney = 500, enemyMoney = 500, gameTick = 0, flagWaveTime = 0, playerBuildCooldown = 0, enemyBuildCooldown = 0;
    let treadTextureCache = null;

    function playClickSound() {
        const audio = new Audio('https://freesound.org/data/previews/608/608670_11861866-lq.mp3');
        audio.volume = 0.3; audio.play().catch(e=>{});
    }

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text; msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    }

    function setGameMode(mode) {
        gameMode = mode;
        document.getElementById('mode-ai-btn').classList.toggle('active', mode === 'ai');
        document.getElementById('mode-online-btn').classList.toggle('active', mode === 'online');
        document.getElementById('online-section').style.display = (mode === 'online') ? 'block' : 'none';
        document.getElementById('enemy-flag-selection-box').style.display = (mode === 'online') ? 'none' : 'block';
    }

    function selectFlag(role, color) {
        if (role === 'player') {
            if (color === enemyFlagType) enemyFlagType = color === 'green' ? 'red' : 'green';
            playerFlagType = color;
        } else {
            if (color === playerFlagType) playerFlagType = color === 'green' ? 'red' : 'green';
            enemyFlagType = color;
        }
        updateFlagButtonsUI();
    }

    function updateFlagButtonsUI() {
        document.querySelectorAll('#player-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-player', btn.innerText.includes(playerFlagType === 'green' ? 'الأخضر' : 'الأحمر'));
        });
        document.querySelectorAll('#enemy-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-enemy', btn.innerText.includes(enemyFlagType === 'green' ? 'الأخضر' : 'الأحمر'));
        });
    }

    function setSelectionMode(mode) {
        selectionMode = mode;
        document.getElementById('sel-all-btn').classList.toggle('active', mode === 'all');
        document.getElementById('sel-single-btn').classList.toggle('active', mode === 'single');
    }

    function initPeer() {
        if (peer) return;
        peer = new Peer();
        peer.on('open', (id) => { document.getElementById('my-peer-id-label').innerText = `كود غرفتك: ${id}`; });
        peer.on('connection', (connection) => {
            conn = connection; isHost = true; onlinePlayerRole = 'host';
            conn.on('data', handleNetworkData);
            showFloatingMsg('انضم صديقك إلى الغرفة!');
        });
    }

    function createOnlineRoom() { initPeer(); showFloatingMsg('جاري إنشاء الغرفة...'); }
    function joinOnlineRoom() {
        const friendId = document.getElementById('friend-id-input').value.trim();
        if (!friendId) { alert('أدخل الكود!'); return; }
        initPeer();
        setTimeout(() => {
            conn = peer.connect(friendId); isHost = false; onlinePlayerRole = 'guest';
            conn.on('data', handleNetworkData);
            showFloatingMsg('جاري الاتصال...');
        }, 1000);
    }

    function handleNetworkData(data) {
        if (data.type === 'START_GAME') {
            playerFlagType = data.playerFlag; enemyFlagType = data.enemyFlag; startGame(true);
        } else if (data.type === 'SPAWN_TANK') {
            spawnEnemyTankNetwork(data.tankType, data.x, data.z);
        } else if (data.type === 'MOVE_TANK') {
            enemyTanks.forEach(t => { if(!t.isDestroyed) t.target = new THREE.Vector3(data.targetX, getTerrainHeight(data.targetX, data.targetZ), data.targetZ); });
        }
    }

    function startGame(isRemoteCall = false) {
        if (gameMode === 'online' && !isRemoteCall && isHost && conn) {
            conn.send({ type: 'START_GAME', playerFlag: playerFlagType, enemyFlag: playerFlagType === 'green' ? 'red' : 'green' });
        }
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';

        let startCampX = (gameMode === 'online' && onlinePlayerRole === 'guest') ? -CORNER_OFFSET : CORNER_OFFSET;
        let startCampZ = (gameMode === 'online' && onlinePlayerRole === 'guest') ? -CORNER_OFFSET : CORNER_OFFSET;
        targetLookAt.set(startCampX, getTerrainHeight(startCampX, startCampZ), startCampZ);
        targetCameraRadius = 110; cameraRadius = 110;
        showFloatingMsg('بدأت المعركة الاستراتيجية!');
    }

    function getTerrainHeight(x, z) {
        return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5 + Math.sin(x * 0.008) * 8;
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        dirLight.castShadow = true;
        scene.add(dirLight);

        createTerrain();
        createBases();
        createOilRigs();
        createTargetMarker();
        setupInteraction();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function createTerrain() {
        const geometry = new THREE.PlaneGeometry(1100, 1100, 50, 50);
        geometry.rotateX(-Math.PI / 2);
        const pos = geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            pos.setY(i, getTerrainHeight(pos.getX(i), pos.getZ(i)));
        }
        geometry.computeVertexNormals();
        terrainMesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
    }

    function createFlagTexture(type) {
        const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        if (type === 'green') {
            ctx.fillStyle = '#007a3d'; ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = '#facc15'; ctx.font = 'bold 20px Arial'; ctx.fillText('⭐⭐⭐', 35, 38);
        } else if (type === 'red') {
            ctx.fillStyle = '#cc0000'; ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = '#facc15'; ctx.font = 'bold 20px Arial'; ctx.fillText('⭐⭐', 42, 38);
        } else {
            ctx.fillStyle = '#475569'; ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px Arial'; ctx.fillText('NEUTRAL', 22, 38);
        }
        return new THREE.CanvasTexture(canvas);
    }

    function createBaseStructure(parentGroup, isEnemy) {
        const wallMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0x1e1b18 : 0x334155, roughness: 0.5 });
        const concreteMat = new THREE.MeshStandardMaterial({ color: isEnemy ? 0x27272a : 0x64748b, roughness: 0.7 });
        
        const hqBase = new THREE.Mesh(new THREE.BoxGeometry(18, 8, 14), concreteMat);
        hqBase.position.set(0, 4, -4); hqBase.castShadow = true; parentGroup.add(hqBase);

        const radar = new THREE.Mesh(new THREE.ConeGeometry(3.2, 1.8, 12), wallMat);
        radar.rotation.x = Math.PI / 2; radar.position.set(0, 15, -4);
        parentGroup.add(radar); rotatingRadars.push(radar);

        // سارية العلم الأساسية للقاعدة
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 35), new THREE.MeshStandardMaterial({color: 0x94a3b8}));
        pole.position.set(8, 17.5, 5); parentGroup.add(pole);
        
        const flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 6, 10, 4), new THREE.MeshBasicMaterial({ map: createFlagTexture(isEnemy ? enemyFlagType : playerFlagType), side: THREE.DoubleSide }));
        flagMesh.position.set(13, 33, 5); parentGroup.add(flagMesh);
        activeFlagMeshes.push({ mesh: flagMesh, baseHeight: 33 });
    }

    function createBases() {
        const pGroup = new THREE.Group(); pGroup.position.set(CORNER_OFFSET, getTerrainHeight(CORNER_OFFSET, CORNER_OFFSET), CORNER_OFFSET);
        createBaseStructure(pGroup, false); scene.add(pGroup);

        const eGroup = new THREE.Group(); eGroup.position.set(-CORNER_OFFSET, getTerrainHeight(-CORNER_OFFSET, -CORNER_OFFSET), -CORNER_OFFSET);
        createBaseStructure(eGroup, true); scene.add(eGroup);

        playerTanks.push(createTank(CORNER_OFFSET - 45, CORNER_OFFSET - 45, 0x2e3b23, 'player', 'normal'));
        enemyTanks.push(createTank(-CORNER_OFFSET + 45, -CORNER_OFFSET + 45, 0x6b3a2a, 'enemy', 'normal'));
    }

    function createOilRigs() {
        const positions = [{ x: 60, z: -60 }, { x: -60, z: 60 }, { x: -90, z: -90 }, { x: 90, z: 90 }];
        positions.forEach(pos => {
            let rigGroup = new THREE.Group();
            let th = getTerrainHeight(pos.x, pos.z);
            rigGroup.position.set(pos.x, th, pos.z);

            // مجسم محطة النفط المتكامل مع الماكينة (Beam Pump)
            let baseBox = new THREE.Mesh(new THREE.BoxGeometry(10, 2, 10), new THREE.MeshStandardMaterial({color: 0x334155}));
            baseBox.position.y = 1; rigGroup.add(baseBox);

            let tower = new THREE.Mesh(new THREE.BoxGeometry(3, 8, 3), new THREE.MeshStandardMaterial({color: 0x475569}));
            tower.position.set(0, 5, 0); rigGroup.add(tower);

            let pumpBeam = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 12), new THREE.MeshStandardMaterial({color: 0xb91c1c}));
            pumpBeam.position.set(0, 9, 0); rigGroup.add(pumpBeam);

            // سارية وعلم البئر
            let pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 20), new THREE.MeshStandardMaterial({color: 0xcccccc}));
            pole.position.set(5, 10, -3); rigGroup.add(pole);

            let flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(8, 5, 8, 4), new THREE.MeshBasicMaterial({ map: createFlagTexture('none'), side: THREE.DoubleSide }));
            flagMesh.position.set(9, 18, -3); rigGroup.add(flagMesh);
            activeFlagMeshes.push({ mesh: flagMesh, baseHeight: 18 });

            scene.add(rigGroup);
            oilRigs.push({ x: pos.x, z: pos.z, owner: 'none', captureProgress: 0, flagMesh: flagMesh, beam: pumpBeam });
        });
    }

    function createTank(x, z, colorHex, team, type = 'normal') {
        const tankGroup = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(6, 2.2, 9), armorMat);
        body.position.y = 1.2; body.castShadow = true; tankGroup.add(body);
        
        const lTrack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.7, 9), trackMat);
        lTrack.position.set(-3.5, 0.8, 0); tankGroup.add(lTrack);
        const rTrack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.7, 9), trackMat);
        rTrack.position.set(3.5, 0.8, 0); tankGroup.add(rTrack);
        
        const turret = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 1.5, 10), armorMat);
        turret.position.y = 2.8; tankGroup.add(turret);
        
        const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 6), armorMat);
        cannon.rotation.x = Math.PI / 2; cannon.position.set(0, 2.8, 4); tankGroup.add(cannon);

        tankGroup.position.set(x, getTerrainHeight(x, z), z);
        scene.add(tankGroup);

        const hpLabel = document.createElement('div');
        hpLabel.className = `tank-hp-label ${team === 'player' ? 'hp-player' : 'hp-enemy'}`;
        hpLabel.innerText = '100';
        document.getElementById('hp-labels-container').appendChild(hpLabel);

        return { mesh: tankGroup, hpLabel: hpLabel, target: null, team: team, type: type, hp: 100, maxHp: 100, lastShot: 0, isDestroyed: false, lastTrackPos: new THREE.Vector3(x, 0, z) };
    }

    function getRealisticTreadTexture() {
        if (treadTextureCache) return treadTextureCache;
        const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#261408'; ctx.fillRect(0, 0, 64, 128);
        ctx.fillStyle = '#110a04';
        for (let y = 8; y < 128; y += 16) { ctx.fillRect(6, y, 52, 6); }
        treadTextureCache = new THREE.CanvasTexture(canvas);
        treadTextureCache.wrapS = THREE.RepeatWrapping; treadTextureCache.wrapT = THREE.RepeatWrapping;
        treadTextureCache.repeat.set(1, 3);
        return treadTextureCache;
    }

    function spawnRealisticTankTracks(tank) {
        if (tank.mesh.position.distanceTo(tank.lastTrackPos) > 3.5) {
            tank.lastTrackPos.copy(tank.mesh.position);
            const trackGeo = new THREE.PlaneGeometry(1.2, 3.2); trackGeo.rotateX(-Math.PI / 2);
            const trackMat = new THREE.MeshBasicMaterial({ map: getRealisticTreadTexture(), transparent: true, opacity: 0.7 });
            const mesh = new THREE.Mesh(trackGeo, trackMat);
            mesh.position.set(tank.mesh.position.x, getTerrainHeight(tank.mesh.position.x, tank.mesh.position.z) + 0.05, tank.mesh.position.z);
            mesh.rotation.y = tank.mesh.rotation.y;
            scene.add(mesh);
            tankTracks.push({ mesh: mesh, life: 250 });
        }
    }

    function createTargetMarker() {
        targetMarkerMesh = new THREE.Mesh(new THREE.RingGeometry(1, 2, 16), new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
        targetMarkerMesh.rotateX(-Math.PI / 2); targetMarkerMesh.visible = false; scene.add(targetMarkerMesh);
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
            isDragging = true; hasMoved = false;
            previousTouchX = e.clientX; previousTouchY = e.clientY;
            touchStartX = e.clientX; touchStartY = e.clientY;
        });
        dom.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            if (Math.abs(e.clientX - touchStartX) > 5 || Math.abs(e.clientY - touchStartY) > 5) hasMoved = true;
            if (hasMoved) {
                cameraTheta -= (e.clientX - previousTouchX) * 0.008;
                cameraPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraPhi - (e.clientY - previousTouchY) * 0.008));
            }
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointerup', (e) => {
            isDragging = false;
            if (!hasMoved) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(terrainMesh);
                if (intersects.length > 0) {
                    let pt = intersects[0].point;
                    targetMarkerMesh.position.copy(pt);
                    targetMarkerMesh.position.y = getTerrainHeight(pt.x, pt.z) + 0.1;
                    targetMarkerMesh.visible = true;

                    playerTanks.forEach(t => { if (!t.isDestroyed) t.target = pt.clone(); });
                    if (gameMode === 'online' && conn) {
                        conn.send({ type: 'MOVE_TANK', targetX: pt.x, targetZ: pt.z });
                    }
                }
            }
        });
        dom.addEventListener('wheel', (e) => { targetCameraRadius = Math.max(50, Math.min(550, targetCameraRadius + e.deltaY * 0.3)); }, { passive: true });
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function processCameraInputs() {
        const moveSpeed = 5.0;
        let dx = 0, dz = 0;
        if (camInputs.up) { dx -= Math.sin(cameraTheta) * moveSpeed; dz -= Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.down) { dx += Math.sin(cameraTheta) * moveSpeed; dz += Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.left) { dx -= Math.cos(cameraTheta) * moveSpeed; dz += Math.sin(cameraTheta) * moveSpeed; }
        if (camInputs.right) { dx += Math.cos(cameraTheta) * moveSpeed; dz -= Math.sin(cameraTheta) * moveSpeed; }

        targetLookAt.x = Math.max(-420, Math.min(420, targetLookAt.x + dx));
        targetLookAt.z = Math.max(-420, Math.min(420, targetLookAt.z + dz));

        if (camInputs.zi) targetCameraRadius = Math.max(60, targetCameraRadius - 5);
        if (camInputs.zo) targetCameraRadius = Math.min(550, targetCameraRadius + 5);
    }

    function updateCameraPosition() {
        cameraRadius = THREE.MathUtils.lerp(cameraRadius, targetCameraRadius, 0.15);
        camera.position.set(
            targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta),
            targetLookAt.y + cameraRadius * Math.cos(cameraPhi),
            targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta)
        );
        camera.lookAt(targetLookAt);
    }

    function fireBullet(fromTank, targetTank) {
        const now = Date.now();
        if (now - fromTank.lastShot < 1000) return;
        fromTank.lastShot = now;

        const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
        bMesh.position.copy(fromTank.mesh.position).add(new THREE.Vector3(0, 3, 0));
        scene.add(bMesh);
        bullets.push({ mesh: bMesh, targetTank: targetTank, speed: 2.5, damage: 34 });
    }

    function updateAIAndGameLogic() {
        gameTick++;
        if (gameTick % 60 === 0) {
            playerMoney += 10;
            oilRigs.forEach(rig => { if (rig.owner === 'player') playerMoney += 15; if (rig.owner === 'enemy') enemyMoney += 15; });
            document.getElementById('money-display').innerText = playerMoney;
        }

        // ذكاء اصطناعي حربي متطور للعدو
        if (gameMode === 'ai') {
            if (enemyMoney >= 150 && enemyBuildCooldown <= 0) {
                enemyMoney -= 150; enemyBuildCooldown = 800;
                let eTank = createTank(-CORNER_OFFSET + 60, -CORNER_OFFSET + 60, 0x6b3a2a, 'enemy', 'normal');
                enemyTanks.push(eTank);
            }
            if (enemyBuildCooldown > 0) enemyBuildCooldown--;

            // تحجيم وتوجيه دبابات العدو نحو دبابات اللاعب أو الآبار غير المسيطر عليها
            enemyTanks.forEach(et => {
                if (et.isDestroyed) return;
                let nearestPlayer = playerTanks.find(pt => !pt.isDestroyed);
                if (nearestPlayer) {
                    et.target = nearestPlayer.mesh.position.clone();
                }
            });
        }

        // فحص السيطرة على آبار النفط (رفع ونزل العلم تدريجياً)
        oilRigs.forEach(rig => {
            let pNear = playerTanks.some(t => !t.isDestroyed && t.mesh.position.distanceFromXZ ? false : t.mesh.position.distanceTo(new THREE.Vector3(rig.x, getTerrainHeight(rig.x, rig.z), rig.z)) < 35);
            let eNear = enemyTanks.some(t => !t.isDestroyed && t.mesh.position.distanceTo(new THREE.Vector3(rig.x, getTerrainHeight(rig.x, rig.z), rig.z)) < 35);

            if (pNear && !eNear) {
                rig.captureProgress = Math.min(100, rig.captureProgress + 1);
                if (rig.captureProgress >= 100 && rig.owner !== 'player') {
                    rig.owner = 'player';
                    rig.flagMesh.material.map = createFlagTexture(playerFlagType);
                    rig.flagMesh.material.needsUpdate = true;
                    showFloatingMsg('سيطرت على بئر نفط!');
                }
            } else if (eNear && !pNear) {
                rig.captureProgress = Math.max(0, rig.captureProgress - 1);
                if (rig.captureProgress <= 0 && rig.owner !== 'enemy') {
                    rig.owner = 'enemy';
                    rig.flagMesh.material.map = createFlagTexture(enemyFlagType);
                    rig.flagMesh.material.needsUpdate = true;
                }
            }
        });
    }

    function updateTanks() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (!b.targetTank || b.targetTank.isDestroyed) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
            let dir = new THREE.Vector3().subVectors(b.targetTank.mesh.position, b.mesh.position);
            if (dir.length() < 2.5) {
                b.targetTank.hp -= b.damage;
                if (b.targetTank.hp <= 0 && !b.targetTank.isDestroyed) {
                    b.targetTank.isDestroyed = true;
                    b.targetTank.mesh.visible = false;
                    b.targetTank.hpLabel.style.display = 'none';
                }
                scene.remove(b.mesh); bullets.splice(i, 1);
            } else {
                b.mesh.position.add(dir.normalize().multiplyScalar(b.speed));
            }
        }

        [...playerTanks, ...enemyTanks].forEach(tank => {
            if (tank.isDestroyed) return;
            
            // البحث عن عدو لإطلاق النار تلقائياً
            let enemies = tank.team === 'player' ? enemyTanks : playerTanks;
            let targetEnemy = enemies.find(e => !e.isDestroyed && tank.mesh.position.distanceTo(e.mesh.position) < 120);
            if (targetEnemy) {
                fireBullet(tank, targetEnemy);
            }

            if (tank.target) {
                let dist = tank.mesh.position.distanceTo(tank.target);
                if (dist > 2.0) {
                    let desiredDir = new THREE.Vector3().subVectors(tank.target, tank.mesh.position).setY(0).normalize();
                    tank.mesh.rotation.y += (Math.atan2(desiredDir.x, desiredDir.z) - tank.mesh.rotation.y) * 0.15;
                    let nextPos = tank.mesh.position.clone().add(desiredDir.multiplyScalar(0.35));
                    nextPos.y = getTerrainHeight(nextPos.x, nextPos.z);
                    tank.mesh.position.copy(nextPos);
                    spawnRealisticTankTracks(tank);
                }
            }
        });

        // تحديث ليبل الصحة
        [...playerTanks, ...enemyTanks].forEach(tank => {
            if (tank.isDestroyed) return;
            let tempV = tank.mesh.position.clone(); tempV.y += 4; tempV.project(camera);
            tank.hpLabel.style.left = `${(tempV.x * .5 + .5) * window.innerWidth}px`;
            tank.hpLabel.style.top = `${(-(tempV.y * .5) + .5) * window.innerHeight}px`;
            tank.hpLabel.innerText = `${tank.hp}`;
        });

        // تنظيف مسارات الدبابات القديمة
        for (let i = tankTracks.length - 1; i >= 0; i--) {
            tankTracks[i].life--;
            if (tankTracks[i].life <= 0) {
                scene.remove(tankTracks[i].mesh);
                tankTracks.splice(i, 1);
            }
        }
    }

    function animateFlags() {
        flagWaveTime += 0.15;
        rotatingRadars.forEach(r => r.rotation.y += 0.025);
        activeFlagMeshes.forEach(item => {
            const pos = item.mesh.geometry.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let u = pos.getX(i);
                if (u > -4.8) pos.setZ(i, Math.sin(flagWaveTime * 2.5 - u * 1.2) * 0.5);
            }
            pos.needsUpdate = true;
        });
    }

    function renderMinimap() {
        const canvas = document.getElementById('minimap-canvas');
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(w/2, h/2, w/2, 0, Math.PI * 2); ctx.fill();
        const scale = (w / 2) / MAP_LIMIT;

        playerTanks.forEach(t => { if (!t.isDestroyed) { ctx.fillStyle = '#22c55e'; ctx.fillRect(w/2 + t.mesh.position.x * scale - 2, h/2 + t.mesh.position.z * scale - 2, 4, 4); } });
        enemyTanks.forEach(t => { if (!t.isDestroyed) { ctx.fillStyle = '#ef4444'; ctx.fillRect(w/2 + t.mesh.position.x * scale - 2, h/2 + t.mesh.position.z * scale - 2, 4, 4); } });
    }

    function buyPlayerTank(type) {
        let cost = type === 'rocket' ? 300 : 150;
        if (playerMoney >= cost) {
            playerMoney -= cost;
            document.getElementById('money-display').innerText = playerMoney;
            let pX = CORNER_OFFSET - 50 + (Math.random() - 0.5) * 20;
            let pZ = CORNER_OFFSET - 50 + (Math.random() - 0.5) * 20;
            let newTank = createTank(pX, pZ, 0x2e3b23, 'player', type);
            playerTanks.push(newTank);
            showFloatingMsg('تم نشر دبابة جديدة في القاعدة!');
        }
    }

    function spawnEnemyTankNetwork(type, x, z) {
        enemyTanks.push(createTank(x, z, 0x6b3a2a, 'enemy', type));
    }

    function animate() {
        requestAnimationFrame(animate);
        processCameraInputs();
        updateCameraPosition();
        updateAIAndGameLogic();
        updateTanks();
        animateFlags();
        renderMinimap();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
