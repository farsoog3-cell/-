<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - أونلاين مع الأصدقاء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 16px 20px; width: 90%; max-width: 380px; text-align: center;
        }

        .menu-card h1 { font-size: 16px; margin-bottom: 10px; color: #38bdf8; }
        .section-title { font-size: 11px; color: #94a3b8; margin: 6px 0 3px 0; text-align: right; }
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

        .flag-btn {
            flex: 1; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
        }

        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .flag-btn.active-enemy { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        #start-btn {
            width: 100%; margin-top: 10px; padding: 8px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155; transition: transform 0.1s linear;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px;
        }
        .capture-bar-bg { width: 100%; height: 5px; background: #334155; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #38bdf8; padding: 3px 8px;
            border-radius: 4px; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة أونلاين ⚔️🌐</h1>
        <div id="connection-status" style="font-size: 11px; color: #f59e0b; margin-bottom: 8px;">جاري الاتصال بالسيرفر...</div>
        
        <div class="section-title">اختر علم معسكرك:</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="selectFlag('green')">الأخضر</button>
            <button class="flag-btn" onclick="selectFlag('red')">الأحمر</button>
        </div>

        <button id="start-btn" disabled onclick="startGame()">بانتظار انضمام الصديق...</button>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>
    
    <div class="left-controls-group">
        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" onclick="buyPlayerTank()">شراء دبابة (150$)</button>
        </div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)">➡️</button>
    </div>
    <div class="cam-hint">تحكم بالكاميرا وانقر على الأرض لتحريك دبابتك</div>
</div>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>

<script>
    // الاتصال بسيرفرك على Render
    const socket = io("https://tank-game-server-o650.onrender.com/");
    
    let myRole = null;
    let scene, camera, renderer;
    let playerTank = null;
    let remoteTank = null;
    let cameraRadius = 280, cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let terrainMesh;
    let playerMoney = 500;
    const CORNER_OFFSET = 380;

    socket.on('connect', () => {
        document.getElementById('connection-status').innerText = "متصل بالسيرفر بنجاح!";
        document.getElementById('connection-status').style.color = "#22c55e";
    });

    socket.on('assign-role', (data) => {
        myRole = data.role;
        document.getElementById('start-btn.disabled')?.removeAttribute('disabled');
        const startBtn = document.getElementById('start-btn');
        startBtn.removeAttribute('disabled');
        startBtn.innerText = `بدء المعركة (${myRole === 'player1' ? 'اللاعب الأول 🟢' : 'اللاعب الثاني 🔴'})`;
    });

    socket.on('tank-move', (data) => {
        if (remoteTank) {
            remoteTank.mesh.position.set(data.x, data.y, data.z);
            remoteTank.mesh.rotation.y = data.rotationY;
        }
    });

    function selectFlag(color) {
        // تحديد اللون محلياً
    }

    function startGame() {
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';
        init3D();
    }

    function getTerrainHeight(x, z) {
        return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5;
    }

    function init3D() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        scene.add(dirLight);

        // إنشاء التضاريس
        const terrainGeo = new THREE.PlaneGeometry(1100, 1100, 30, 30);
        terrainGeo.rotateX(-Math.PI / 2);
        terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color: 0x5c3d2e }));
        scene.add(terrainMesh);

        // تحديد أماكن البداية بناءً على الدور (اللاعب الأول في زاوية، والثاني في الزاوية المقابلة)
        let startX = (myRole === 'player1') ? CORNER_OFFSET : -CORNER_OFFSET;
        let startZ = (myRole === 'player1') ? CORNER_OFFSET : -CORNER_OFFSET;
        let color = (myRole === 'player1') ? 0x22c55e : 0xef4444;

        playerTank = createTankMesh(startX, startZ, color);
        targetLookAt.set(startX, getTerrainHeight(startX, startZ), startZ);

        // التفاعل والنقر لتحريك الدبابة
        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(terrainMesh);
            if (intersects.length > 0) {
                let targetPos = intersects[0].point;
                playerTank.targetPos = targetPos;
            }
        });

        animate();
    }

    function createTankMesh(x, z, colorHex) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(6, 2.2, 9), new THREE.MeshStandardMaterial({ color: colorHex }));
        body.position.y = 1.2;
        group.add(body);
        
        let y = getTerrainHeight(x, z);
        group.position.set(x, y, z);
        scene.add(group);
        return { mesh: group, targetPos: null };
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function updateCameraPosition() {
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function animate() {
        requestAnimationFrame(animate);

        // تحريك الكاميرا بالأزرار
        if (camInputs.up) targetLookAt.z -= 4;
        if (camInputs.down) targetLookAt.z += 4;
        if (camInputs.left) targetLookAt.x -= 4;
        if (camInputs.right) targetLookAt.x += 4;
        if (camInputs.zi) cameraRadius = Math.max(60, cameraRadius - 5);
        if (camInputs.zo) cameraRadius = Math.min(500, cameraRadius + 5);
        updateCameraPosition();

        // تحريك الدبابة المحلية وإرسال الإحداثيات للسيرفر
        if (playerTank && playerTank.targetPos) {
            let dx = playerTank.targetPos.x - playerTank.mesh.position.x;
            let dz = playerTank.targetPos.z - playerTank.mesh.position.z;
            let dist = Math.sqrt(dx * dx + dz * dz);
            if (dist > 1) {
                let angle = Math.atan2(dx, dz);
                playerTank.mesh.rotation.y = angle;
                playerTank.mesh.position.x += Math.sin(angle) * 1.5;
                playerTank.mesh.position.z += Math.cos(angle) * 1.5;
                playerTank.mesh.position.y = getTerrainHeight(playerTank.mesh.position.x, playerTank.mesh.position.z);

                // إرسال الموقع عبر السيرفر لصديقك
                socket.emit('tank-move', {
                    x: playerTank.mesh.position.x,
                    y: playerTank.mesh.position.y,
                    z: playerTank.mesh.position.z,
                    rotationY: playerTank.mesh.rotation.y
                });
            }
        }

        renderer.render(scene, camera);
    }

    function buyPlayerTank() {
        if (playerMoney >= 150) {
            playerMoney -= 150;
            document.getElementById('money-display').innerText = playerMoney;
            socket.emit('buy-tank', { type: 'normal' });
        }
    }
</script>
</body>
</html>
