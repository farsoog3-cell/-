<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - أونلاين مع الأصدقاء</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.96);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            overflow-y: auto; padding: 20px;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 16px 20px; width: 90%; max-width: 420px; text-align: center;
        }

        .menu-card h1 { font-size: 18px; margin-bottom: 12px; color: #38bdf8; }
        .section-title { font-size: 11px; color: #94a3b8; margin: 8px 0 4px 0; text-align: right; }
        
        .input-text {
            width: 100%; padding: 8px; background: #0f172a; border: 1px solid #475569;
            border-radius: 6px; color: #fff; font-size: 12px; margin-bottom: 8px; text-align: right;
        }

        .rooms-container {
            max-height: 150px; overflow-y: auto; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; margin-bottom: 10px; padding: 6px; text-align: right;
        }
        .room-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px; border-bottom: 1px solid #1e293b; font-size: 11px; color: #cbd5e1;
        }
        .room-item button {
            background: #22c55e; border: none; color: white; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 10px;
        }

        .action-btn {
            width: 100%; margin-top: 6px; padding: 8px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .action-btn.secondary { background: #475569; }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155; transition: transform 0.1s linear;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px;
        }
        .capture-bar-bg { width: 100%; height: 5px; background: #334155; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }
        .buy-btn-small:disabled { background: #64748b; }
        .buy-btn-rocket { background: #ea580c; }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #38bdf8; padding: 3px 8px;
            border-radius: 4px; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }

        #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }
        #victory-screen h1 { font-size: 20px; color: #22c55e; margin-bottom: 6px; text-align: center; padding: 0 10px; }
        .stats-box {
            background: rgba(30, 41, 59, 0.9); border: 1px solid #38bdf8; border-radius: 8px;
            padding: 10px 16px; font-size: 11px; margin: 8px 0; width: 260px; text-align: right; line-height: 1.5;
        }
        .restart-btn { padding: 6px 16px; background: #22c55e; border: none; color: white; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة الاستراتيجية (أونلاين) 🌐</h1>
        
        <div class="section-title">اسم اللاعب:</div>
        <input type="text" id="player-name-input" class="input-text" value="قائد عسكري" placeholder="أدخل اسمك...">

        <div class="section-title">إنشاء غرفة جديدة:</div>
        <input type="text" id="room-name-input" class="input-text" placeholder="اسم الغرفة...">
        <button class="action-btn" onclick="createRoom()">إنشاء غرفة والدخول 🚀</button>

        <div class="section-title" style="margin-top: 12px;">الغرف الجارية المتاحة:</div>
        <div class="rooms-container" id="rooms-list-container">
            <div style="text-align: center; color: #94a3b8; font-size: 10px; padding: 10px;">جاري البحث عن غرف...</div>
        </div>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">سيطر على معسكر الخصم لتربح!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" id="buy-tank-btn" onclick="buyTank('normal')">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" id="buy-rocket-tank-btn" onclick="buyTank('rocket')">صاروخية (300$)</button>
        </div>
    </div>

    <div id="minimap-container" title="الخريطة المصغرة">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)" ontouchstart="camMove('zi', true)" ontouchend="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)" ontouchstart="camMove('up', true)" ontouchend="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)" ontouchstart="camMove('zo', true)" ontouchend="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)" ontouchstart="camMove('left', true)" ontouchend="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)" ontouchstart="camMove('down', true)" ontouchend="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)" ontouchstart="camMove('right', true)" ontouchend="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">اسحب بالشاشة أو استخدم الأزرار لتحريك الكاميرا 🎯</div>
</div>

<div id="victory-screen">
    <h1 id="victory-title">انتهت المعركة!</h1>
    <div class="stats-box" id="stats-content"></div>
    <button class="restart-btn" onclick="location.reload()">العودة للقائمة الرئيسية 🔄</button>
</div>

<div id="canvas-container"></div>

<!-- استدعاء مكتبة Three.js و Socket.io من السيرفر الخاص بك -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://tank-game-server-o650.onrender.com/socket.io/socket.io.js"></script>

<script>
    const SERVER_URL = 'https://tank-game-server-o650.onrender.com';
    let socket = io(SERVER_URL);

    let scene, camera, renderer;
    let cameraRadius = 280, targetCameraRadius = 280;
    let cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };

    let isDragging = false, previousTouchX = 0, previousTouchY = 0, touchStartX = 0, touchStartY = 0, hasMoved = false;

    let tanksMap = {}; // تخزين دبابات اللاعبين الآخرين ونفسك
    let obstacles = [], terrainMesh, targetMarkerMesh;
    let playerMoney = 500;
    let currentRoomId = null;
    let myPlayerId = null;
    let gameOver = false;

    const CORNER_OFFSET = 380;
    const MAP_LIMIT = 460;

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text;
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    }

    // استقبال قائمة الغرف الجارية من السيرفر
    socket.on('update-rooms', (rooms) => {
        const container = document.getElementById('rooms-list-container');
        if (!rooms || rooms.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #94a3b8; font-size: 10px; padding: 10px;">لا توجد غرف متاحة حالياً، أنشئ غرفة جديدة!</div>';
            return;
        }
        container.innerHTML = '';
        rooms.forEach(room => {
            const item = document.createElement('div');
            item.className = 'room-item';
            item.innerHTML = `<span>${room.name} (${room.playersCount || 1}/2 لاعبين)</span>`;
            const joinBtn = document.createElement('button');
            joinBtn.innerText = 'انضمام';
            joinBtn.onclick = () => joinRoom(room.id);
            item.appendChild(joinBtn);
            container.appendChild(item);
        });
    });

    function createRoom() {
        const roomName = document.getElementById('room-name-input').value.trim() || 'غرفة معركة';
        const playerName = document.getElementById('player-name-input').value.trim() || 'قائد';
        socket.emit('create-room', { roomName, playerName });
    }

    function joinRoom(roomId) {
        const playerName = document.getElementById('player-name-input').value.trim() || 'قائد';
        socket.emit('join-room', { roomId, playerName });
    }

    socket.on('room-joined', (data) => {
        currentRoomId = data.roomId;
        myPlayerId = socket.id;
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';
        initGameWorld();
        showFloatingMsg('تم الانضمام للبحرية بنجاح!');
    });

    // استقبال تحديثات اللعبة من السيرفر (حركة اللاعبين ودباباتهم)
    socket.on('game-state-update', (serverState) => {
        // تحديث مواقع دبابات اللاعبين الآخرين بناءً على بيانات السيرفر
        // (يمكن ربطها مباشرة بسيرفرك حسب الـ events التي يرسلها)
    });

    function init() {
        // التهيئة الرسومية الأساسية لـ Three.js
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        scene.add(dirLight);

        createTerrain();
        createTargetMarker();
        setupInteraction();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function initGameWorld() {
        targetLookAt.set(CORNER_OFFSET, 0, CORNER_OFFSET);
        targetCameraRadius = 110;
    }

    function getTerrainHeight(x, z) {
        return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5;
    }

    function createTerrain() {
        const geometry = new THREE.PlaneGeometry(1100, 1100, 30, 30);
        geometry.rotateX(-Math.PI / 2);
        const terrainMat = new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 });
        terrainMesh = new THREE.Mesh(geometry, terrainMat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
    }

    function createTargetMarker() {
        const geo = new THREE.RingGeometry(1, 2, 16); geo.rotateX(-Math.PI / 2);
        targetMarkerMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
        targetMarkerMesh.visible = false;
        scene.add(targetMarkerMesh);
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function processCameraInputs() {
        const moveSpeed = 5.0;
        let dx = 0, dz = 0;
        if (camInputs.up) { dx -= Math.sin(cameraTheta) * moveSpeed; dz -= Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.down) { dx += Math.sin(cameraTheta) * moveSpeed; dz += Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.left) { dx -= Math.cos(cameraTheta) * moveSpeed; dz += Math.sin(cameraTheta) * moveSpeed; }
        if (camInputs.right) { dx += Math.cos(cameraTheta) * moveSpeed; dz -= Math.sin(cameraTheta) * moveSpeed; }

        targetLookAt.x = Math.max(-420, Math.min(420, targetLookAt.x + dx));
        targetLookAt.z = Math.max(-420, Math.min(420, targetLookAt.z + dz));

        if (camInputs.zi) targetCameraRadius = Math.max(60, targetCameraRadius - 5);
        if (camInputs.zo) targetCameraRadius = Math.min(550, targetCameraRadius + 5);
    }

    function updateCameraPosition() {
        cameraRadius = THREE.MathUtils.lerp(cameraRadius, targetCameraRadius, 0.15);
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
            isDragging = true; hasMoved = false;
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousTouchX;
            const deltaY = e.clientY - previousTouchY;
            if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) hasMoved = true;
            cameraTheta -= deltaX * 0.008;
            cameraPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraPhi - deltaY * 0.008));
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointerup', (e) => {
            isDragging = false;
            if (!hasMoved && currentRoomId) {
                // إرسال إحداثيات النقر للسيرفر لتحريك الدبابة
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(terrainMesh);
                if (intersects.length > 0) {
                    let pt = intersects[0].point;
                    targetMarkerMesh.position.copy(pt);
                    targetMarkerMesh.visible = true;
                    socket.emit('move-tank', { roomId: currentRoomId, target: { x: pt.x, z: pt.z } });
                }
            }
        });
        dom.addEventListener('wheel', (e) => { targetCameraRadius = Math.max(50, Math.min(550, targetCameraRadius + e.deltaY * 0.3)); }, { passive: true });
    }

    function buyTank(type) {
        let cost = (type === 'rocket') ? 300 : 150;
        if (playerMoney >= cost && currentRoomId) {
            playerMoney -= cost;
            document.getElementById('money-display').innerText = playerMoney;
            socket.emit('buy-tank', { roomId: currentRoomId, type: type });
            showFloatingMsg('تم طلب تعزيز دبابة أونلاين!');
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        processCameraInputs();
        updateCameraPosition();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
