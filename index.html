<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حرب المعسكرات والدبابات - مزامنة أونلاين</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        .menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 15, 15, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 100;
        }
        .hidden { display: none !important; }
        input, select {
            padding: 12px; margin: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; width: 280px; font-size: 16px;
        }
        button {
            background: #ff4757; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; margin: 10px;
        }
        button:hover { background: #ff6b81; }
        
        #ui {
            position: absolute; top: 10px; left: 10px; color: white; background: rgba(0, 0, 0, 0.75); padding: 12px; border-radius: 8px; z-index: 10; display: none;
        }
        #mobile-controls {
            position: absolute; bottom: 20px; right: 20px; display: none; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 5px; z-index: 10;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.3); color: white; border: 2px solid white; font-size: 20px; font-weight: bold; border-radius: 10px; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        #zoom-controls {
            position: absolute; bottom: 30px; left: 20px; display: none; flex-direction: column; gap: 10px; z-index: 10;
        }
        .zoom-btn {
            width: 50px; height: 50px; background: rgba(255, 255, 255, 0.3); color: white; border: 2px solid white; font-size: 24px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }
        #rooms-list {
            max-height: 150px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; width: 280px; background: #1a1a1a;
        }
        .room-item { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://tank-game-server-o650.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="main-menu" class="menu-screen">
        <h1>حرب المعسكرات والدبابات - أونلاين</h1>
        <button onclick="showCreateRoom()">إنشاء غرفة جديدة</button>
        <button onclick="showJoinRoom()">انضمام إلى غرفة</button>
    </div>

    <div id="create-room-menu" class="menu-screen hidden">
        <h2>إعدادات الغرفة</h2>
        <input type="text" id="room-name-input" placeholder="اسم الغرفة">
        <label>اختر معسكرك:</label>
        <select id="camp-select">
            <option value="red">المعسكر الأحمر (الزاوية اليمنى)</option>
            <option value="blue">المعسكر الأزرق (الزاوية اليسرى)</option>
        </select>
        <input type="number" id="money-input" placeholder="المال الابتدائي" value="1000">
        <button onclick="createRoom()">إنشاء ودخول اللوبي</button>
        <button onclick="backToMain()">رجوع</button>
    </div>

    <div id="join-room-menu" class="menu-screen hidden">
        <h2>الغرف المتاحة</h2>
        <div id="rooms-list">جاري البحث عن غرف...</div>
        <button onclick="backToMain()">رجوع</button>
    </div>

    <div id="lobby-screen" class="menu-screen hidden">
        <h2 id="lobby-title">غرفة الانتظار</h2>
        <p id="lobby-status">في انتظار انضمام الصديق...</p>
        <div id="players-list"></div>
        <button id="ready-btn" onclick="toggleReady()">استعداد للعب</button>
        <button id="start-game-btn" class="hidden" onclick="startGameHost()">بدء الحرب الآن</button>
    </div>

    <div id="ui">
        <h3 id="camp-title">المعسكر: -</h3>
        <p>الرصيد: <span id="coins">1000</span> عملة</p>
        <div id="store-panel" style="display:none; background: rgba(0,255,0,0.2); padding:8px; border:1px solid #2ed573; border-radius:5px;">
            <p style="color:#2ed573; margin:0 0 5px 0;">⚡ أنت في معسكرك!</p>
            <button onclick="buyTankInGame()" style="background:#2ed573; margin:0; padding:8px 15px;">شراء دبابة حربية (300 عملة)</button>
        </div>
        <p id="store-hint" style="font-size:11px; color:#ff4757; margin:5px 0 0 0;">(اقترب من معسكرك لتظهر قائمة الشراء)</p>
    </div>

    <div id="mobile-controls">
        <div class="ctrl-btn" id="btn-up" ontouchstart="moveCam('up')" onmousedown="moveCam('up')">⬆️</div>
        <div class="ctrl-btn" id="btn-left" ontouchstart="moveCam('left')" onmousedown="moveCam('left')">⬅️</div>
        <div class="ctrl-btn" id="btn-down" ontouchstart="moveCam('down')" onmousedown="moveCam('down')">⬇️</div>
        <div class="ctrl-btn" id="btn-right" ontouchstart="moveCam('right')" onmousedown="moveCam('right')">➡️</div>
    </div>

    <div id="zoom-controls">
        <button class="zoom-btn" onclick="zoomCam('in')">+</button>
        <button class="zoom-btn" onclick="zoomCam('out')">-</button>
    </div>

    <script>
        const socket = io("https://tank-game-server-o650.onrender.com");

        let currentRoom = null;
        let myCamp = 'red';
        let startingMoney = 1000;
        let isReady = false;

        function showCreateRoom() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('create-room-menu').classList.remove('hidden');
        }

        function showJoinRoom() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('join-room-menu').classList.remove('hidden');
            socket.emit('get_rooms');
        }

        function backToMain() {
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function createRoom() {
            const roomName = document.getElementById('room-name-input').value || "غرفة الحرب";
            myCamp = document.getElementById('camp-select').value;
            startingMoney = parseInt(document.getElementById('money-input').value) || 1000;
            socket.emit('create_room', { roomName, camp: myCamp, money: startingMoney });
        }

        socket.on('room_created_success', (data) => {
            currentRoom = data.roomName;
            document.getElementById('create-room-menu').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = `الغرفة: ${currentRoom}`;
            document.getElementById('start-game-btn').classList.remove('hidden');
            updateLobbyUI([{ id: socket.id, camp: myCamp, ready: false }]);
        });

        socket.on('rooms_list', (rooms) => {
            const listDiv = document.getElementById('rooms-list');
            listDiv.innerHTML = '';
            if(rooms.length === 0) { listDiv.innerHTML = '<p>لا توجد غرف متاحة.</p>'; return; }
            rooms.forEach(room => {
                let div = document.createElement('div');
                div.className = 'room-item';
                div.innerText = `${room.name} (${room.playersCount}/2)`;
                div.onclick = () => joinRoom(room.name);
                listDiv.appendChild(div);
            });
        });

        function joinRoom(roomName) {
            myCamp = (myCamp === 'red') ? 'blue' : 'red';
            socket.emit('join_room', { roomName, camp: myCamp });
            currentRoom = roomName;
            document.getElementById('join-room-menu').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = `الغرفة: ${currentRoom}`;
        }

        socket.on('update_lobby', (data) => { updateLobbyUI(data.players); });

        function updateLobbyUI(players) {
            const playersDiv = document.getElementById('players-list');
            playersDiv.innerHTML = '<h4>اللاعبون:</h4>';
            players.forEach(p => {
                playersDiv.innerHTML += `<p>لاعب [معسكر: ${p.camp === 'red' ? 'الأحمر' : 'الأزرق'}] - ${p.ready ? 'جاهز ✅' : 'انتظار ⏳'}</p>`;
            });
        }

        function toggleReady() {
            isReady = !isReady;
            document.getElementById('ready-btn').innerText = isReady ? "إلغاء الاستعداد" : "استعداد للعب";
            socket.emit('player_ready', { roomName: currentRoom, ready: isReady });
        }

        function startGameHost() { socket.emit('start_game', { roomName: currentRoom }); }

        socket.on('launch_game', (data) => {
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('ui').style.display = 'block';
            document.getElementById('mobile-controls').style.display = 'grid';
            document.getElementById('zoom-controls').style.display = 'flex';
            document.getElementById('camp-title').innerText = `المعسكر: ${myCamp === 'red' ? 'الأحمر' : 'الأزرق'}`;
            document.getElementById('coins').innerText = data.money;
            initThreeJS();
        });

        // --- محرك Three.js ومزامنة الأونلاين ---
        let scene, camera, renderer;
        let coins = 1000;
        let radars = [], flags = [];
        let campPositions = { red: {x: 120, z: 120}, blue: {x: -120, z: -120} };
        let allTanks = []; // تخزين كل الدبابات للجميع
        let selectedTank = null;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.9);
            sun.position.set(100, 150, 100);
            scene.add(sun);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(600, 600),
                new THREE.MeshStandardMaterial({ color: 0x3b7a57 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createAdvancedCamp(120, 120, 0xff0000, "الأحمر");
            createAdvancedCamp(-120, -120, 0x0000ff, "الأزرق");

            let targetPos = campPositions[myCamp];
            camera.position.set(targetPos.x, 50, targetPos.z + 60);
            camera.lookAt(targetPos.x, 0, targetPos.z);

            window.addEventListener('pointerdown', onPointerDown);

            // الاستماع لأحداث الأونلاين القادمة من السيرفر لصديقك
            socket.on('tank_spawned', (data) => {
                spawnTank(data.tankId, data.camp, data.x, data.z);
            });

            socket.on('tank_moved', (data) => {
                let tank = allTanks.find(t => t.userData.tankId === data.tankId);
                if (tank) {
                    tank.userData.target = new THREE.Vector3(data.x, 0, data.z);
                    tank.userData.isMoving = true;
                }
            });

            animate();
        }

        function createAdvancedCamp(x, z, color, name) {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const wall1 = new THREE.Mesh(new THREE.BoxGeometry(40, 5, 2), wallMat);
            wall1.position.set(x, 2.5, z - 20);
            scene.add(wall1);

            const building = new THREE.Mesh(
                new THREE.BoxGeometry(18, 12, 18),
                new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
            );
            building.position.set(x, 6, z);
            scene.add(building);

            const radarBase = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 4), new THREE.MeshStandardMaterial({ color: 0x222 }));
            radarBase.position.set(x, 14, z);
            scene.add(radarBase);

            const radarDish = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 2), new THREE.MeshStandardMaterial({ color: color }));
            radarDish.position.set(x, 16, z);
            scene.add(radarDish);
            radars.push(radarDish);

            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 22), new THREE.MeshStandardMaterial({ color: 0xccc }));
            pole.position.set(x - 12, 11, z - 12);
            scene.add(pole);

            const flag = new THREE.Mesh(
                new THREE.PlaneGeometry(7, 4, 10, 10),
                new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide })
            );
            flag.position.set(x - 8.5, 19, z - 12);
            scene.add(flag);
            flags.push({ mesh: flag, offset: Math.random() * 10 });
        }

        function moveCam(dir) {
            const speed = 6;
            if (dir === 'right') camera.position.x += speed;
            if (dir === 'left') camera.position.x -= speed;
            if (dir === 'up') camera.position.z -= speed;
            if (dir === 'down') camera.position.z += speed;
            checkCampTouch();
        }

        function zoomCam(type) {
            if (type === 'in') camera.position.y = Math.max(20, camera.position.y - 8);
            if (type === 'out') camera.position.y = Math.min(180, camera.position.y + 8);
        }

        function checkCampTouch() {
            let myCoords = campPositions[myCamp];
            let dist = Math.abs(camera.position.x - myCoords.x) + Math.abs(camera.position.z - myCoords.z);
            const storePanel = document.getElementById('store-panel');
            const storeHint = document.getElementById('store-hint');

            if (dist < 40) {
                storePanel.style.display = 'block';
                storeHint.style.display = 'none';
            } else {
                storePanel.style.display = 'none';
                storeHint.style.display = 'block';
            }
        }

        // شراء دبابة وإرسال أمر إنشائها للسيرفر
        function buyTankInGame() {
            if (coins >= 300) {
                coins -= 300;
                document.getElementById('coins').innerText = coins;
                let tankId = 'tank_' + socket.id + '_' + Date.now();
                let startPos = campPositions[myCamp];
                let spawnX = startPos.x;
                let spawnZ = startPos.z + (myCamp === 'red' ? -25 : 25);

                // إرسال طلب الشراء والظهور للسيرفر ليراه الصديق أيضاً
                socket.emit('buy_tank_action', {
                    roomName: currentRoom,
                    tankId: tankId,
                    camp: myCamp,
                    x: spawnX,
                    z: spawnZ
                });
            } else {
                alert("الرصيد غير كافي لشراء دبابة!");
            }
        }

        function spawnTank(tankId, camp, x, z) {
            let tankGroup = new THREE.Group();
            let colorHex = (camp === 'red') ? 0xff3333 : 0x3333ff;

            let body = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 10), new THREE.MeshStandardMaterial({ color: colorHex }));
            body.position.y = 1.5;
            tankGroup.add(body);

            let turret = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            turret.position.set(0, 3.5, 0);
            tankGroup.add(turret);

            let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 6), new THREE.MeshStandardMaterial({ color: 0x555 }));
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 3.5, -4);
            tankGroup.add(barrel);

            tankGroup.position.set(x, 0, z);
            tankGroup.userData = { tankId: tankId, camp: camp, health: 100, target: null, isMoving: false };

            scene.add(tankGroup);
            allTanks.push(tankGroup);
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let intersects = raycaster.intersectObjects(scene.children, true);
            for (let hit of intersects) {
                let obj = hit.object;
                while (obj.parent && !allTanks.includes(obj)) { obj = obj.parent; }
                if (allTanks.includes(obj)) {
                    // يمكنك التحكم فقط بدبابات معسكرك الخاص
                    if (obj.userData.camp === myCamp) {
                        selectedTank = obj;
                    }
                    return;
                }
            }

            // إذا تم لمس الأرض ولديك دبابة محددة، حركها وأرسل الحركة للسيرفر
            if (selectedTank) {
                let floorIntersect = raycaster.intersectObject(scene.children[2]); // الأرضية
                if (floorIntersect.length > 0) {
                    let targetPoint = floorIntersect[0].point;
                    selectedTank.userData.target = targetPoint;
                    selectedTank.userData.isMoving = true;

                    // إرسال إحداثيات الحركة للسيرفر ليراها الصديق
                    socket.emit('tank_move', {
                        roomName: currentRoom,
                        tankId: selectedTank.userData.tankId,
                        x: targetPoint.x,
                        z: targetPoint.z
                    });
                }
            }
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            radars.forEach(r => { r.rotation.y = time * 3; });

            flags.forEach(f => {
                let posAttr = f.mesh.geometry.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    let vx = posAttr.getX(i);
                    if (vx > 0) {
                        posAttr.setZ(i, Math.sin(time * 12 + i + f.offset) * 0.4);
                    }
                }
                posAttr.needsUpdate = true;
            });

            // تحريك كل الدبابات بسلاسة
            allTanks.forEach(tank => {
                if (tank.userData.isMoving && tank.userData.target) {
                    let target = tank.userData.target;
                    let dir = new THREE.Vector3().subVectors(target, tank.position);
                    if (dir.length() > 2) {
                        dir.normalize();
                        tank.position.addScaledVector(dir, 0.8);
                        tank.lookAt(target.x, tank.position.y, target.z);
                    } else {
                        tank.userData.isMoving = false;
                    }
                }
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
