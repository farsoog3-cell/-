<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - النسخة الفورية والمطورة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            overflow-y: auto; padding: 15px;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 16px 20px; width: 90%; max-width: 400px; text-align: center;
        }

        .menu-card h1 { font-size: 16px; margin-bottom: 10px; color: #38bdf8; }
        .section-title { font-size: 11px; color: #94a3b8; margin: 6px 0 3px 0; text-align: right; }
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

        .flag-btn {
            flex: 1; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }

        .action-btn {
            width: 100%; margin-top: 8px; padding: 8px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .action-btn:disabled { background: #64748b; cursor: not-allowed; }
        .action-btn.green { background: #22c55e; }

        .lobbies-list {
            max-height: 140px; overflow-y: auto; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; margin-bottom: 8px; padding: 4px; text-align: right;
        }
        .lobby-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 8px; border-bottom: 1px solid #1e293b; font-size: 11px; color: #e2e8f0;
        }
        .lobby-item button { padding: 4px 8px; background: #22c55e; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 10px; }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px;
        }
        .capture-bar-bg { width: 100%; height: 5px; background: #334155; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.3s; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }
        .buy-btn-small:disabled { background: #64748b; }
        .buy-btn-rocket { background: #ea580c; }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #38bdf8; padding: 3px 8px;
            border-radius: 4px; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card" id="lobby-selection-view">
        <h1>معركة السيطرة أونلاين 🌐</h1>
        <div class="section-title" id="connection-status">جاري الاتصال بالسيرفر...</div>
        <div class="lobbies-list" id="lobbies-container">
            <div style="text-align:center; color:#94a3b8; font-size:11px; padding:15px;">جاري جلب الغرف...</div>
        </div>
        <button class="action-btn green" id="create-room-trigger-btn" onclick="playClickSound(); showCreateRoomPanel()" disabled>إنشاء غرفة جديدة ➕</button>
    </div>

    <div class="menu-card" id="create-room-view" style="display: none;">
        <h1>إنشاء غرفة معركة ⚔️</h1>
        <div class="section-title">اسم الغرفة:</div>
        <input type="text" id="room-name-input" value="معركة الأبطال" style="width:100%; padding:6px; background:#1e293b; border:1px solid #475569; color:#fff; border-radius:4px; font-size:11px; margin-bottom:8px;">
        
        <div class="section-title">اختر علم معسكرك:</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="playClickSound(); selectFlag('green')">الأخضر السوري</button>
            <button class="flag-btn" onclick="playClickSound(); selectFlag('red')">الأحمر السوري</button>
        </div>

        <button class="action-btn green" onclick="playClickSound(); createRoomAction()">تأكيد وإنشاء الغرفة 🚀</button>
        <button class="action-btn" style="background:#475569;" onclick="playClickSound(); showLobbySelection()">العودة للقائمة</button>
    </div>

    <div class="menu-card" id="waiting-room-view" style="display: none;">
        <h1 id="room-title-display">غرفة المعركة</h1>
        <div class="stats-box" id="room-status-box" style="width:100%; text-align:center; background:rgba(30,41,59,0.9); padding:10px; border-radius:6px; margin:8px 0; font-size:11px;">
            في انتظار انضمام الخصم...
        </div>
        <div id="host-controls" style="display:none;">
            <button class="action-btn green" id="start-battle-btn" onclick="playClickSound(); hostStartGame()" disabled>بدء المعركة (في انتظار الخصم)</button>
        </div>
        <button class="action-btn" style="background:#ef4444; margin-top:8px;" onclick="playClickSound(); leaveRoom()">مغادرة الغرفة 🚪</button>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">سيطر على آبار النفط ومعسكر الخصم!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" id="buy-tank-btn" onclick="playClickSound(); buyPlayerTank('normal')">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" id="buy-rocket-tank-btn" onclick="playClickSound(); buyPlayerTank('rocket')">صاروخية (300$)</button>
        </div>
    </div>

    <div id="minimap-container" title="الخريطة المصغرة">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" 
            onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)" onmouseleave="camMove('zi', false)"
            ontouchstart="camMove('zi', true)" ontouchend="camMove('zi', false)">➕</button>
        
        <button class="cam-btn up" 
            onmousedown="camMove('up', true)" onmouseup="camMove('up', false)" onmouseleave="camMove('up', false)"
            ontouchstart="camMove('up', true)" ontouchend="camMove('up', false)">⬆️</button>
        
        <button class="cam-btn zoom-out" 
            onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)" onmouseleave="camMove('zo', false)"
            ontouchstart="camMove('zo', true)" ontouchend="camMove('zo', false)">➖</button>
        
        <button class="cam-btn left" 
            onmousedown="camMove('left', true)" onmouseup="camMove('left', false)" onmouseleave="camMove('left', false)"
            ontouchstart="camMove('left', true)" ontouchend="camMove('left', false)">⬅️</button>
        
        <button class="cam-btn down" 
            onmousedown="camMove('down', true)" onmouseup="camMove('down', false)" onmouseleave="camMove('down', false)"
            ontouchstart="camMove('down', true)" ontouchend="camMove('down', false)">⬇️</button>
        
        <button class="cam-btn right" 
            onmousedown="camMove('right', true)" onmouseup="camMove('right', false)" onmouseleave="camMove('right', false)"
            ontouchstart="camMove('right', true)" ontouchend="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">اضغط لتحريك دباباتك 🎯</div>
</div>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://tank-game-server-o650.onrender.com/socket.io/socket.io.js"></script>

<script>
    const socket = io("https://tank-game-server-o650.onrender.com/");

    socket.on("connect", () => {
        document.getElementById('connection-status').innerText = "متصل بالسيرفر بنجاح! 🟢";
        document.getElementById('create-room-trigger-btn').disabled = false;
        socket.emit("get_rooms");
    });

    socket.on("disconnect", () => {
        document.getElementById('connection-status').innerText = "انقطع الاتصال بالسيرفر! 🔴";
        document.getElementById('create-room-trigger-btn').disabled = true;
    });

    socket.on("rooms_list", (rooms) => {
        const container = document.getElementById('lobbies-container');
        if (!rooms || rooms.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:11px; padding:15px;">لا توجد غرف متاحة. أنشئ غرفة!</div>`;
            return;
        }
        let html = '';
        rooms.forEach(r => {
            html += `<div class="lobby-item">
                <span>🏰 ${r.name} (${r.hostFlag === 'green' ? 'الأخضر السوري' : 'الأحمر السوري'})</span>
                <button onclick="playClickSound(); joinRoom('${r.id}')">انضمام 🎮</button>
            </div>`;
        });
        container.innerHTML = html;
    });

    socket.on("room_joined", (roomData) => {
        currentRoomId = roomData.id;
        isHost = roomData.isHost;
        playerFlagType = isHost ? roomData.hostFlag : roomData.guestFlag;
        enemyFlagType = playerFlagType === 'green' ? 'red' : 'green';

        document.getElementById('create-room-view').style.display = 'none';
        document.getElementById('lobby-selection-view').style.display = 'none';
        document.getElementById('waiting-room-view').style.display = 'block';
        document.getElementById('room-title-display').innerText = `الغرفة: ${roomData.name}`;
        
        if (isHost) {
            document.getElementById('host-controls').style.display = 'block';
            document.getElementById('room-status-box').innerText = "في انتظار انضمام الخصم...";
        } else {
            document.getElementById('host-controls').style.display = 'none';
            document.getElementById('room-status-box').innerText = "انضممت بنجاح! في انتظار بدء المضيف.";
        }
    });

    socket.on("room_update", (roomData) => {
        if (isHost && roomData.guestJoined) {
            document.getElementById('room-status-box').innerText = "انضم الخصم! 🟢";
            let startBtn = document.getElementById('start-battle-btn');
            startBtn.disabled = false;
            startBtn.innerText = "بدء المعركة الآن 🚀";
        }
    });

    socket.on("start_game", () => { startGame(); });

    socket.on("remote_tank_spawn", (data) => {
        let eColor = enemyFlagType === 'green' ? 0x22c55e : 0xef4444;
        let newTank = createTank(-data.x, -data.z, eColor, 'enemy', data.type, enemyFlagType);
        enemyTanks.push(newTank);
    });

    socket.on("remote_tank_move", (data) => {
        if (enemyTanks[data.index] && !enemyTanks[data.index].isDestroyed) {
            let tank = enemyTanks[data.index];
            tank.targetPos.set(-data.x, data.y, -data.z);
            tank.targetRotY = data.rotY + Math.PI;
            if (tank.mesh.position.distanceTo(tank.targetPos) > 0.5) createTrackMark(tank.targetPos);
        }
    });

    socket.on("remote_shoot", (data) => {
        if (enemyTanks[data.tankIndex]) {
            fireBullet(enemyTanks[data.tankIndex]);
        }
    });

    socket.on("rig_captured", (data) => {
        if (oilRigs[data.rigIndex]) {
            updateRigFlag(oilRigs[data.rigIndex], data.owner);
        }
    });

    const soundFiles = {
        menuBgm: 'sounds/menu_bgm.mp3',
        battleBgm: 'sounds/battle_bgm.mp3',
        click: 'sounds/click.mp3',
        shoot: 'sounds/shoot.mp3',
        explosion: 'sounds/explosion.mp3',
        buy: 'sounds/buy.mp3'
    };

    let menuBgmAudio = new Audio(soundFiles.menuBgm);
    menuBgmAudio.loop = true; menuBgmAudio.volume = 0.4;
    let battleBgmAudio = new Audio(soundFiles.battleBgm);
    battleBgmAudio.loop = true; battleBgmAudio.volume = 0.5;

    window.addEventListener('pointerdown', () => {
        if (menuBgmAudio.paused && document.getElementById('start-menu').style.display !== 'none') {
            menuBgmAudio.play().catch(e => {});
        }
    }, { once: true });

    function playClickSound() { const a = new Audio(soundFiles.click); a.volume = 0.6; a.play().catch(e => {}); }
    function playSound(type, vol = 1.0) { if (soundFiles[type]) { const a = new Audio(soundFiles[type]); a.volume = vol; a.play().catch(e => {}); } }

    let currentRoomId = null;
    let isHost = false;
    let playerFlagType = 'green';
    let enemyFlagType = 'red';

    function showLobbySelection() {
        document.getElementById('lobby-selection-view').style.display = 'block';
        document.getElementById('create-room-view').style.display = 'none';
        document.getElementById('waiting-room-view').style.display = 'none';
        socket.emit("get_rooms");
    }

    function showCreateRoomPanel() {
        document.getElementById('lobby-selection-view').style.display = 'none';
        document.getElementById('create-room-view').style.display = 'block';
    }

    function selectFlag(color) {
        playerFlagType = color;
        enemyFlagType = color === 'green' ? 'red' : 'green';
        document.querySelectorAll('#player-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-player', btn.innerText.includes(color === 'green' ? 'الأخضر السوري' : 'الأحمر السوري'));
        });
    }

    function createRoomAction() {
        let roomName = document.getElementById('room-name-input').value || 'معركة سريعة';
        socket.emit("create_room", { name: roomName, hostFlag: playerFlagType });
    }

    function joinRoom(roomId) { socket.emit("join_room", { roomId: roomId }); }
    function hostStartGame() { socket.emit("start_game", { roomId: currentRoomId }); }
    function leaveRoom() {
        if (currentRoomId) { socket.emit("leave_room", { roomId: currentRoomId }); currentRoomId = null; }
        showLobbySelection();
    }

    let scene, camera, renderer, dirLight;
    let cameraRadius = 280, targetCameraRadius = 280;
    let cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };

    let isDragging = false, previousTouchX = 0, previousTouchY = 0, touchStartX = 0, touchStartY = 0, hasMoved = false;

    let playerTanks = [], enemyTanks = [], bullets = [], animatedRigs = [], wavingFlags = [], trackMarks = [], oilRigs = [];
    let targetMarkerMesh;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let terrainMesh;

    const CORNER_OFFSET = 380, MAP_LIMIT = 460;
    let playerMoney = 500, gameTick = 0, playerBuildCooldown = 0;
    let gameOver = false;

    function getTerrainHeight(x, z) {
        let h = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5 + Math.sin(x * 0.008) * 8;
        if (Math.sqrt(x * x + z * z) < 140) h *= 0.2;
        return h;
    }

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text; msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    }

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        setupLighting();
        createTerrain();
        createBases();
        createOilRigs();
        createTargetMarker();
        setupInteraction();
        setupMinimapInteraction();

        updateEconomyUI();
        window.addEventListener('resize', onWindowResize);
        animate();
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function processCameraInputs() {
        const moveSpeed = 5.0; let dx = 0, dz = 0;
        if (camInputs.up) { dx -= Math.sin(cameraTheta) * moveSpeed; dz -= Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.down) { dx += Math.sin(cameraTheta) * moveSpeed; dz += Math.cos(cameraTheta) * moveSpeed; }
        if (camInputs.left) { dx -= Math.cos(cameraTheta) * moveSpeed; dz += Math.sin(cameraTheta) * moveSpeed; }
        if (camInputs.right) { dx += Math.cos(cameraTheta) * moveSpeed; dz -= Math.sin(cameraTheta) * moveSpeed; }

        targetLookAt.x = Math.max(-420, Math.min(420, targetLookAt.x + dx));
        targetLookAt.z = Math.max(-420, Math.min(420, targetLookAt.z + dz));

        if (camInputs.zi) targetCameraRadius = Math.max(60, targetCameraRadius - 5);
        if (camInputs.zo) targetCameraRadius = Math.min(550, targetCameraRadius + 5);
    }

    function startGame() {
        menuBgmAudio.pause(); menuBgmAudio.currentTime = 0;
        battleBgmAudio.play().catch(e => {});

        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';
        playSound('buy');

        let startCoord = isHost ? CORNER_OFFSET : -CORNER_OFFSET;
        targetLookAt.set(startCoord, getTerrainHeight(startCoord, startCoord), startCoord);
        targetCameraRadius = 110; cameraPhi = Math.PI / 3.8; cameraRadius = targetCameraRadius;
        updateCameraPosition();
        showFloatingMsg('بدأت المعركة الاستراتيجية الفورية!');
    }

    function setupLighting() {
        scene.add(new THREE.AmbientLight(0xffffff, 0.85));
        dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(400, 600, 400);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        let d = 500;
        dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);
    }

    function createTerrain() {
        const geo = new THREE.PlaneGeometry(1100, 1100, 50, 50);
        geo.rotateX(-Math.PI / 2);
        const posAttr = geo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            posAttr.setY(i, getTerrainHeight(posAttr.getX(i), posAttr.getZ(i)));
        }
        geo.computeVertexNormals();
        terrainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x4a5d4e, roughness: 0.85 }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);
    }

    function createBaseStructure(parentGroup, flagType) {
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5 });
        const concreteMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });
        
        [-18, 18].forEach(x => {
            const sideWall = new THREE.Mesh(new THREE.BoxGeometry(3, 10, 38), wallMat);
            sideWall.position.set(x, 5, 0); sideWall.castShadow = true; sideWall.receiveShadow = true; parentGroup.add(sideWall);
        });

        const hqBase = new THREE.Mesh(new THREE.BoxGeometry(22, 11, 18), concreteMat);
        hqBase.position.set(0, 5.5, -4); hqBase.castShadow = true; hqBase.receiveShadow = true; parentGroup.add(hqBase);

        const door = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 0.6), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        door.position.set(0, 3, 5.1); parentGroup.add(door);

        [-6, 6].forEach(wx => {
            const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.5), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
            windowMesh.position.set(wx, 7, 5.1); parentGroup.add(windowMesh);
        });

        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 42, 8), new THREE.MeshStandardMaterial({ color: 0xd1d5db }));
        pole.position.set(0, 21, -12); parentGroup.add(pole);

        let flagMesh = createWavingFlagMesh(flagType);
        flagMesh.position.set(7, 36, -12);
        parentGroup.add(flagMesh);
    }

    function createWavingFlagMesh(flagType) {
        const flagWidth = 14, flagHeight = 9;
        const flagGeo = new THREE.PlaneGeometry(flagWidth, flagHeight, 12, 8);
        let flagCanvas = document.createElement('canvas');
        flagCanvas.width = 128; flagCanvas.height = 64;
        let ctx = flagCanvas.getContext('2d');
        
        if (flagType === 'green') {
            ctx.fillStyle = '#007a3d'; ctx.fillRect(0, 0, 128, 21);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 21, 128, 22);
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 43, 128, 21);
            ctx.fillStyle = '#ce1126'; ctx.font = 'bold 20px Arial'; ctx.fillText('★ ★', 44, 37);
        } else if (flagType === 'red') {
            ctx.fillStyle = '#ce1126'; ctx.fillRect(0, 0, 128, 21);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 21, 128, 22);
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 43, 128, 21);
            ctx.fillStyle = '#007a3d'; ctx.font = 'bold 16px Arial'; ctx.fillText('★ ★ ★', 38, 37);
        } else {
            // العلم الأبيض الحيادي للنفط قبل السيطرة
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 64);
            ctx.fillStyle = '#64748b'; ctx.font = 'bold 14px Arial'; ctx.fillText('NEUTRAL', 30, 36);
        }

        let flagTexture = new THREE.CanvasTexture(flagCanvas);
        let flagMat = new THREE.MeshStandardMaterial({ map: flagTexture, side: THREE.DoubleSide, roughness: 0.4 });
        let flagMesh = new THREE.Mesh(flagGeo, flagMat);
        wavingFlags.push({ mesh: flagMesh, origGeo: flagGeo.clone(), timeOffset: Math.random() * 10 });
        return flagMesh;
    }

    function updateRigFlag(rig, newOwner) {
        if (rig.owner === newOwner) return;
        rig.owner = newOwner;
        rig.group.remove(rig.flagMesh);
        rig.flagMesh = createWavingFlagMesh(newOwner);
        rig.flagMesh.position.set(6, 26, 0);
        rig.group.add(rig.flagMesh);
    }

    function createBases() {
        const pBase = new THREE.Group();
        pBase.position.set(CORNER_OFFSET, getTerrainHeight(CORNER_OFFSET, CORNER_OFFSET), CORNER_OFFSET);
        const eBase = new THREE.Group();
        eBase.position.set(-CORNER_OFFSET, getTerrainHeight(-CORNER_OFFSET, -CORNER_OFFSET), -CORNER_OFFSET);

        createBaseStructure(pBase, playerFlagType);
        createBaseStructure(eBase, enemyFlagType);
        scene.add(pBase); scene.add(eBase);

        let pColor = playerFlagType === 'green' ? 0x15803d : 0xb91c1c;
        let startCoord = isHost ? CORNER_OFFSET : -CORNER_OFFSET;
        let playerTank = createTank(startCoord - 45, startCoord - 45, pColor, 'player', 'normal', playerFlagType);
        playerTanks.push(playerTank);
    }

    function createOilRigs() {
        [{ x: 50, z: -50 }, { x: -50, z: 50 }, { x: -70, z: -70 }, { x: 70, z: 70 }].forEach((pos, idx) => {
            const rigGroup = new THREE.Group();
            rigGroup.position.set(pos.x, getTerrainHeight(pos.x, pos.z), pos.z);
            
            const base = new THREE.Mesh(new THREE.BoxGeometry(14, 2.5, 14), new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.5 }));
            base.position.y = 1.25; base.castShadow = true; base.receiveShadow = true; rigGroup.add(base);

            const tower = new THREE.Mesh(new THREE.BoxGeometry(3, 10, 3), new THREE.MeshStandardMaterial({ color: 0x64748b }));
            tower.position.set(0, 6, -3); tower.castShadow = true; rigGroup.add(tower);

            const beam = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 18), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
            beam.position.set(0, 11, 2); beam.castShadow = true;
            rigGroup.add(beam);
            animatedRigs.push(beam);

            // سارية وعلم أبيض حيادي للبئر
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 20, 8), new THREE.MeshStandardMaterial({ color: 0xd1d5db }));
            pole.position.set(0, 16, 0); rigGroup.add(pole);

            let flagMesh = createWavingFlagMesh('neutral');
            flagMesh.position.set(6, 26, 0);
            rigGroup.add(flagMesh);

            scene.add(rigGroup);
            oilRigs.push({ group: rigGroup, flagMesh: flagMesh, owner: 'neutral', index: idx });
        });
    }

    function createTankBadge(flagType) {
        let canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 32;
        let ctx = canvas.getContext('2d');
        if (flagType === 'green') {
            ctx.fillStyle = '#007a3d'; ctx.fillRect(0, 0, 64, 10);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 10, 64, 12);
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 22, 64, 10);
            ctx.fillStyle = '#ce1126'; ctx.font = 'bold 10px Arial'; ctx.fillText('★ ★', 22, 19);
        } else {
            ctx.fillStyle = '#ce1126'; ctx.fillRect(0, 0, 64, 10);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 10, 64, 12);
            ctx.fillStyle = '#000000'; ctx.fillRect(0, 22, 64, 10);
            ctx.fillStyle = '#007a3d'; ctx.font = 'bold 8px Arial'; ctx.fillText('★ ★ ★', 18, 19);
        }
        return new THREE.CanvasTexture(canvas);
    }

    function createTank(x, z, colorHex, team, type = 'normal', flagType = 'green') {
        const group = new THREE.Group();
        let isRocket = (type === 'rocket');
        
        let body = new THREE.Mesh(
            new THREE.BoxGeometry(isRocket ? 7.5 : 6.5, 2.4, isRocket ? 11 : 9.5),
            new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4 })
        );
        body.position.y = 1.2; body.castShadow = true; body.receiveShadow = true; group.add(body);

        let badgeTex = createTankBadge(flagType);
        let badgeMat = new THREE.MeshBasicMaterial({ map: badgeTex });
        let leftBadge = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 2), badgeMat);
        leftBadge.position.set(-3.3, 1.2, 0); leftBadge.rotateY(-Math.PI/2); group.add(leftBadge);
        let rightBadge = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 2), badgeMat);
        rightBadge.position.set(3.3, 1.2, 0); rightBadge.rotateY(Math.PI/2); group.add(rightBadge);

        let turret = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 1.6, 12), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        turret.position.y = 2.9; turret.castShadow = true; group.add(turret);

        let barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, isRocket ? 8 : 6, 8), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
        barrel.rotateX(Math.PI / 2); barrel.position.set(0, 2.9, isRocket ? 4.5 : 3.5); group.add(barrel);

        group.position.set(x, getTerrainHeight(x, z), z);
        scene.add(group);

        const hpLabel = document.createElement('div');
        hpLabel.className = `tank-hp-label ${team === 'player' ? 'hp-player' : 'hp-enemy'}`;
        let maxHp = isRocket ? 200 : 100;
        hpLabel.innerText = `${maxHp}`;
        document.getElementById('hp-labels-container').appendChild(hpLabel);

        return {
            mesh: group, hpLabel: hpLabel, target: null, team: team, type: type,
            hp: maxHp, maxHp: maxHp, lastShot: 0, isDestroyed: false, flagType: flagType,
            targetPos: group.position.clone(), targetRotY: 0
        };
    }

    function buyPlayerTank(type) {
        if (playerBuildCooldown > 0) return;
        let cost = (type === 'rocket') ? 300 : 150;
        if (playerMoney >= cost) {
            playerMoney -= cost; playerBuildCooldown = 1200;
            updateEconomyUI(); playSound('buy');
            let pColor = playerFlagType === 'green' ? 0x15803d : 0xb91c1c;
            let startCoord = isHost ? CORNER_OFFSET : -CORNER_OFFSET;
            let px = startCoord - 50 + (Math.random() - 0.5) * 20;
            let pz = startCoord - 50 + (Math.random() - 0.5) * 20;
            let newTank = createTank(px, pz, pColor, 'player', type, playerFlagType);
            playerTanks.push(newTank);

            socket.emit("spawn_tank", { roomId: currentRoomId, x: px, z: pz, type: type });
            showFloatingMsg('تم شراء دبابة جديدة!');
        }
    }

    function createTargetMarker() {
        const geo = new THREE.RingGeometry(1.2, 2.2, 16); geo.rotateX(-Math.PI / 2);
        targetMarkerMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
        targetMarkerMesh.visible = false;
        scene.add(targetMarkerMesh);
    }

    function createTrackMark(pos) {
        const markGeo = new THREE.PlaneGeometry(1.8, 1.8);
        markGeo.rotateX(-Math.PI / 2);
        const markMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.5 });
        const markMesh = new THREE.Mesh(markGeo, markMat);
        markMesh.position.set(pos.x, getTerrainHeight(pos.x, pos.z) + 0.05, pos.z);
        scene.add(markMesh);
        trackMarks.push({ mesh: markMesh, time: Date.now() });

        if (trackMarks.length > 50) {
            let old = trackMarks.shift();
            scene.remove(old.mesh);
        }
    }

    function fireBullet(tank) {
        playSound('shoot', 0.6);
        const bMesh = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
        let worldPos = new THREE.Vector3();
        tank.mesh.getWorldPosition(worldPos);
        bMesh.position.set(worldPos.x, worldPos.y + 3, worldPos.z);
        
        let dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), tank.mesh.rotation.y);
        bullets.push({ mesh: bMesh, dir: dir, team: tank.team, damage: tank.type === 'rocket' ? 50 : 25 });
        scene.add(bMesh);
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
            if (gameOver) return;
            isDragging = true; hasMoved = false;
            previousTouchX = e.clientX; previousTouchY = e.clientY;
            touchStartX = e.clientX; touchStartY = e.clientY;
        });

        dom.addEventListener('pointermove', (e) => {
            if (!isDragging || gameOver) return;
            let deltaX = e.clientX - previousTouchX;
            let deltaY = e.clientY - previousTouchY;
            if (Math.abs(e.clientX - touchStartX) > 5 || Math.abs(e.clientY - touchStartY) > 5) hasMoved = true;
            if (hasMoved) {
                cameraTheta -= deltaX * 0.008;
                cameraPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraPhi - deltaY * 0.008));
            }
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });

        dom.addEventListener('pointerup', (e) => {
            if (gameOver) return;
            isDragging = false;
            if (!hasMoved) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const intersects = raycaster.intersectObject(terrainMesh);
                if (intersects.length > 0) {
                    let pt = intersects[0].point;
                    targetMarkerMesh.position.copy(pt);
                    targetMarkerMesh.position.y = getTerrainHeight(pt.x, pt.z) + 0.1;
                    targetMarkerMesh.visible = true;

                    playerTanks.forEach(t => {
                        if (!t.isDestroyed) t.target = pt.clone();
                    });
                }
            }
        });
    }

    function setupMinimapInteraction() {
        const minimap = document.getElementById('minimap-container');
        minimap.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            const rect = minimap.getBoundingClientRect();
            targetLookAt.x = (((e.clientX - rect.left) / rect.width - 0.5) * 2) * MAP_LIMIT;
            targetLookAt.z = (((e.clientY - rect.top) / rect.height - 0.5) * 2) * MAP_LIMIT;
        });
    }

    function renderMinimap() {
        const canvas = document.getElementById('minimap-canvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(55, 55, 55, 0, Math.PI * 2); ctx.fill();
        const sc = 55 / MAP_LIMIT;

        playerTanks.forEach(t => {
            if (!t.isDestroyed) { ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(55 + t.mesh.position.x * sc, 55 + t.mesh.position.z * sc, 2.5, 0, Math.PI*2); ctx.fill(); }
        });
        enemyTanks.forEach(t => {
            if (!t.isDestroyed) { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(55 + t.mesh.position.x * sc, 55 + t.mesh.position.z * sc, 2.5, 0, Math.PI*2); ctx.fill(); }
        });
    }

    function updateCameraPosition() {
        cameraRadius = THREE.MathUtils.lerp(cameraRadius, targetCameraRadius, 0.15);
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function updateTankHpLabels() {
        const v = new THREE.Vector3();
        [...playerTanks, ...enemyTanks].forEach(t => {
            if (t.isDestroyed) { t.hpLabel.style.display = 'none'; return; }
            t.hpLabel.style.display = 'block';
            t.mesh.getWorldPosition(v); v.y += 4; v.project(camera);
            t.hpLabel.style.left = `${(v.x * .5 + .5) * window.innerWidth}px`;
            t.hpLabel.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
            t.hpLabel.innerText = `${t.hp}`;
        });
    }

    function updateGameLogic() {
        if (gameOver) return;
        gameTick++;
        if (gameTick % 60 === 0) { playerMoney += 12; updateEconomyUI(); }

        animatedRigs.forEach((beam, idx) => {
            beam.rotation.z = Math.sin(gameTick * 0.05 + idx) * 0.25;
        });

        wavingFlags.forEach(f => {
            const posAttr = f.mesh.geometry.attributes.position;
            const t = gameTick * 0.1 + f.timeOffset;
            for (let i = 0; i < posAttr.count; i++) {
                let x = posAttr.getX(i);
                if (x > 0) {
                    let wave = Math.sin(t + x * 0.5) * 0.6;
                    posAttr.setZ(i, wave);
                }
            }
            posAttr.needsUpdate = true;
        });

        // تنعيم حركة دبابات الخصم الفورية (Interpolation)
        enemyTanks.forEach(en => {
            if (!en.isDestroyed) {
                en.mesh.position.lerp(en.targetPos, 0.3);
                en.mesh.rotation.y += (en.targetRotY - en.mesh.rotation.y) * 0.3;
            }
        });

        // فحص السيطرة على آبار النفط
        oilRigs.forEach(rig => {
            playerTanks.forEach(tank => {
                if (!tank.isDestroyed && tank.mesh.position.distanceTo(rig.group.position) < 16) {
                    if (rig.owner !== playerFlagType) {
                        updateRigFlag(rig, playerFlagType);
                        if (currentRoomId) socket.emit("capture_rig", { roomId: currentRoomId, rigIndex: rig.index, owner: playerFlagType });
                        showFloatingMsg('سيطرت على بئر نفط! 🛢️');
                    }
                }
            });
        });

        playerTanks.forEach((tank, idx) => {
            if (tank.isDestroyed) return;
            let isMoving = false;
            let oldPos = tank.mesh.position.clone();

            if (tank.target) {
                let dist = tank.mesh.position.distanceTo(tank.target);
                if (dist > 1.5) {
                    let dir = new THREE.Vector3().subVectors(tank.target, tank.mesh.position).setY(0).normalize();
                    isMoving = true;
                    tank.mesh.rotation.y += (Math.atan2(dir.x, dir.z) - tank.mesh.rotation.y) * 0.15;
                    tank.mesh.position.add(dir.multiplyScalar(0.35));
                    tank.mesh.position.y = getTerrainHeight(tank.mesh.position.x, tank.mesh.position.z);
                } else {
                    targetMarkerMesh.visible = false; tank.target = null;
                }
            }

            if (isMoving && oldPos.distanceTo(tank.mesh.position) > 1.5) {
                createTrackMark(tank.mesh.position);
            }

            enemyTanks.forEach(en => {
                if (!en.isDestroyed && tank.mesh.position.distanceTo(en.mesh.position) < 120 && Date.now() - tank.lastShot > 1500) {
                    tank.lastShot = Date.now();
                    fireBullet(tank);
                    if (currentRoomId) socket.emit("shoot", { roomId: currentRoomId, tankIndex: idx });
                }
            });

            if (isMoving && currentRoomId) {
                socket.emit("tank_move", {
                    roomId: currentRoomId, index: idx,
                    x: tank.mesh.position.x, y: tank.mesh.position.y, z: tank.mesh.position.z,
                    rotY: tank.mesh.rotation.y
                });
            }
        });

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.mesh.position.add(b.dir.clone().multiplyScalar(4));
            let targetList = (b.team === 'player') ? enemyTanks : playerTanks;
            
            let hit = false;
            for (let t of targetList) {
                if (!t.isDestroyed && b.mesh.position.distanceTo(t.mesh.position) < 3.5) {
                    t.hp -= b.damage; hit = true;
                    playSound('explosion', 0.5);
                    if (t.hp <= 0) { t.isDestroyed = true; scene.remove(t.mesh); t.hpLabel.remove(); }
                    break;
                }
            }
            if (hit || b.mesh.position.length() > 600) {
                scene.remove(b.mesh); bullets.splice(i, 1);
            }
        }
    }

    function updateEconomyUI() {
        document.getElementById('money-display').innerText = playerMoney;
        document.getElementById('buy-tank-btn').disabled = (playerMoney < 150 || playerBuildCooldown > 0);
        document.getElementById('buy-rocket-tank-btn').disabled = (playerMoney < 300 || playerBuildCooldown > 0);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        processCameraInputs();
        updateCameraPosition();
        updateGameLogic();
        updateTankHpLabels();
        renderMinimap();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
