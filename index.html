<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TANK COMMAND</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#080b0c;color:#fff;touch-action:manipulation}body{background:radial-gradient(circle at 50% 20%,#344044 0,#151a1b 42%,#070909 100%)}#app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}.screen{width:min(940px,100%);max-height:96vh;overflow:auto;border:1px solid #66706d66;background:linear-gradient(145deg,#18201fcc,#0a0d0eeF);box-shadow:0 25px 80px #000b;border-radius:24px;padding:clamp(20px,4vw,42px);backdrop-filter:blur(14px)}.hidden{display:none!important}.brand{text-align:center;margin-bottom:26px}.brand h1{font-size:clamp(32px,7vw,68px);letter-spacing:5px;margin:0;text-shadow:0 5px 25px #000}.brand p{color:#b8c1bd;margin:8px 0;font-size:clamp(12px,2.5vw,16px)}.line{height:2px;background:linear-gradient(90deg,transparent,#c6a35b,transparent);margin:20px 0 28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.btn{border:1px solid #77807866;border-radius:15px;padding:17px 18px;background:linear-gradient(180deg,#29312f,#151a19);color:#fff;font-size:17px;font-weight:700;cursor:pointer;min-height:58px;transition:.18s}.btn:hover,.btn:active{transform:translateY(-2px);border-color:#c7a75e;background:linear-gradient(180deg,#4a4b39,#22261f)}.primary{background:linear-gradient(180deg,#b18e4e,#745a2d);border-color:#e0c27d;color:#fff}.wide{grid-column:1/-1}.title{font-size:25px;margin:0 0 18px}.sub{color:#aeb8b3;font-size:14px;margin:-8px 0 18px}.row{display:flex;gap:10px;align-items:center}.input{width:100%;padding:16px;border-radius:13px;border:1px solid #66716d66;background:#090d0e;color:#fff;font-size:16px;outline:none}.input:focus{border-color:#c5a45d}.room{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.card{border:1px solid #68716d55;background:#111718;border-radius:16px;padding:18px}.card h3{margin:0 0 8px}.card p{margin:0;color:#9fa9a4;font-size:13px;line-height:1.6}.status{margin-top:15px;padding:12px;border-radius:12px;background:#0b1011;color:#b9c1bd;text-align:center;font-size:13px}.players{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pill{padding:9px 12px;border-radius:30px;background:#27302d;border:1px solid #69736c55;font-size:13px}.back{margin-top:16px;background:#171d1d}.game{width:100%;height:100%;position:relative}.game canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.hud .box{background:#080b0dcc;border:1px solid #ffffff22;border-radius:12px;padding:10px 14px}.exit{pointer-events:auto;cursor:pointer}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b0e0f;color:#fff;border:1px solid #c3a45c88;border-radius:12px;padding:12px 18px;opacity:0;transition:.25s;z-index:50}.toast.show{opacity:1}@media(max-width:620px){.grid{grid-template-columns:1fr}.room{grid-template-columns:1fr}.screen{border-radius:18px;padding:22px 16px}.btn{font-size:15px}.brand{margin-bottom:18px}}
</style></head><body><div id="app"><section id="home" class="screen"><div class="brand"><h1>TANK COMMAND</h1><p>ساحة المعركة ثلاثية الأبعاد</p></div><div class="line"></div><div class="grid"><button class="btn primary wide" onclick="show('online')">🌐 لعب جماعي</button><button class="btn" onclick="show('local')">⚔️ معركة محلية</button><button class="btn" onclick="toast('إعدادات المحرك جاهزة للإضافة')">⚙️ الإعدادات</button></div></section><section id="online" class="screen hidden"><h2 class="title">اللعب الجماعي</h2><p class="sub">أنشئ غرفة لصديقك أو أدخل رمز غرفة موجودة.</p><div class="grid"><button class="btn primary" onclick="createRoom()">إنشاء غرفة</button><button class="btn" onclick="joinBox()">انضمام لغرفة</button></div><div id="join" class="card hidden" style="margin-top:16px"><h3>رمز الغرفة</h3><div class="row"><input id="code" class="input" placeholder="مثال: A7K92"><button class="btn primary" onclick="joinRoom()">دخول</button></div></div><div id="roomPanel" class="hidden"><div class="room"><div class="card"><h3>الغرفة</h3><p>شارك رمز الغرفة مع صديقك ليدخل معك.</p><div class="status" id="roomCode">—</div></div><div class="card"><h3>الخريطة</h3><p>ساحة رملية ثلاثية الأبعاد.</p><div class="status">متاحة</div></div></div><div class="players" id="players"><span class="pill">أنت</span></div><button class="btn primary wide" onclick="startGame()">بدء المعركة</button></div><button class="btn back wide" onclick="show('home')">رجوع</button></section><section id="local" class="screen hidden"><h2 class="title">معركة محلية</h2><p class="sub">نسخة تجريبية من الساحة ثلاثية الأبعاد.</p><button class="btn primary wide" onclick="startGame()">بدء المعركة</button><button class="btn back wide" onclick="show('home')">رجوع</button></section></div><div id="game" class="game hidden"><div class="hud"><div class="box">TANK COMMAND<br><small>ساحة رملية</small></div><button class="box exit" onclick="exitGame()">خروج</button></div></div><div id="toast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const SERVER='https://tank-game-server-o650.onrender.com/';let roomId='';function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function joinBox(){document.getElementById('join').classList.remove('hidden');document.getElementById('code').focus()}function createRoom(){roomId=Math.random().toString(36).slice(2,7).toUpperCase();document.getElementById('roomCode').textContent=roomId;document.getElementById('roomPanel').classList.remove('hidden');toast('تم إنشاء الغرفة: '+roomId)}function joinRoom(){let c=document.getElementById('code').value.trim().toUpperCase();if(!c)return toast('اكتب رمز الغرفة');roomId=c;document.getElementById('roomCode').textContent=c;document.getElementById('roomPanel').classList.remove('hidden');toast('تم تجهيز الانضمام للغرفة')}function startGame(){document.getElementById('app').classList.add('hidden');document.getElementById('game').classList.remove('hidden');init3D()}function exitGame(){location.reload()}
let started=false;function init3D(){if(started)return;started=true;const game=document.getElementById('game');const scene=new THREE.Scene();scene.background=new THREE.Color(0x87a8b5);scene.fog=new THREE.Fog(0x87a8b5,70,230);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);camera.position.set(0,24,34);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;game.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe5c0,0x55452e,2));let sun=new THREE.DirectionalLight(0xffdfaa,3);sun.position.set(-50,90,40);sun.castShadow=true;scene.add(sun);let g=new THREE.PlaneGeometry(180,180,100,100),p=g.attributes.position;for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i);p.setZ(i,(Math.sin(x*.05)*1.1+Math.cos(y*.06)*.9+Math.sin((x+y)*.025)*1.4)*Math.min(Math.hypot(x,y)/45,1))}g.computeVertexNormals();let ground=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xc79d63,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let i=0;i<450;i++){let r=new THREE.Mesh(new THREE.IcosahedronGeometry(.05+Math.random()*.16,0),new THREE.MeshStandardMaterial({color:Math.random()>.5?0xa98351:0xd0aa70,roughness:1}));r.position.set((Math.random()-.5)*170,.08,(Math.random()-.5)*170);r.scale.y=.3+Math.random()*.7;scene.add(r)}let yaw=0,pitch=-.45,dist=34,target=new THREE.Vector3();function cam(){let x=Math.sin(yaw)*Math.cos(pitch)*dist,y=-Math.sin(pitch)*dist,z=Math.cos(yaw)*Math.cos(pitch)*dist;camera.position.set(target.x+x,target.y+y,target.z+z);camera.lookAt(target)}let lx=0,ly=0,down=false;renderer.domElement.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY});window.addEventListener('pointerup',()=>down=false);window.addEventListener('pointermove',e=>{if(!down)return;yaw-=(e.clientX-lx)*.006;pitch-=(e.clientY-ly)*.004;pitch=Math.max(-1.3,Math.min(-.08,pitch));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(90,dist+e.deltaY*.03))});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);cam();renderer.render(scene,camera)}loop()}
</script></body></html>
