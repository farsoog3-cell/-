<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الدبابات الثلاثية الأبعاد - المعسكرات والأعلام</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background: #ff6b81;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://tank-game-server-o650.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="ui">
        <h2>غرفة الحرب والمعسكرات</h2>
        <p id="status">حالة الاتصال: جاري الاتصال بالسيرفر...</p>
        <hr>
        <h3>متجر الدبابات</h3>
        <p>الرصيد: <span id="coins">100</span> عملة</p>
        <button onclick="buyTank('معسكر الألفا')">شراء دبابة ثقيلة (50 عملة)</button>
    </div>

    <script>
        // الاتصال بسيرفر الأونلاين الخاص بك
        const socket = io("https://tank-game-server-o650.onrender.com");

        socket.on('connect', () => {
            document.getElementById('status').innerText = "حالة الاتصال: متصل بنجاح بالصديق عبر الإنترنت!";
            document.getElementById('status').style.color = "#2ed573";
        });

        socket.on('disconnect', () => {
            document.getElementById('status').innerText = "حالة الاتصال: انقطع الاتصال بالسيرفر!";
            document.getElementById('status').style.color = "#ff4757";
        });

        // إعداد بيئة الرسوم الثلاثية الأبعاد باستخدام Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // سماء جميلة (لون سماوي)
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // الأرض
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 }); // أرض عشبية
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // إنشاء المعسكرات والأعلام التي ترفرف
        const flags = [];

        function createCamp(x, z, flagColor, campName) {
            // قاعدة المعسكر
            const baseGeo = new THREE.BoxGeometry(20, 1, 20);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.set(x, 0.5, z);
            scene.add(base);

            // سارية العلم
            const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 15);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(x - 8, 7.5, z - 8);
            scene.add(pole);

            // قماش العلم (الذي سيهتز ليعطي إيحاء الرفرفة)
            const flagGeo = new THREE.PlaneGeometry(5, 3, 10, 10);
            const flagMat = new THREE.MeshStandardMaterial({ color: flagColor, side: THREE.DoubleSide });
            const flag = new THREE.Mesh(flagGeo, flagMat);
            flag.position.set(x - 5.5, 13, z - 8);
            scene.add(flag);
            
            flags.push({ mesh: flag, timeOffset: Math.random() * 10 });
        }

        // بناء معسكرين متنافسين
        createCamp(-50, -50, 0xff0000, "معسكر الأحمر"); // علم أحمر
        createCamp(50, 50, 0x0000ff, "معسكر الأزرق");   // علم أزرق

        // وضع الكاميرا
        camera.position.set(0, 30, 80);
        camera.lookAt(0, 0, 0);

        // دالة شراء الدبابات
        let coins = 100;
        function buyTank(camp) {
            if (coins >= 50) {
                coins -= 50;
                document.getElementById('coins').innerText = coins;
                alert("تم شراء دبابة حربية جديدة لـ " + camp + " بنجاح! جاهزة للمعركة.");
                // إرسال حدث الشراء للسيرفر ليراه الصديق الآخر
                socket.emit('buy_tank', { camp: camp });
            } else {
                alert("عذراً، رصيدك غير كافي لشراء دبابة!");
            }
        }

        // حلقة التحديث والرسم (Animation Loop) لتوليد حركة رفرفة الأعلام والسماء
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            let elapsedTime = clock.getElapsedTime();

            // تحريك الأعلام لتررف بفعل الهواء
            flags.forEach(f => {
                const positionAttribute = f.mesh.geometry.attributes.position;
                for (let i = 0; i < positionAttribute.count; i++) {
                    let vertexX = positionAttribute.getX(i);
                    // جعل حافة العلم تهتز بناءً على الزمن
                    if (vertexX > 0) {
                        let wave = Math.sin(elapsedTime * 8 + i + f.timeOffset) * 0.3;
                        positionAttribute.setZ(i, wave);
                    }
                }
                positionAttribute.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }

        animate();

        // التكيف مع حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
