<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - أونلاين حقيقي (Socket.io)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
            padding: 15px;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; text-align: center;
        }

        .menu-card h1 { font-size: 18px; margin-bottom: 12px; color: #38bdf8; }
        .section-title { font-size: 12px; color: #94a3b8; margin: 8px 0 4px 0; text-align: right; }
        
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .flag-btn {
            flex: 1; padding: 8px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer;
        }
        .flag-btn.active-green { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .flag-btn.active-red { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .action-btn {
            width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 6px;
            background: #22c55e; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        #floating-msg {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: #38bdf8; padding: 6px 14px;
            border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
            border: 1px solid #38bdf8; z-index: 100;
        }

        .cam-controls {
            position: absolute; bottom: 10px; right: 10px;
            display: grid; grid-template-columns: repeat(3, 45px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 45px; height: 45px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>معركة الدبابات - أونلاين ⚔️</h1>
        
        <div class="section-title">اختر معسكرك:</div>
        <div class="flag-options">
            <button class="flag-btn active-green" id="btn-green" onclick="selectTeam('green')">الأخضر</button>
            <button class="flag-btn" id="btn-red" onclick="selectTeam('red')">الأحمر</button>
        </div>

        <button class="action-btn" onclick="findMatch()">بحث عن معركة والاتصال بالسيرفر 🚀</button>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container"></div>
    <div id="floating-msg">جاري البحث عن لاعب آخر...</div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)">➡️</button>
    </div>
</div>

<div id="canvas-container"></div>

<!-- مكتبة Three.js و Socket.io Client -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io(); // الاتصال بسيرفر Node.js الحالي

    let selectedTeam = 'green';
    let scene, camera, renderer;
    let playerTank = null;
    let remoteTanks = {}; // تخزين دبابات الخصوم المتصلين
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let cameraRadius = 200, cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };
    
    let playerTargetPos = null;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let terrainMesh;

    function selectTeam(team) {
        selectedTeam = team;
        document.getElementById('btn-green').className = team === 'green' ? 'flag-btn active-green' : 'flag-btn';
        document.getElementById('btn-red').className = team === 'red' ? 'flag-btn active-red' : 'flag-btn';
    }

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text;
        msg.style.opacity = '1';
    }

    function findMatch() {
        showFloatingMsg('جاري البحث عن خصم في السيرفر...');
        // إرسال طلب البحث عن معركة للسيرفر الذي كتبته
        socket.emit('find_match', { team: selectedTeam });
    }

    // استقبال بدء المعركة من سيرفرك
    socket.on('match_started', (data) => {
        showFloatingMsg('تم العثور على خصم! بدء المعركة...');
        document.getElementById('start-menu.style.display') = 'none'; // سيتم إخفاء القائمة وبدء اللعبة
        setTimeout(() => {
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            initGameEngine();
        }, 500);
    });

    // استقبال بيانات اللاعبين الآخرين الموجودين بالمعركة
    socket.on('current_players', (players) => {
        for (let id in players) {
            createRemoteTank(id, players[id]);
        }
    });

    // استقبال حركة الخصم وتحديث مكانه فوراً
    socket.on('player_moved', (tankData) => {
        if (remoteTanks[tankData.id]) {
            let rTank = remoteTanks[tankData.id];
            rTank.mesh.position.set(tankData.x, getTerrainHeight(tankData.x, tankData.z), tankData.z);
            rTank.mesh.rotation.y = tankData.rotation;
        } else {
            createRemoteTank(tankData.id, tankData);
        }
    });

    // عند خروج الخصم
    socket.on('player_disconnected', (id) => {
        if (remoteTanks[id]) {
            scene.remove(remoteTanks[id].mesh);
            remoteTanks[id].hpLabel.remove();
            delete remoteTanks[id];
            showFloatingMsg('غادر الخصم المعركة!');
        }
    });

    function getTerrainHeight(x, z) {
        return Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5;
    }

    function initGameEngine() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        scene.add(dirLight);

        // بناء الأرضية
        const geo = new THREE.PlaneGeometry(1000, 1000, 30, 30);
        geo.rotateX(-Math.PI / 2);
        terrainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x5c3d2e }));
        scene.add(terrainMesh);

        // إنشاء دبابة اللاعب المحلي بناءً على إحداثيات السيرفر
        let startX = selectedTeam === 'green' ? -335 : 335;
        let startZ = selectedTeam === 'green' ? -335 : 335;
        playerTank = createTankMesh(startX, startZ, selectedTeam === 'green' ? 0x22c55e : 0xef4444, 'player');

        targetLookAt.set(startX, getTerrainHeight(startX, startZ), startZ);

        setupControls();
        animate();
    }

    function createTankMesh(x, z, colorHex, team) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(6, 2.2, 9), new THREE.MeshStandardMaterial({ color: colorHex }));
        body.position.y = 1.2;
        group.add(body);

        let terrainY = getTerrainHeight(x, z);
        group.position.set(x, terrainY, z);
        scene.add(group);

        const hpLabel = document.createElement('div');
        hpLabel.className = `tank-hp-label ${team === 'player' ? 'hp-player' : 'hp-enemy'}`;
        hpLabel.innerText = team === 'player' ? 'أنت' : 'خصم';
        document.getElementById('hp-labels-container').appendChild(hpLabel);

        return { mesh: group, hpLabel: hpLabel, x: x, z: z, rotation: 0 };
    }

    function createRemoteTank(id, data) {
        if (remoteTanks[id]) return;
        let color = data.team === 'green' ? 0x22c55e : 0xef4444;
        remoteTanks[id] = createTankMesh(data.x, data.z, color, 'enemy');
    }

    function setupControls() {
        renderer.domElement.addEventListener('pointerup', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(terrainMesh);
            if (intersects.length > 0 && playerTank) {
                playerTargetPos = intersects[0].point;
            }
        });
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function updateCameraPosition() {
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function animate() {
        requestAnimationFrame(animate);

        // تحريك اللاعب المحلي وإرسال مكانه للسيرفر
        if (playerTank && playerTargetPos) {
            let targetVec = new THREE.Vector3(playerTargetPos.x, getTerrainHeight(playerTargetPos.x, playerTargetPos.z), playerTargetPos.z);
            let dist = playerTank.mesh.position.distanceTo(targetVec);

            if (dist > 1.5) {
                let dir = new THREE.Vector3().subVectors(targetVec, playerTank.mesh.position).setY(0).normalize();
                playerTank.mesh.rotation.y = Math.atan2(dir.x, dir.z);
                playerTank.mesh.position.add(dir.multiplyScalar(0.4));
                playerTank.mesh.position.y = getTerrainHeight(playerTank.mesh.position.x, playerTank.mesh.position.z);

                targetLookAt.copy(playerTank.mesh.position);

                // إرسال الحركة عبر Socket.io للسيرفر لكي يراها صديقك فوراً
                socket.emit('player_move', {
                    x: playerTank.mesh.position.x,
                    z: playerTank.mesh.position.z,
                    rotation: playerTank.mesh.rotation.y
                });
            }
        }

        updateCameraPosition();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
