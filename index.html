<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية - أونلاين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 16px 20px; width: 90%; max-width: 380px; text-align: center;
        }

        .menu-card h1 { font-size: 16px; margin-bottom: 10px; color: #38bdf8; }
        .section-title { font-size: 11px; color: #94a3b8; margin: 6px 0 3px 0; text-align: right; }
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

        .flag-btn {
            flex: 1; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 11px; cursor: pointer;
        }

        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .flag-btn.active-enemy { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); }

        .input-group { margin-bottom: 8px; text-align: right; }
        .input-group label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 3px; }
        .input-group input, .input-group select {
            width: 100%; padding: 6px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-size: 12px;
        }

        #start-btn {
            width: 100%; margin-top: 10px; padding: 8px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        #waiting-room {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155; transition: transform 0.1s linear;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 210px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px;
        }
        .capture-bar-bg { width: 100%; height: 5px; background: #334155; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #38bdf8; padding: 3px 8px;
            border-radius: 4px; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 12px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 12px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة الاستراتيجية - أونلاين 🌐</h1>
        
        <div class="input-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="player-name-input" value="قائد الدبابة" maxlength="12">
        </div>

        <div class="input-group">
            <label>اسم الغرفة:</label>
            <input type="text" id="room-name-input" value="غرفة_الصقور">
        </div>

        <div class="section-title">اختر معسكرك (الفريق):</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="selectTeam('green')">الفريق الأخضر</button>
            <button class="flag-btn" onclick="selectTeam('red')">الفريق الأحمر</button>
        </div>

        <button id="start-btn" onclick="joinGameRoom()">الانخراط في المعركة 🚀</button>
    </div>
</div>

<div id="waiting-room">
    <div class="menu-card">
        <h2>انتظار اللاعبين في الغرفة...</h2>
        <div id="players-list-box" style="margin: 10px 0; font-size: 12px; color: #38bdf8; max-height: 100px; overflow-y: auto;"></div>
        <button id="start-battle-btn" onclick="startOnlineBattle()" style="width: 100%; padding: 8px; background: #22c55e; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer;">بدء المعركة الآن ⚔️</button>
    </div>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">أونلاين: سيطر مع فريقك لتربح!</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" onclick="spawnMyTank()">تعزيز دبابة (150$)</button>
        </div>
    </div>

    <div id="minimap-container" title="الخريطة المصغرة">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)" ontouchstart="camMove('zi', true)" ontouchend="camMove('zi', false)">➕</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)" ontouchstart="camMove('up', true)" ontouchend="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)" ontouchstart="camMove('zo', true)" ontouchend="camMove('zo', false)">➖</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)" ontouchstart="camMove('left', true)" ontouchend="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)" ontouchstart="camMove('down', true)" ontouchend="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)" ontouchstart="camMove('right', true)" ontouchend="camMove('right', false)">➡️</button>
    </div>
    <div class="cam-hint">تحكم بالشاشة أو بالخريطة المصغرة 🎯</div>
</div>

<div id="canvas-container"></div>

<!-- استدعاء Socket.io و Three.js -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // ضع هنا رابط سيرفرك الذي رفعته على Render (بدلاً من localhost إذا كان أونلاين بالكامل)
    // مثال: const socket = io('https://tank-game-server.onrender.com');
    const socket = io('http://localhost:3000'); 

    let selectedTeam = 'green';
    let playerName = 'قائد';
    let roomName = 'غرفة_الصقور';
    
    let scene, camera, renderer;
    let cameraRadius = 280, targetCameraRadius = 280;
    let cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };
    
    let remotePlayers = {}; // لتخزين دبابات اللاعبين الآخرين الأونلاين
    let myTank = null;
    let terrainMesh;
    let targetMarkerMesh;
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();
    let isDragging = false, hasMoved = false, previousTouchX = 0, previousTouchY = 0;
    let playerMoney = 500;

    function selectTeam(team) {
        selectedTeam = team;
        document.querySelectorAll('#player-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-player', btn.innerText.includes(team === 'green' ? 'الأخضر' : 'الأحمر'));
        });
    }

    function joinGameRoom() {
        playerName = document.getElementById('player-name-input').value || 'قائد';
        roomName = document.getElementById('room-name-input').value || 'غرفة_الصقور';
        
        socket.emit('join_room', { room: roomName, name: playerName, team: selectedTeam });
        
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('waiting-room').style.display = 'flex';
    }

    socket.on('update_room_players', (playersList) => {
        let box = document.getElementById('players-list-box');
        box.innerHTML = playersList.map(p => `<div>👤 ${p.name} (${p.team})</div>`).join('');
    });

    function startOnlineBattle() {
        document.getElementById('waiting-room').style.display = 'none';
        document.getElementById('ui-overlay').style.display = 'block';
        init3DScene();
    }

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text;
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2000);
    }

    function camMove(dir, state) { camInputs[dir] = state; }

    function init3DScene() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        let dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        scene.add(dirLight);

        // بناء أرضية بسيطة
        const geo = new THREE.PlaneGeometry(1100, 1100, 30, 30);
        geo.rotateX(-Math.PI / 2);
        terrainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x5c3d2e }));
        scene.add(terrainMesh);

        // إنشاء دبابتي الخاصة
        let startX = selectedTeam === 'green' ? 380 : -380;
        let startZ = selectedTeam === 'green' ? 380 : -380;
        myTank = createTankMesh(startX, startZ, selectedTeam === 'green' ? 0x2e3b23 : 0x6b3a2a);
        targetLookAt.set(startX, 0, startZ);

        setupInteraction();
        animate();

        // استقبال حركة اللاعبين الآخرين أونلاين
        socket.on('player_moved', (data) => {
            if (!remotePlayers[data.id]) {
                remotePlayers[data.id] = createTankMesh(data.x, data.z, 0x475569);
            }
            remotePlayers[data.id].position.set(data.x, data.y, data.z);
            remotePlayers[data.id].rotation.y = data.rotY;
        });
    }

    function createTankMesh(x, z, colorHex) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(6, 2.2, 9), new THREE.MeshStandardMaterial({ color: colorHex }));
        body.position.y = 1.2;
        group.add(body);
        
        const turret = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 1.5, 10), new THREE.MeshStandardMaterial({ color: colorHex }));
        turret.position.y = 2.8;
        group.add(turret);

        group.position.set(x, 0, z);
        scene.add(group);
        return group;
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
            isDragging = true; hasMoved = false;
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - previousTouchX;
            let deltaY = e.clientY - previousTouchY;
            if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) hasMoved = true;
            if (hasMoved) {
                cameraTheta -= deltaX * 0.008;
                cameraPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraPhi - deltaY * 0.008));
            }
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointerup', (e) => {
            isDragging = false;
            if (!hasMoved && myTank) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                let intersects = raycaster.intersectObject(terrainMesh);
                if (intersects.length > 0) {
                    myTank.targetPos = intersects[0].point;
                }
            }
        });
    }

    function updateCameraPosition() {
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function animate() {
        requestAnimationFrame(animate);

        // تحريك دبابتي وإرسال موقعها عبر Socket.io للسيرفر
        if (myTank && myTank.targetPos) {
            let dir = new THREE.Vector3().subVectors(myTank.targetPos, myTank.position);
            if (dir.length() > 1.5) {
                dir.y = 0; dir.normalize();
                myTank.rotation.y = Math.atan2(dir.x, dir.z);
                myTank.position.add(dir.multiplyScalar(0.35));
                
                // إرسال الحركة للسيرفر ليراها باقي اللاعبين
                socket.emit('player_move', {
                    x: myTank.position.x,
                    y: myTank.position.y,
                    z: myTank.position.z,
                    rotY: myTank.rotation.y
                });
            } else {
                myTank.targetPos = null;
            }
        }

        updateCameraPosition();
        renderer.render(scene, camera);
    }

    function spawnMyTank() {
        if (playerMoney >= 150) {
            playerMoney -= 150;
            document.getElementById('money-display').innerText = playerMoney;
            showFloatingMsg('تم تعزيز دبابة جديدة بنجاح!');
        }
    }
</script>
</body>
</html>
