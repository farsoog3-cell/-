<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة الدبابات الاستراتيجية</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: #fff;
        }

        /* حاوية القائمة الرئيسية */
        #menu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(15,15,20,0.95), rgba(30,30,45,0.95)), 
                        url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .menu-card {
            background: rgba(20, 20, 30, 0.85);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #ff4757;
            text-align: center;
            width: 350px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .menu-btn {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.3);
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.5);
        }

        .menu-btn.secondary {
            background: linear-gradient(45deg, #2f3542, #57606f);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .menu-btn.secondary:hover {
            background: linear-gradient(45deg, #57606f, #2f3542);
        }

        /* حقول الإدخال للغرف */
        .input-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            text-align: center;
        }

        /* إخفاء القائمة عند بدء اللعبة */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        #game-canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- القائمة الرئيسية الجديدة -->
    <div id="menu-container">
        <div class="menu-card">
            <h1>🎮 حرب الدبابات</h1>
            
            <div id="main-options">
                <button class="menu-btn" onclick="startBotGame()">🤖 اللعب مع البوت</button>
                <button class="menu-btn" onclick="showOnlineMenu()">🌐 اللعب أونلاين</button>
            </div>

            <div id="online-options" class="input-group">
                <button class="menu-btn" onclick="createRoom()">إنشاء غرفة جديدة</button>
                <input type="text" id="room-code-input" placeholder="أدخل كود الغرفة للانضمام">
                <button class="menu-btn secondary" onclick="joinRoom()">انضمام للغرفة</button>
                <button class="menu-btn secondary" onclick="backToMain()" style="background: #333;">رجوع</button>
            </div>
        </div>
    </div>

    <!-- مكان عرض كود اللعبة (Three.js Canvas) -->
    <canvas id="game-canvas"></canvas>

    <!-- تضمين مكتبة Socket.io وسكريبت اللعبة الخاص بك -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:3000'); // رابط السيرفر المحلي

        function showOnlineMenu() {
            document.getElementById('main-options').style.display = 'none';
            document.getElementById('online-options').style.display = 'flex';
        }

        function backToMain() {
            document.getElementById('main-options').style.display = 'block';
            document.getElementById('online-options').style.display = 'none';
        }

        function startBotGame() {
            console.log("بدء اللعبة ضد البوت...");
            document.getElementById('menu-container').classList.add('hidden');
            // هنا تضع دالة بدء اللعبة المحلية (Singleplayer) الخاصة بك
        }

        function createRoom() {
            console.log("جاري إنشاء الغرفة...");
            socket.emit('create_room'); // إرسال طلب للسيرفر لإنشاء غرفة
        }

        function joinRoom() {
            const roomCode = document.getElementById('room-code-input').value;
            if (roomCode.trim() !== "") {
                console.log("الانضمام للغرفة: " + roomCode);
                socket.emit('join_room', roomCode);
            } else {
                alert("الرجاء إدخال كود الغرفة بشكل صحيح!");
            }
        }

        // استقبال تأكيد إنشاء أو انضمام الغرفة من السيرفر
        socket.on('room_joined', (roomData) => {
            alert("تم الدخول للغرفة بنجاح!");
            document.getElementById('menu-container').classList.add('hidden');
            // بدء لعبة الأونلاين هنا
        });
    </script>
</body>
</html>
