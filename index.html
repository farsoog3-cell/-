<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة حرب المعسكرات والدبابات - أونلاين</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
        }
        /* تصميم الواجهات والقوائم */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 15, 15, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        .hidden { display: none !important; }
        input, select {
            padding: 10px;
            margin: 8px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: white;
            width: 250px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin: 10px;
            transition: 0.2s;
        }
        button:hover { background: #ff6b81; }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
        }
        #rooms-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            margin-bottom: 10px;
            width: 280px;
            background: #1a1a1a;
        }
        .room-item {
            padding: 5px;
            border-bottom: 1px solid #333;
            cursor: pointer;
        }
        .room-item:hover { background: #333; }
    </style>
    <!-- مكتبة Three.js للرسومات ثلاثية الأبعاد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة Socket.io للاتصال بالسيرفر -->
    <script src="https://tank-game-server-o650.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- 1. القائمة الرئيسية -->
    <div id="main-menu" class="menu-screen">
        <h1>حرب المعسكرات والدبابات</h1>
        <button onclick="showCreateRoom()">إنشاء غرفة جديدة</button>
        <button onclick="showJoinRoom()">انضمام إلى غرفة</button>
    </div>

    <!-- 2. قائمة إنشاء غرفة -->
    <div id="create-room-menu" class="menu-screen hidden">
        <h2>إعدادات الغرفة</h2>
        <input type="text" id="room-name-input" placeholder="اسم الغرفة">
        <label>اختر معسكرك:</label>
        <select id="camp-select">
            <option value="red">معسكر الأحمر (علم أحمر)</option>
            <option value="blue">معسكر الأزرق (علم أزرق)</option>
        </select>
        <input type="number" id="money-input" placeholder="المال الابتدائي للمعسكرات" value="1000">
        <button onclick="createRoom()">إنشاء ودخول اللوبي</button>
        <button onclick="backToMain()">رجوع</button>
    </div>

    <!-- 3. قائمة انضمام لغرفة -->
    <div id="join-room-menu" class="menu-screen hidden">
        <h2>الغرف المتاحة</h2>
        <div id="rooms-list">جاري البحث عن غرف...</div>
        <button onclick="backToMain()">رجوع</button>
    </div>

    <!-- 4. غرفة الانتظار (اللوبي) -->
    <div id="lobby-screen" class="menu-screen hidden">
        <h2 id="lobby-title">غرفة الانتظار</h2>
        <p id="lobby-status">في انتظار انضمام الصديق...</p>
        <div id="players-list"></div>
        <button id="ready-btn" onclick="toggleReady()">استعداد للعب</button>
        <button id="start-game-btn" class="hidden" onclick="startGameHost()">بدء الحرب الآن</button>
    </div>

    <!-- واجهة اللعب الداخلية (HUD) -->
    <div id="ui" class="hidden">
        <h3 id="camp-title">المعسكر: -</h3>
        <p>المال: <span id="coins">1000</span> عملة</p>
        <button onclick="buyTankInGame()">شراء دبابة للحرب (300 عملة)</button>
        <p style="font-size: 12px; margin-top: 10px;">التحكم: الأسهم (حركة الكاميرا) | مفاتيح +/- (الزوم)</p>
    </div>

    <script>
        const socket = io("https://tank-game-server-o650.onrender.com");

        let currentRoom = null;
        let isHost = false;
        let myCamp = 'red';
        let startingMoney = 1000;
        let isReady = false;

        // تبديل القوائم
        function showCreateRoom() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('create-room-menu').classList.remove('hidden');
        }

        function showJoinRoom() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('join-room-menu').classList.remove('hidden');
            socket.emit('get_rooms');
        }

        function backToMain() {
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('main-menu').classList.remove('hidden');
        }

        // إنشاء الغرفة
        function createRoom() {
            const roomName = document.getElementById('room-name-input').value || "غرفة جديدة";
            myCamp = document.getElementById('camp-select').value;
            startingMoney = parseInt(document.getElementById('money-input').value) || 1000;
            isHost = true;

            socket.emit('create_room', { roomName, camp: myCamp, money: startingMoney });
        }

        socket.on('room_created_success', (data) => {
            currentRoom = data.roomName;
            document.getElementById('create-room-menu').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = `الغرفة: ${currentRoom}`;
            document.getElementById('start-game-btn').classList.remove('hidden'); // المضيف يمكنه البدء
            updateLobbyUI([{ id: socket.id, camp: myCamp, ready: false, host: true }]);
        });

        // جلب الغرف للانضمام
        socket.on('rooms_list', (rooms) => {
            const listDiv = document.getElementById('rooms-list');
            listDiv.innerHTML = '';
            if(rooms.length === 0) {
                listDiv.innerHTML = '<p>لا توجد غرف متاحة حالياً.</p>';
                return;
            }
            rooms.forEach(room => {
                let div = document.createElement('div');
                div.className = 'room-item';
                div.innerText = `${room.name} (المعسكرات: ${room.playersCount}/2)`;
                div.onclick = () => joinRoom(room.name);
                listDiv.appendChild(div);
            });
        });

        function joinRoom(roomName) {
            myCamp = (myCamp === 'red') ? 'blue' : 'red'; // المعسكر المعاكس
            socket.emit('join_room', { roomName, camp: myCamp });
            currentRoom = roomName;
            document.getElementById('join-room-menu').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('lobby-title').innerText = `الغرفة: ${currentRoom}`;
        }

        socket.on('update_lobby', (data) => {
            updateLobbyUI(data.players);
        });

        function updateLobbyUI(players) {
            const playersDiv = document.getElementById('players-list');
            playersDiv.innerHTML = '<h4>اللاعبون في الغرفة:</h4>';
            players.forEach(p => {
                playersDiv.innerHTML += `<p>لاعب (${p.camp}) - الحالة: ${p.ready ? 'جاهز ✅' : 'غير جاهز ❌'}</p>`;
            });
            if(players.length === 2) {
                document.getElementById('lobby-status').innerText = "اكتمل عدد اللاعبين!";
            }
        }

        function toggleReady() {
            isReady = !isReady;
            document.getElementById('ready-btn').innerText = isReady ? "إلغاء الاستعداد" : "استعداد للعب";
            socket.emit('player_ready', { roomName: currentRoom, ready: isReady });
        }

        function startGameHost() {
            socket.emit('start_game', { roomName: currentRoom });
        }

        // بدء اللعبة والانتقال للبيئة الثلاثية الأبعاد
        socket.on('launch_game', (data) => {
            document.querySelectorAll('.menu-screen').forEach(el => el.classList.add('hidden'));
            document.getElementById('ui').classList.remove('hidden');
            document.getElementById('camp-title').innerText = `المعسكر: ${myCamp === 'red' ? 'الأحمر' : 'الأزرق'}`;
            document.getElementById('coins').innerText = data.money;
            initThreeJS();
        });

        // --- محرك الثلاثي الأبعاد (Three.js) والتحكم بالكاميرا ---
        let scene, camera, renderer;
        let coins = 1000;
        let flags = [];
        let tanks = {};

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // سماء جميلة
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.01);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // إضاءة
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // الأرض
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(400, 400),
                new THREE.MeshStandardMaterial({ color: 0x3b7a57 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // بناء المعسكرات والأعلام المرفرفة
            createCamp(-70, 0, 0xff0000, "الأحمر");
            createCamp(70, 0, 0x0000ff, "الأزرق");

            // موضع الكاميرا الابتدائي
            camera.position.set(0, 40, 80);
            camera.lookAt(0, 0, 0);

            // الاستماع لحركة الكاميرا بالأسهم والزوم
            window.addEventListener('keydown', handleCameraMovement);

            animate();
        }

        // التحكم بالكاميرا عبر الأسهم وزوم (+ / -)
        function handleCameraMovement(e) {
            const speed = 5;
            if (e.key === 'ArrowRight') camera.position.x += speed;
            if (e.key === 'ArrowLeft') camera.position.x -= speed;
            if (e.key === 'ArrowUp') camera.position.z -= speed;
            if (e.key === 'ArrowDown') camera.position.z += speed;
            if (e.key === '+' || e.key === '=') camera.position.y = Math.max(10, camera.position.y - 3); // زوم داخل
            if (e.key === '-' || e.key === '_') camera.position.y = Math.min(150, camera.position.y + 3); // زوم للخارج
            camera.lookAt(0, 0, 0);
        }

        function createCamp(x, z, color, name) {
            // قاعدة المعسكر
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(25, 1, 25),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            base.position.set(x, 0.5, z);
            scene.add(base);

            // سارية العلم
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 18),
                new THREE.MeshStandardMaterial({ color: 0xaaaaaa })
            );
            pole.position.set(x - 9, 9, z - 9);
            scene.add(pole);

            // العلم المرفرف
            const flag = new THREE.Mesh(
                new THREE.PlaneGeometry(6, 4, 10, 10),
                new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide })
            );
            flag.position.set(x - 6, 15, z - 9);
            scene.add(flag);
            flags.push({ mesh: flag, offset: Math.random() * 10 });
        }

        // شراء دبابة في اللعبة
        function buyTankInGame() {
            if(coins >= 300) {
                coins -= 300;
                document.getElementById('coins').innerText = coins;
                socket.emit('buy_tank_action', { roomName: currentRoom, camp: myCamp });
            } else {
                alert("المال غير كافي لشراء دبابة!");
            }
        }

        socket.on('tank_spawned', (data) => {
            // إنشاء دبابة في ساحة المعركة ورؤيتها بين الأصدقاء
            const tankColor = data.camp === 'red' ? 0xff0000 : 0x0000ff;
            const tankBody = new THREE.Mesh(
                new THREE.BoxGeometry(6, 3, 10),
                new THREE.MeshStandardMaterial({ color: tankColor })
            );
            let startX = data.camp === 'red' ? -50 : 50;
            tankBody.position.set(startX + (Math.random() * 10 - 5), 1.5, Math.random() * 20 - 10);
            scene.add(tankBody);
            tanks[data.id] = tankBody;
        });

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // حركة رفرفة الأعلام
            flags.forEach(f => {
                let posAttr = f.mesh.geometry.attributes.position;
                for(let i=0; i<posAttr.count; i++) {
                    let vx = posAttr.getX(i);
                    if(vx > 0) {
                        posAttr.setZ(i, Math.sin(time * 10 + i + f.offset) * 0.4);
                    }
                }
                posAttr.needsUpdate = true;
            });

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
