<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة الدبابات المحسنة - Tank Game 3D</title>
    <!-- مكتبات Three.js و Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            user-select: none; -webkit-user-select: none; 
            touch-action: none; font-family: system-ui, -apple-system, sans-serif; 
        }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #canvas-container canvas { width: 100% !important; height: 100% !important; display: block; }

        #start-menu { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; background: rgba(15, 23, 42, 0.95); 
            display: flex; align-items: center; justify-content: center; color: #fff; 
        }
        .menu-card { 
            background: #1e293b; border: 1px solid #38bdf8; 
            border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; text-align: center; 
        }
        .menu-card h1 { font-size: 20px; color: #38bdf8; margin-bottom: 10px; }
        .main-buttons-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .main-menu-btn { padding: 12px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #0284c7; }
        .btn-secondary { background: #475569; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 12px; padding: 16px; width: 90%; max-width: 380px; color: #fff; text-align: right; }
        .modal-card h2 { text-align: center; color: #38bdf8; font-size: 16px; margin-bottom: 10px; }
        .input-label { font-size: 11px; color: #94a3b8; margin: 8px 0 4px; display: block; }

        #create-room-name { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; text-align: center; outline: none; }
        .options-grid { display: flex; gap: 6px; margin-bottom: 8px; }
        .opt-btn { flex: 1; padding: 6px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 11px; cursor: pointer; }
        .opt-btn.active { border-color: #38bdf8; background: #0284c7; }

        #rooms-list-container { max-height: 180px; overflow-y: auto; margin: 8px 0; }
        .room-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px; margin-bottom: 6px; border-radius: 6px; font-size: 12px; }
        .room-badge-playing { background: #ef4444; color: white; padding: 4px 6px; border-radius: 4px; font-size: 10px; }
        .room-badge-ready { background: #22c55e; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; border: none; cursor: pointer; }

        .lobby-info { text-align: center; font-size: 11px; color: #fbbf24; margin-bottom: 6px; }
        .players-status-box { background: #0f172a; padding: 8px; border-radius: 6px; margin: 8px 0; }
        .player-slot { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; }

        .modal-actions { display: flex; gap: 6px; margin-top: 12px; }
        .btn-action { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-confirm { background: #22c55e; color: #fff; }
        .btn-cancel { background: #64748b; color: #fff; }
        .btn-ready { background: #eab308; color: #000; }
        .btn-start { background: #22c55e; color: #fff; }
        .btn-start:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        #ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: none; }
        .top-capture-box { 
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%); 
            width: 180px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; 
            border-radius: 6px; padding: 4px 8px; text-align: center; color: white; font-size: 10px; 
            pointer-events: auto;
        }

        .left-controls-group { position: absolute; top: 45px; left: 8px; pointer-events: auto; display: flex; flex-direction: column; gap: 6px; width: 120px; }
        .selection-controls { display: flex; gap: 4px; }
        .sel-btn { flex: 1; background: rgba(30, 41, 59, 0.85); border: 1px solid #38bdf8; color: white; padding: 5px 2px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .sel-btn.active { background: #0284c7; }

        .corner-economy { background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
        .money-row { display: flex; justify-content: space-between; font-size: 11px; color: #fff; }
        .money-small { color: #fbbf24; font-weight: bold; }
        .buy-btn-small { background: #22c55e; border: none; color: white; padding: 5px; border-radius: 4px; font-weight: bold; font-size: 9px; cursor: pointer; }
        .buy-btn-rocket { background: #ea580c; }

        /* لوحة تحكم الكاميرا الجديدة (أسهم + زوم) */
        .camera-control-panel {
            position: absolute; bottom: 15px; right: 15px; pointer-events: auto;
            background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8; border-radius: 12px;
            padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .cam-row { display: flex; gap: 6px; }
        .cam-btn {
            width: 36px; height: 36px; background: #1e293b; border: 1px solid #38bdf8;
            color: #38bdf8; font-size: 14px; font-weight: bold; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .cam-btn:active { background: #0284c7; color: #fff; }
        .zoom-row { display: flex; gap: 6px; margin-top: 2px; width: 100%; }
        .zoom-btn { flex: 1; padding: 4px; background: #0f172a; border: 1px solid #f59e0b; color: #f59e0b; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 12px; text-align: center; }

        #minimap-container { position: absolute; bottom: 10px; left: 10px; width: 85px; height: 85px; background: rgba(15, 23, 42, 0.85); border: 2px solid #38bdf8; border-radius: 50%; overflow: hidden; pointer-events: auto; }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg { 
            position: absolute; top: 45px; left: 50%; transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.85); color: #38bdf8; padding: 4px 10px; 
            border-radius: 4px; font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 50; 
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="floating-msg"></div>

    <div id="start-menu">
        <div class="menu-card" id="main-menu-card">
            <h1>معركة الدبابات ⚔️</h1>
            <div class="main-buttons-group">
                <button class="main-menu-btn btn-primary" onclick="openModal('create-modal')">🎮 إنشاء غرفة (أونلاين)</button>
                <button class="main-menu-btn btn-secondary" onclick="openModal('rooms-modal'); fetchRoomsList();">🌐 الغرف المتاحة</button>
            </div>
        </div>

        <div class="modal-overlay" id="create-modal">
            <div class="modal-card">
                <h2>إنشاء غرفة جديدة</h2>
                <label class="input-label">اسم الغرفة:</label>
                <input type="text" id="create-room-name" placeholder="أدخل اسم الغرفة..." autocomplete="off">

                <label class="input-label">مال الحرب الابتدائي:</label>
                <div class="options-grid">
                    <button class="opt-btn money-opt active" data-money="200">200 $</button>
                    <button class="opt-btn money-opt" data-money="500">500 $</button>
                    <button class="opt-btn money-opt" data-money="600">600 $</button>
                </div>

                <label class="input-label">اختر دولتك والعلم:</label>
                <div class="options-grid">
                    <button class="opt-btn flag-opt active" data-flag="green">🟢 سوريا (3 نجوم)</button>
                    <button class="opt-btn flag-opt" data-flag="red">🔴 سوريا (نجمتان)</button>
                </div>

                <div class="modal-actions">
                    <button class="btn-action btn-confirm" onclick="submitCreateRoom()">إنشاء الغرفة 🚀</button>
                    <button class="btn-action btn-cancel" onclick="closeModal('create-modal')">إلغاء</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="rooms-modal">
            <div class="modal-card">
                <h2>الغرف المتاحة 🌐</h2>
                <div id="rooms-list-container"></div>
                <div class="modal-actions">
                    <button class="btn-action btn-cancel" onclick="closeModal('rooms-modal')">إغلاق</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="lobby-modal">
            <div class="modal-card">
                <h2 id="lobby-room-title">غرفة الانتظار</h2>
                <p id="lobby-room-info" class="lobby-info">المال الابتدائي: 500 $</p>

                <div class="players-status-box">
                    <div class="player-slot" id="slot-host">
                        <span class="p-name">👑 المضيف (جاري الانتظار...)</span>
                        <span class="p-status">غير مستعد ❌</span>
                    </div>
                    <div class="player-slot" id="slot-guest">
                        <span class="p-name">⚔️ الصديق (جاري الانتظار...)</span>
                        <span class="p-status">غير مستعد ❌</span>
                    </div>
                </div>

                <label class="input-label">اختر دولتك:</label>
                <div class="options-grid">
                    <button class="opt-btn my-flag-btn active" data-flag="green" onclick="selectMyFlag('green')">🟢 سوريا (3 نجوم)</button>
                    <button class="opt-btn my-flag-btn" data-flag="red" onclick="selectMyFlag('red')">🔴 سوريا (نجمتان)</button>
                </div>

                <div class="modal-actions">
                    <button id="ready-toggle-btn" class="btn-action btn-ready" onclick="toggleReady()">أنا مستعد ✋</button>
                    <button id="start-game-btn" class="btn-action btn-start" disabled onclick="requestStartGame()">بدء المعركة ⚔️</button>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-overlay">
        <div class="top-capture-box">
            <div id="capture-status-text">منطقة الاستحواذ: معسكر نشط</div>
        </div>

        <div class="left-controls-group">
            <div class="selection-controls">
                <button class="sel-btn active" id="btn-select-all" onclick="setSelectMode('all')">الكل</button>
                <button class="sel-btn" id="btn-select-single" onclick="setSelectMode('single')">فردي</button>
            </div>

            <div class="corner-economy">
                <div class="money-row">
                    <span>المال:</span>
                    <span id="player-money-display" class="money-small">500 $</span>
                </div>
                <button class="buy-btn-small" onclick="buyTank('normal')">شراء دبابة (100$)</button>
                <button class="buy-btn-small buy-btn-rocket" onclick="buyTank('rocket')">شراء صاروخية (200$)</button>
            </div>
        </div>

        <div id="minimap-container"><canvas id="minimap-canvas"></canvas></div>

        <!-- لوحة تحكم الكاميرا المتكاملة (أسهم يمين/يسار/أعلى/أسفل + زوم + تدوير باللمس) -->
        <div class="camera-control-panel">
            <div class="cam-row">
                <button class="cam-btn" ontouchstart="startCamMove(0, -1)" onmousedown="startCamMove(0, -1)" onmouseup="stopCamMove()" ontouchend="stopCamMove()">⬆️</button>
            </div>
            <div class="cam-row">
                <button class="cam-btn" ontouchstart="startCamMove(-1, 0)" onmousedown="startCamMove(-1, 0)" onmouseup="stopCamMove()" ontouchend="stopCamMove()">⬅️</button>
                <button class="cam-btn" ontouchstart="startCamMove(0, 1)" onmousedown="startCamMove(0, 1)" onmouseup="stopCamMove()" ontouchend="stopCamMove()">⬇️</button>
                <button class="cam-btn" ontouchstart="startCamMove(1, 0)" onmousedown="startCamMove(1, 0)" onmouseup="stopCamMove()" ontouchend="stopCamMove()">➡️</button>
            </div>
            <div class="zoom-row">
                <button class="zoom-btn" onclick="zoomCamera(-5)">زوم +</button>
                <button class="zoom-btn" onclick="zoomCamera(5)">زوم -</button>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = 'https://tank-game-server-o650.onrender.com/';
        const socket = io(SERVER_URL);

        let currentRoom = null;
        let myPlayerId = null;
        let myFlag = 'green';
        let isHost = false;
        let isReady = false;

        function openModal(id) {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showFloatingMsg(msg) {
            const el = document.getElementById('floating-msg');
            el.innerText = msg; el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.money-opt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.money-opt').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });
            document.querySelectorAll('.flag-opt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.flag-opt').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    myFlag = e.target.dataset.flag;
                });
            });
        });

        function submitCreateRoom() {
            const roomName = document.getElementById('create-room-name').value.trim();
            if (!roomName) return showFloatingMsg("الرجاء إدخال اسم الغرفة!");
            const initialMoney = parseInt(document.querySelector('.money-opt.active').dataset.money);
            socket.emit('createRoom', { roomName, initialMoney, flag: myFlag });
        }

        function fetchRoomsList() { socket.emit('getRoomsList'); }
        function joinRoom(id) { socket.emit('joinRoom', { roomId: id }); }

        function selectMyFlag(flag) {
            myFlag = flag;
            document.querySelectorAll('.my-flag-btn').forEach(b => b.classList.toggle('active', b.dataset.flag === flag));
            if (currentRoom) socket.emit('updatePlayerFlag', { roomId: currentRoom.id, flag });
        }

        function toggleReady() {
            isReady = !isReady;
            const btn = document.getElementById('ready-toggle-btn');
            btn.innerText = isReady ? "مستعد ✅" : "أنا مستعد ✋";
            btn.style.background = isReady ? "#22c55e" : "#eab308";
            if (currentRoom) socket.emit('playerReadyState', { roomId: currentRoom.id, ready: isReady });
        }

        function requestStartGame() {
            if (currentRoom && isHost) socket.emit('startGameRequest', { roomId: currentRoom.id });
        }

        socket.on('connect', () => { myPlayerId = socket.id; });
        socket.on('updateRoomsList', (rooms) => {
            const container = document.getElementById('rooms-list-container');
            container.innerHTML = '';
            if (!rooms || Object.keys(rooms).length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:12px;">لا توجد غرف متاحة</p>';
                return;
            }
            for (let id in rooms) {
                let r = rooms[id];
                let item = document.createElement('div');
                item.className = 'room-item';
                let badge = r.isPlaying ? '<span class="room-badge-playing">جاري اللعب 🔴</span>' :
                            (r.playersCount >= 2 ? '<span class="room-badge-playing">مكتملة 🔒</span>' :
                            `<button class="room-badge-ready" onclick="joinRoom('${id}')">انضمام ⚔️</button>`);
                item.innerHTML = `<div><strong>${r.name}</strong> (${r.initialMoney}$)</div>${badge}`;
                container.appendChild(item);
            }
        });

        socket.on('roomJoined', (data) => {
            currentRoom = data; isHost = (data.hostId === myPlayerId);
            closeModal('create-modal'); closeModal('rooms-modal'); openModal('lobby-modal');
            updateLobbyUI(data);
        });

        socket.on('lobbyUpdated', (data) => { currentRoom = data; updateLobbyUI(data); });

        function updateLobbyUI(room) {
            document.getElementById('lobby-room-title').innerText = `غرفة: ${room.name}`;
            document.getElementById('lobby-room-info').innerText = `مال الحرب: ${room.initialMoney} $`;
            if (room.host) {
                document.getElementById('slot-host').innerHTML = `<span class="p-name">👑 المضيف (${room.host.flag === 'green' ? '🟢 سوريا 3 نجوم' : '🔴 سوريا نجمتان'})</span><span class="p-status" style="color:${room.host.ready ? '#22c55e' : '#ef4444'}">${room.host.ready ? 'مستعد ✅' : 'غير مستعد ❌'}</span>`;
            }
            if (room.guest) {
                document.getElementById('slot-guest').innerHTML = `<span class="p-name">⚔️ الصديق (${room.guest.flag === 'green' ? '🟢 سوريا 3 نجوم' : '🔴 سوريا نجمتان'})</span><span class="p-status" style="color:${room.guest.ready ? '#22c55e' : '#ef4444'}">${room.guest.ready ? 'مستعد ✅' : 'غير مستعد ❌'}</span>`;
            } else {
                document.getElementById('slot-guest').innerHTML = `<span class="p-name" style="color:#64748b">بانتظار انضمام الصديق...</span>`;
            }
            const startBtn = document.getElementById('start-game-btn');
            if (isHost) {
                startBtn.style.display = 'block';
                startBtn.disabled = !(room.host && room.guest && room.host.ready && room.guest.ready);
            } else { startBtn.style.display = 'none'; }
        }

        socket.on('gameStarted', (state) => {
            closeModal('lobby-modal');
            document.getElementById('start-menu').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            showFloatingMsg("بدأت المعركة الصحراوية الكبرى! 🚀");
            startGameEngine(state);
        });

        socket.on('errorMessage', (msg) => showFloatingMsg(msg));

        /* --- محرك 3D متطور: معسكرات ثلاثية الأبعاد، دبابات محسنة، علم ثلاثي الأبعاد مرفرف، وتحكم كامل بالكاميرا (أسهم + زوم + لمس) --- */
        let scene, camera, renderer, playerMoney = 500, myTanks = [], enemyTanks = [];
        let isDragging = false, previousTouchPosition = { x: 0, y: 0 };
        let flagMeshes = [], selectedTank = null, raycaster, mouse;
        let groundMesh, activeProjectiles = [];
        let camMoveDir = { x: 0, z: 0 }, camMoveInterval = null;

        function startGameEngine(state) {
            playerMoney = state.initialMoney;
            document.getElementById('player-money-display').innerText = `${playerMoney} $`;

            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x4aa3df);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const hostFlag = (state.host && state.host.flag) ? state.host.flag : 'green';
            const guestFlag = (state.guest && state.guest.flag) ? state.guest.flag : 'red';
            const myPos = (myFlag === hostFlag) ? { x: -35, z: -35 } : { x: 35, z: 35 };

            // توجيه الكاميرا فوراً فوق معسكر اللاعب المختار وبشكل ثلاثي الأبعاد جميل
            camera.position.set(myPos.x, 25, myPos.z + 20);
            camera.lookAt(myPos.x, 0, myPos.z);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            setupTouchCameraControls(renderer.domElement);
            setupTankMovementControls(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const sun = new THREE.DirectionalLight(0xffffff, 1.3);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // أرض صحراوية مسطحة عالية الجودة
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0xd8c29d });
            groundMesh = new THREE.Mesh(floorGeo, floorMat);
            groundMesh.rotation.x = -Math.PI / 2;
            scene.add(groundMesh);

            createAdvancedMilitaryBase(-35, -35, hostFlag);
            createAdvancedMilitaryBase(35, 35, guestFlag);

            const enPos = (myFlag === hostFlag) ? { x: 35, z: 35 } : { x: -35, z: -35 };

            spawnTank(myPos.x + 5, myPos.z + 5, myFlag, true);
            spawnTank(enPos.x - 5, enPos.z - 5, (myFlag === hostFlag ? guestFlag : hostFlag), false);

            let clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                let delta = clock.getDelta();
                let time = clock.getElapsedTime();

                // تحديث حركة الكاميرا عند النقر المستمر على الأسهم
                if (camMoveDir.x !== 0 || camMoveDir.z !== 0) {
                    camera.position.x += camMoveDir.x * 0.8;
                    camera.position.z += camMoveDir.z * 0.8;
                }

                // تحديث رفرفة الأعلام الواقعية ثلاثية الأبعاد
                flagMeshes.forEach(f => {
                    const posAttr = f.geometry.attributes.position;
                    for (let i = 0; i < posAttr.count; i++) {
                        let u = posAttr.getX(i);
                        if (u > 0) {
                            let wave = Math.sin(time * 10 + u * 3) * 0.2;
                            posAttr.setZ(i, wave);
                        }
                    }
                    posAttr.needsUpdate = true;
                });

                // تحديث حركة الدبابات نحو الوجهة
                [...myTanks, ...enemyTanks].forEach(tank => {
                    if (tank.userData.targetPos) {
                        let dir = new THREE.Vector3().subVectors(tank.userData.targetPos, tank.position);
                        let dist = dir.length();
                        if (dist > 0.5) {
                            dir.normalize();
                            tank.position.addScaledVector(dir, tank.userData.speed * delta);
                            tank.lookAt(tank.userData.targetPos.x, tank.position.y, tank.userData.targetPos.z);
                            if (Math.random() < 0.3) createTrackMark(tank.position);
                        } else {
                            tank.userData.targetPos = null;
                        }
                    }
                    findAndAttackTarget(tank);
                });

                // تحديث القذائف
                for (let i = activeProjectiles.length - 1; i >= 0; i--) {
                    let p = activeProjectiles[i];
                    p.mesh.position.addScaledVector(p.dir, p.speed * delta);
                    p.life -= delta;

                    let targets = p.isMineTank ? enemyTanks : myTanks;
                    let hit = false;
                    for (let t of targets) {
                        if (p.mesh.position.distanceTo(t.position) < 2.5) {
                            hit = true;
                            t.userData.health -= p.damage;
                            updateTankHealthBar(t);
                            createExplosionEffect(t.position);

                            if (t.userData.health <= 0) {
                                scene.remove(t);
                                if (p.isMineTank) {
                                    enemyTanks = enemyTanks.filter(item => item !== t);
                                } else {
                                    myTanks = myTanks.filter(item => item !== t);
                                }
                            }
                            break;
                        }
                    }

                    if (hit || p.life <= 0) {
                        scene.remove(p.mesh);
                        activeProjectiles.splice(i, 1);
                    }
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        /* --- وظائف تحكم الكاميرا (أسهم، زوم، لمس يمين ويسار) --- */
        function startCamMove(x, z) {
            camMoveDir = { x, z };
        }
        function stopCamMove() {
            camMoveDir = { x: 0, z: 0 };
        }
        function zoomCamera(amount) {
            camera.position.y = Math.max(10, Math.min(70, camera.position.y + amount));
        }

        function setupTouchCameraControls(domElement) {
            domElement.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            });

            domElement.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const deltaX = currentX - previousTouchPosition.x;
                const deltaY = currentY - previousTouchPosition.y;

                camera.position.x -= deltaX * 0.06;
                camera.position.z -= deltaY * 0.06;

                previousTouchPosition = { x: currentX, y: currentY };
            });

            domElement.addEventListener('touchend', () => { isDragging = false; });

            domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousTouchPosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousTouchPosition.x;
                const deltaY = e.clientY - previousTouchPosition.y;

                camera.position.x -= deltaX * 0.06;
                camera.position.z -= deltaY * 0.06;

                previousTouchPosition = { x: e.clientX, y: e.clientY };
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
        }

        function setupTankMovementControls(domElement) {
            domElement.addEventListener('click', (event) => {
                // منع التداخل مع أزرار التحكم
                if (event.target.tagName === 'BUTTON' || event.target.closest('.camera-control-panel') || event.target.closest('.left-controls-group')) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);

                let intersectsTanks = raycaster.intersectObjects(myTanks, true);
                if (intersectsTanks.length > 0) {
                    let rootTank = intersectsTanks[0].object.parent;
                    if (myTanks.includes(rootTank)) {
                        selectedTank = rootTank;
                        showFloatingMsg("تم تحديد الدبابة! انقر على الأرض لتحريكها 🎯");
                        return;
                    }
                }

                if (selectedTank) {
                    let intersectsGround = raycaster.intersectObject(groundMesh);
                    if (intersectsGround.length > 0) {
                        let targetPoint = intersectsGround[0].point;
                        selectedTank.userData.targetPos = targetPoint;
                        showFloatingMsg("الدبابة تتحرك نحو الموقع المطلوبة 🚀");
                        selectedTank = null;
                    }
                }
            });
        }

        function createTrackMark(pos) {
            const trackGeo = new THREE.PlaneGeometry(0.6, 0.9);
            const trackMat = new THREE.MeshBasicMaterial({ color: 0x3d2817, transparent: true, opacity: 0.6 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.set(pos.x, 0.03, pos.z);
            scene.add(track);
            setTimeout(() => scene.remove(track), 4000);
        }

        /* --- تصميم معسكر ثلاثي الأبعاد احترافي ومتطور --- */
        function createAdvancedMilitaryBase(x, z, flagType) {
            const group = new THREE.Group();

            // المبنى الرئيسي العسكري
            const mainBuildingGeo = new THREE.BoxGeometry(10, 4, 6);
            const mainBuildingMat = new THREE.MeshLambertMaterial({ color: 0xc2b280 });
            const mainBuilding = new THREE.Mesh(mainBuildingGeo, mainBuildingMat);
            mainBuilding.position.set(0, 2, 0);
            group.add(mainBuilding);

            // أبراج المراقبة المحيطة
            const towerGeo = new THREE.CylinderGeometry(1.5, 2, 6, 16);
            const towerMat = new THREE.MeshLambertMaterial({ color: 0x8c7853 });
            
            const t1 = new THREE.Mesh(towerGeo, towerMat);
            t1.position.set(-7, 3, -4);
            group.add(t1);

            const t2 = new THREE.Mesh(towerGeo, towerMat);
            t2.position.set(7, 3, -4);
            group.add(t2);

            // أسوار الدفاع
            const wallGeo = new THREE.BoxGeometry(18, 1.5, 1);
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x6e6552 });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.set(0, 0.75, 5);
            group.add(wall);

            // عامود العلم المربوط به العلم بشكل صحيح وصحي
            const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 9);
            const poleMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(-7, 8.5, -4);
            group.add(pole);

            // علم ثلاثي الأبعاد مرفرف حقيقي
            const flagGeo = new THREE.PlaneGeometry(3.5, 2.2, 12, 6);
            const flagTex = createFlagTexture(flagType);
            const flagMat = new THREE.MeshBasicMaterial({ map: flagTex, side: THREE.DoubleSide });
            const flagMesh = new THREE.Mesh(flagGeo, flagMat);
            flagMesh.position.set(-5.15, 9.2, -4);
            group.add(flagMesh);
            flagMeshes.push(flagMesh);

            group.position.set(x, 0, z);
            scene.add(group);
        }

        function createFlagTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 341;
            const ctx = canvas.getContext('2d');
            const h = canvas.height / 3;

            if (type === 'green') {
                ctx.fillStyle = '#007a3d'; ctx.fillRect(0, 0, canvas.width, h);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, h, canvas.width, h);
                ctx.fillStyle = '#000000'; ctx.fillRect(0, h * 2, canvas.width, h);
                ctx.fillStyle = '#da291c';
                drawStar(ctx, 150, h + h/2, 5, 22, 10);
                drawStar(ctx, 256, h + h/2, 5, 22, 10);
                drawStar(ctx, 362, h + h/2, 5, 22, 10);
            } else {
                ctx.fillStyle = '#da291c'; ctx.fillRect(0, 0, canvas.width, h);
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, h, canvas.width, h);
                ctx.fillStyle = '#000000'; ctx.fillRect(0, h * 2, canvas.width, h);
                ctx.fillStyle = '#007a3d';
                drawStar(ctx, 180, h + h/2, 5, 24, 11);
                drawStar(ctx, 332, h + h/2, 5, 24, 11);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function drawStar(ctx, cx, cy, spikes, outer, inner) {
            let rot = Math.PI / 2 * 3, x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outer);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outer; y = cy + Math.sin(rot) * outer; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot) * inner; y = cy + Math.sin(rot) * inner; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outer); ctx.closePath(); ctx.fill();
        }

        /* --- تصميم دبابات ثلاثية الأبعاد متطورة مع خط الدمج والنار والدخان --- */
        function spawnTank(x, z, color, isMine) {
            const group = new THREE.Group();
            group.userData = { health: 100, maxHealth: 100, speed: 9, targetPos: null, isMine: isMine, lastShot: 0 };

            // جنزير الدبابة السفلي
            const treadsMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const leftTread = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 3.4), treadsMat);
            leftTread.position.set(-1.1, 0.3, 0);
            group.add(leftTread);

            const rightTread = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 3.4), treadsMat);
            rightTread.position.set(1.1, 0.3, 0);
            group.add(rightTread);

            // هيكل الدبابة الأساسي
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.0, 1.1, 3.2), 
                new THREE.MeshLambertMaterial({ color: color === 'green' ? 0x2e5e1e : 0xa61c1c })
            );
            body.position.y = 0.7; 
            group.add(body);

            // برج الدبابة الدوّار
            const turret = new THREE.Mesh(
                new THREE.CylinderGeometry(1.0, 1.1, 0.8, 16), 
                new THREE.MeshLambertMaterial({ color: 0x3d3d3d })
            );
            turret.position.set(0, 1.55, 0); 
            group.add(turret);

            // ماسورة المدفع
            const cannon = new THREE.Mesh(
                new THREE.CylinderGeometry(0.18, 0.18, 2.5, 8), 
                new THREE.MeshLambertMaterial({ color: 0x111111 })
            );
            cannon.rotation.x = Math.PI / 2; 
            cannon.position.set(0, 1.55, 1.3); 
            group.add(cannon);

            // خط الدمج (Health Bar) الخاص بكل دبابة فوقها
            const healthBarGeo = new THREE.PlaneGeometry(2.2, 0.32);
            const healthBarMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide });
            const healthBar = new THREE.Mesh(healthBarGeo, healthBarMat);
            healthBar.position.set(0, 2.8, 0);
            healthBar.name = "healthBar";
            group.add(healthBar);

            group.position.set(x, 0, z);
            scene.add(group);
            if (isMine) myTanks.push(group); else enemyTanks.push(group);
        }

        function updateTankHealthBar(tank) {
            let bar = tank.getObjectByName("healthBar");
            if (bar) {
                let p = tank.userData.health / tank.userData.maxHealth;
                bar.scale.x = Math.max(0.01, p);
                bar.material.color.setHex(p > 0.5 ? 0x22c55e : (p > 0.2 ? 0xeab308 : 0xef4444));
            }
        }

        function findAndAttackTarget(tank) {
            let enemies = tank.userData.isMine ? enemyTanks : myTanks;
            let now = Date.now();
            if (now - tank.userData.lastShot < 1800) return;

            for (let en of enemies) {
                let dist = tank.position.distanceTo(en.position);
                if (dist < 28) {
                    tank.userData.lastShot = now;
                    fireProjectile(tank, en);
                    break;
                }
            }
        }

        function fireProjectile(shooter, target) {
            let pGeo = new THREE.SphereGeometry(0.35, 8, 8);
            let pMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            let pMesh = new THREE.Mesh(pGeo, pMat);
            
            pMesh.position.copy(shooter.position);
            pMesh.position.y += 1.55;
            scene.add(pMesh);

            let dir = new THREE.Vector3().subVectors(target.position, shooter.position).normalize();
            activeProjectiles.push({
                mesh: pMesh,
                dir: dir,
                speed: 35,
                life: 2.0,
                isMineTank: shooter.userData.isMine,
                damage: 25
            });
        }

        function createExplosionEffect(pos) {
            // تأثير انفجار ونار ودخان بصري مميز
            let fxGeo = new THREE.SphereGeometry(1.8, 8, 8);
            let fxMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.9 });
            let fx = new THREE.Mesh(fxGeo, fxMat);
            fx.position.copy(pos);
            scene.add(fx);
            setTimeout(() => scene.remove(fx), 500);
        }

        function buyTank(type) {
            const cost = type === 'normal' ? 100 : 200;
            if (playerMoney >= cost) {
                playerMoney -= cost;
                document.getElementById('player-money-display').innerText = `${playerMoney} $`;
                const pos = (myFlag === 'green') ? { x: -35, z: -35 } : { x: 35, z: 35 };
                spawnTank(pos.x + (Math.random() * 6 - 3), pos.z + (Math.random() * 6 - 3), myFlag, true);
                showFloatingMsg("تم تعزيز معسكرك بدبابة قتالية جديدة 🛡️");
            } else { 
                showFloatingMsg("المال غير كافٍ لشراء دبابة!"); 
            }
        }

        function setSelectMode(mode) {
            document.getElementById('btn-select-all').classList.toggle('active', mode === 'all');
            document.getElementById('btn-select-single').classList.toggle('active', mode === 'single');
        }
    </script>
