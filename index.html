<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معركة السيطرة الاستراتيجية الأونلاين</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #start-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
        }

        .menu-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid #38bdf8;
            border-radius: 12px; padding: 20px; width: 90%; max-width: 380px; text-align: center;
        }

        .menu-card h1 { font-size: 18px; margin-bottom: 12px; color: #38bdf8; }
        .section-title { font-size: 12px; color: #94a3b8; margin: 8px 0 4px 0; text-align: right; }
        .flag-options { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }

        .flag-btn {
            flex: 1; padding: 8px; border: 1px solid #475569; border-radius: 6px;
            background: #1e293b; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer;
        }

        .flag-btn.active-player { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }

        #start-btn {
            width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 6px;
            background: #0284c7; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer;
        }

        #waiting-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
            background: rgba(15, 23, 42, 0.9); display: none; flex-direction: column;
            align-items: center; justify-content: center; color: #fff; text-align: center;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid #38bdf8;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }

        .tank-hp-label {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0, 0, 0, 0.75); padding: 1px 4px; border-radius: 3px;
            font-size: 9px; font-weight: bold; pointer-events: none; white-space: nowrap;
            border: 1px solid #334155; transition: transform 0.1s linear;
        }
        .hp-player { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
        .hp-enemy { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

        .top-capture-box {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 230px; background: rgba(15, 23, 42, 0.85); border: 1px solid #38bdf8;
            border-radius: 6px; padding: 6px 10px; text-align: center; color: white; font-size: 11px;
        }
        .capture-bar-bg { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .capture-bar-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.3s; }

        .left-controls-group {
            position: absolute; top: 8px; left: 8px; pointer-events: auto;
            display: flex; flex-direction: column; gap: 6px; width: 130px;
        }

        .selection-controls { display: flex; gap: 4px; width: 100%; }
        .sel-btn {
            flex: 1; background: rgba(30, 41, 59, 0.85); border: 1px solid #38bdf8; color: white;
            padding: 5px 4px; border-radius: 5px; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer;
        }
        .sel-btn.active { background: #0284c7; }

        .corner-economy {
            background: rgba(15, 23, 42, 0.85); border: 1px solid #f59e0b;
            border-radius: 6px; padding: 6px; display: flex; flex-direction: column; gap: 5px; width: 100%;
        }
        .money-row { display: flex; justify-content: space-between; align-items: center; }
        .money-small { color: #fbbf24; font-weight: bold; font-size: 11px; }
        
        .buy-btn-small {
            background: #22c55e; border: none; color: white; padding: 5px;
            border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; text-align: center; cursor: pointer;
        }
        .buy-btn-small:disabled { background: #64748b; }
        .buy-btn-rocket { background: #ea580c; }
        .buy-btn-rocket:disabled { background: #64748b; }

        #minimap-container {
            position: absolute; bottom: 65px; left: 8px; width: 110px; height: 110px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: auto; cursor: pointer; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        #minimap-canvas { width: 100%; height: 100%; }

        #floating-msg {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); color: #38bdf8; padding: 4px 10px;
            border-radius: 4px; font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.4s;
        }

        .cam-controls {
            position: absolute; bottom: 8px; right: 8px;
            display: grid; grid-template-columns: repeat(3, 42px); gap: 4px;
            pointer-events: auto;
        }
        .cam-btn {
            width: 42px; height: 42px; background: rgba(30, 41, 59, 0.85);
            border: 1px solid #38bdf8; border-radius: 6px; color: white;
            font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cam-btn:active { background: #0284c7; }
        .cam-btn.up { grid-column: 2; grid-row: 1; }
        .cam-btn.left { grid-column: 1; grid-row: 2; }
        .cam-btn.down { grid-column: 2; grid-row: 2; }
        .cam-btn.right { grid-column: 3; grid-row: 2; }
        .cam-btn.zoom-in { grid-column: 1; grid-row: 1; font-size: 11px; }
        .cam-btn.zoom-out { grid-column: 3; grid-row: 1; font-size: 11px; }

        .cam-hint {
            position: absolute; bottom: 8px; left: 125px;
            background: rgba(15, 23, 42, 0.75); border: 1px solid #38bdf8;
            color: #93c5fd; padding: 3px 6px; border-radius: 4px; font-size: 9px; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="start-menu">
    <div class="menu-card">
        <h1>معركة السيطرة الاستراتيجية 🛡️</h1>
        <div class="section-title">اختر علم معسكرك:</div>
        <div class="flag-options" id="player-flags">
            <button class="flag-btn active-player" onclick="playClickSound(); selectFlag('green')">الأخضر</button>
            <button class="flag-btn" onclick="playClickSound(); selectFlag('red')">الأحمر</button>
        </div>
        <button id="start-btn" onclick="playClickSound(); findMatch()">بحث عن صديق للبدء 🔍</button>
    </div>
</div>

<div id="waiting-overlay">
    <div class="spinner"></div>
    <h2>جاري البحث عن الصديق في السيرفر...</h2>
    <p style="color: #94a3b8; font-size: 12px; margin-top: 8px;">ستبدأ المعركة فور انضمام صديقك للغرفة!</p>
</div>

<div id="ui-overlay">
    <div id="hp-labels-container" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden;"></div>

    <div class="top-capture-box">
        <div id="capture-status-text">منطقة السيطرة والنفط: نشطة</div>
        <div class="capture-bar-bg">
            <div id="capture-bar-fill" class="capture-bar-fill" style="width: 50%;"></div>
        </div>
    </div>

    <div class="left-controls-group">
        <div class="selection-controls">
            <button class="sel-btn active" id="sel-all-btn" onclick="playClickSound(); setSelectionMode('all')">الكل</button>
            <button class="sel-btn" id="sel-single-btn" onclick="playClickSound(); setSelectionMode('single')">فردي</button>
        </div>

        <div class="corner-economy">
            <div class="money-row">
                <span style="font-size: 9px; color: #cbd5e1;">الرصيد:</span>
                <div class="money-small"><span id="money-display">500</span>$</div>
            </div>
            <button class="buy-btn-small" id="buy-tank-btn" onclick="playClickSound(); buyPlayerTank('normal')">عادية (150$)</button>
            <button class="buy-btn-small buy-btn-rocket" id="buy-rocket-tank-btn" onclick="playClickSound(); buyPlayerTank('rocket')">صاروخية (300$)</button>
        </div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="floating-msg"></div>

    <div class="cam-controls">
        <button class="cam-btn zoom-in" onmousedown="camMove('zi', true)" onmouseup="camMove('zi', false)">➕ تقريب</button>
        <button class="cam-btn up" onmousedown="camMove('up', true)" onmouseup="camMove('up', false)">⬆️</button>
        <button class="cam-btn zoom-out" onmousedown="camMove('zo', true)" onmouseup="camMove('zo', false)">➖ إبعاد</button>
        <button class="cam-btn left" onmousedown="camMove('left', true)" onmouseup="camMove('left', false)">⬅️</button>
        <button class="cam-btn down" onmousedown="camMove('down', true)" onmouseup="camMove('down', false)">⬇️</button>
        <button class="cam-btn right" onmousedown="camMove('right', true)" onmouseup="camMove('right', false)">➡️</button>
    </div>

    <div class="cam-hint">اسحب بالشاشة وحرك دباباتك نحو العدو 🎯</div>
</div>

<div id="canvas-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
    // مؤثرات صوتية داخلية افتراضية
    function playClickSound() {
        try { let a = new Audio('https://freesound.org/data/previews/608/608688_11861866-lq.mp3'); a.volume = 0.3; a.play(); } catch(e){}
    }
    function playSound(type) {
        try {
            let url = type === 'shoot' ? 'https://freesound.org/data/previews/394/394595_5121236-lq.mp3' : 'https://freesound.org/data/previews/515/515830_6492306-lq.mp3';
            let a = new Audio(url); a.volume = 0.4; a.play();
        } catch(e){}
    }

    let scene, camera, renderer, dirLight;
    let playerFlagType = 'green';
    let socket;
    let remotePlayers = {};

    let cameraRadius = 280, targetCameraRadius = 280;
    let cameraTheta = Math.PI / 4, cameraPhi = Math.PI / 3.5;
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    let camInputs = { up: false, down: false, left: false, right: false, zi: false, zo: false };
    let isDragging = false, previousTouchX = 0, previousTouchY = 0;

    let playerTanks = [];
    let bullets = [];
    let oilWells = []; // آبار النفط الاقتصادية
    let targetMarkerMesh, terrainMesh;
    let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

    const CORNER_OFFSET = 380;
    const MAP_LIMIT = 460;
    let playerMoney = 500;
    let playerBuildCooldown = 0;

    function getTerrainHeight(x, z) {
        let h = Math.sin(x * 0.02) * Math.cos(z * 0.02) * 5 + Math.sin(x * 0.008) * 8;
        if (Math.sqrt(x*x + z*z) < 140) h *= 0.2;
        return h;
    }

    function showFloatingMsg(text) {
        const msg = document.getElementById('floating-msg');
        msg.innerText = text;
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, 2500);
    }

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7dd3fc);
        scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0018);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1500);
        updateCameraPosition();

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        setupLighting();
        createTerrain();
        createBasesAndOilWells(); // إنشاء المعسكرات وأبراج النفط
        createTargetMarker();
        setupInteraction();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    }

    function findMatch() {
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('waiting-overlay').style.display = 'flex';

        // الاتصال بسيرفر الأอนلاين الخاص بك على Render
        socket = io('https://tank-game-server-o650.onrender.com');

        socket.on('connect', () => {
            socket.emit('find_match', { team: playerFlagType });
        });

        socket.on('match_started', () => {
            document.getElementById('waiting-overlay').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            showFloatingMsg('⚔️ انضم الصديق! بدأت المعركة الحقيقية!');
            playSound('shoot');

            let startX = playerFlagType === 'green' ? -CORNER_OFFSET + 45 : CORNER_OFFSET - 45;
            let startZ = playerFlagType === 'green' ? -CORNER_OFFSET + 45 : CORNER_OFFSET - 45;
            targetLookAt.set(startX, getTerrainHeight(startX, startZ), startZ);
            targetCameraRadius = 110;
        });

        socket.on('current_players', (players) => {
            for (let id in players) {
                if (id !== socket.id) createRemoteTank(players[id]);
            }
        });

        socket.on('player_joined', (data) => {
            if (data.id !== socket.id) createRemoteTank(data);
        });

        socket.on('player_moved', (data) => {
            if (remotePlayers[data.id]) {
                remotePlayers[data.id].mesh.position.set(data.x, getTerrainHeight(data.x, data.z), data.z);
                remotePlayers[data.id].mesh.rotation.y = data.rotation;
            }
        });

        socket.on('player_disconnected', (id) => {
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id].mesh);
                delete remotePlayers[id];
                showFloatingMsg('غادر اللاعب الآخر المعركة.');
            }
        });
    }

    function createRemoteTank(data) {
        let color = data.team === 'green' ? 0x2e3b23 : 0x6b3a2a;
        let tank = createTank(data.x, data.z, color, 'enemy', 'normal');
        remotePlayers[data.id] = tank;
    }

    function selectFlag(color) {
        playerFlagType = color;
        document.querySelectorAll('#player-flags .flag-btn').forEach(btn => {
            btn.classList.toggle('active-player', btn.innerText.includes(color === 'green' ? 'الأخضر' : 'الأحمر'));
        });
    }

    function setupLighting() {
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        dirLight = new THREE.DirectionalLight(0xfffbeb, 1.2);
        dirLight.position.set(300, 450, 300);
        scene.add(dirLight);
    }

    function createTerrain() {
        const geo = new THREE.PlaneGeometry(1100, 1100, 50, 50);
        geo.rotateX(-Math.PI / 2);
        let pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) pos.setY(i, getTerrainHeight(pos.getX(i), pos.getZ(i)));
        geo.computeVertexNormals();
        terrainMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.9 }));
        scene.add(terrainMesh);
    }

    function createBasesAndOilWells() {
        // بناء المعسكر الخاص بك مع العلم
        let pColor = playerFlagType === 'green' ? 0x2e3b23 : 0x6b3a2a;
        let startX = playerFlagType === 'green' ? -CORNER_OFFSET + 45 : CORNER_OFFSET - 45;
        let startZ = playerFlagType === 'green' ? -CORNER_OFFSET + 45 : CORNER_OFFSET - 45;
        
        let playerTank = createTank(startX, startZ, pColor, 'player', 'normal');
        playerTanks.push(playerTank);

        // إنشاء أبراج ومضخات النفط في الخريطة لزيادة الموارد
        [ {x: 0, z: 0}, {x: -200, z: 200}, {x: 200, z: -200} ].forEach(pos => {
            let wellGroup = new THREE.Group();
            let baseMat = new THREE.MeshStandardMaterial({color: 0x334155});
            let pipeMat = new THREE.MeshStandardMaterial({color: 0xf59e0b}); // لون النفط/الذهب

            let base = new THREE.Mesh(new THREE.CylinderGeometry(8, 9, 3, 12), baseMat);
            let tank = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 8, 8), pipeMat);
            tank.position.y = 5;
            wellGroup.add(base, tank);

            wellGroup.position.set(pos.x, getTerrainHeight(pos.x, pos.z), pos.z);
            scene.add(wellGroup);
            oilWells.push(wellGroup);
        });
    }

    function createTank(x, z, colorHex, team, type = 'normal') {
        const tankGroup = new THREE.Group();
        const armorMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(6, 2.2, 9), armorMat);
        body.position.y = 1.2; tankGroup.add(body);
        
        const leftTrack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.7, 9.2), trackMat);
        leftTrack.position.set(-3.5, 0.8, 0); tankGroup.add(leftTrack);
        
        const rightTrack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.7, 9.2), trackMat);
        rightTrack.position.set(3.5, 0.8, 0); tankGroup.add(rightTrack);
        
        const turret = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 1.5, 10), armorMat);
        turret.position.y = 2.8; tankGroup.add(turret);
        
        const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 6, 6), armorMat);
        cannon.rotation.x = Math.PI / 2; cannon.position.set(0, 2.8, 4); tankGroup.add(cannon);

        tankGroup.position.set(x, getTerrainHeight(x, z), z);
        scene.add(tankGroup);

        const hpLabel = document.createElement('div');
        hpLabel.className = `tank-hp-label ${team === 'player' ? 'hp-player' : 'hp-enemy'}`;
        hpLabel.innerText = "100";
        document.getElementById('hp-labels-container').appendChild(hpLabel);

        return { mesh: tankGroup, hpLabel, target: null, team, hp: 100, isDestroyed: false };
    }

    function buyPlayerTank(type) {
        if (playerBuildCooldown > 0) return;
        let cost = (type === 'rocket') ? 300 : 150;
        if (playerMoney >= cost) {
            playerMoney -= cost;
            playerBuildCooldown = 1200;
            updateEconomyUI();
            playSound('shoot');
            let startX = playerFlagType === 'green' ? -CORNER_OFFSET + 50 : CORNER_OFFSET - 50;
            let startZ = playerFlagType === 'green' ? -CORNER_OFFSET + 50 : CORNER_OFFSET - 50;
            let pColor = playerFlagType === 'green' ? 0x2e3b23 : 0x6b3a2a;
            let newTank = createTank(startX + (Math.random()-0.5)*20, startZ + (Math.random()-0.5)*20, pColor, 'player', type);
            playerTanks.push(newTank);
            showFloatingMsg('تم نشر دبابة جديدة في المعسكر!');
        }
    }

    function createTargetMarker() {
        const geo = new THREE.RingGeometry(1, 2, 16); geo.rotateX(-Math.PI / 2);
        targetMarkerMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
        targetMarkerMesh.visible = false;
        scene.add(targetMarkerMesh);
    }

    function updateCameraPosition() {
        cameraRadius = THREE.MathUtils.lerp(cameraRadius, targetCameraRadius, 0.15);
        camera.position.x = targetLookAt.x + cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta);
        camera.position.y = targetLookAt.y + cameraRadius * Math.cos(cameraPhi);
        camera.position.z = targetLookAt.z + cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta);
        camera.lookAt(targetLookAt);
    }

    function setupInteraction() {
        const dom = renderer.domElement;
        dom.addEventListener('pointerdown', (e) => {
            isDragging = true; previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            cameraTheta -= (e.clientX - previousTouchX) * 0.008;
            cameraPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, cameraPhi - (e.clientY - previousTouchY) * 0.008));
            previousTouchX = e.clientX; previousTouchY = e.clientY;
        });
        dom.addEventListener('pointerup', (e) => {
            isDragging = false;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(terrainMesh);
            if (intersects.length > 0) {
                let pt = intersects[0].point;
                targetMarkerMesh.position.copy(pt);
                targetMarkerMesh.position.y = getTerrainHeight(pt.x, pt.z) + 0.1;
                targetMarkerMesh.visible = true;
                playerTanks.forEach(t => { if (!t.isDestroyed) t.target = pt.clone(); });
            }
        });
    }

    function camMove(dir, state) { camInputs[dir] = state; }
    function processCameraInputs() {
        const speed = 5.0;
        if (camInputs.up) { targetLookAt.x -= Math.sin(cameraTheta) * speed; targetLookAt.z -= Math.cos(cameraTheta) * speed; }
        if (camInputs.down) { targetLookAt.x += Math.sin(cameraTheta) * speed; targetLookAt.z += Math.cos(cameraTheta) * speed; }
        if (camInputs.left) { targetLookAt.x -= Math.cos(cameraTheta) * speed; targetLookAt.z += Math.sin(cameraTheta) * speed; }
        if (camInputs.right) { targetLookAt.x += Math.cos(cameraTheta) * speed; targetLookAt.z -= Math.sin(cameraTheta) * speed; }
        if (camInputs.zi) targetCameraRadius = Math.max(60, targetCameraRadius - 5);
        if (camInputs.zo) targetCameraRadius = Math.min(550, targetCameraRadius + 5);
    }

    function updateTanksMovement() {
        if (playerBuildCooldown > 0) { playerBuildCooldown--; updateEconomyUI(); }

        playerTanks.forEach(tank => {
            if (tank.isDestroyed) return;
            let isMoving = false;
            if (tank.target) {
                let dist = tank.mesh.position.distanceTo(tank.target);
                if (dist > 1.5) {
                    let dir = new THREE.Vector3().subVectors(tank.target, tank.mesh.position).setY(0).normalize();
                    tank.mesh.rotation.y += (Math.atan2(dir.x, dir.z) - tank.mesh.rotation.y) * 0.15;
                    tank.mesh.position.addScaledVector(dir, 0.35);
                    tank.mesh.position.y = getTerrainHeight(tank.mesh.position.x, tank.mesh.position.z);
                    isMoving = true;
                } else {
                    targetMarkerMesh.visible = false;
                    tank.target = null;
                }
            }

            if (isMoving && socket && socket.connected) {
                socket.emit('player_move', {
                    x: tank.mesh.position.x,
                    z: tank.mesh.position.z,
                    rotation: tank.mesh.rotation.y
                });
            }
        });
    }

    function updateEconomyUI() {
        document.getElementById('money-display').innerText = playerMoney;
        let buyBtn = document.getElementById('buy-tank-btn');
        let rocketBtn = document.getElementById('buy-rocket-tank-btn');
        if (playerBuildCooldown > 0) {
            buyBtn.innerText = `انتظار (${Math.ceil(playerBuildCooldown/60)}ث)`;
            buyBtn.disabled = true; rocketBtn.disabled = true;
        } else {
            buyBtn.innerText = `عادية (150$)`; rocketBtn.innerText = `صاروخية (300$)`;
            buyBtn.disabled = (playerMoney < 150); rocketBtn.disabled = (playerMoney < 300);
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        processCameraInputs();
        updateCameraPosition();
        updateTanksMovement();
        renderer.render(scene, camera);
    }

    window.onload = init;
</script>
</body>
</html>
